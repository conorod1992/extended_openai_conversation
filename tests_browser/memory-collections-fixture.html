<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Memory collection fixture</title>
<style>:root{--primary-text-color:#111;--secondary-text-color:#555;--primary-background-color:#fff;--secondary-background-color:#f5f5f5;--card-background-color:#fff;--divider-color:#ddd;--primary-color:#03a9f4;--text-primary-color:#fff;--error-color:#db4437}body{margin:0;font-family:system-ui}</style></head>
<body><script type="module">
import {createDataCollectionBackend} from './data-collection-backend.mjs';
import '/custom_components/extended_openai_conversation_responses/frontend/memory-management-panel.js';
const backend = createDataCollectionBackend(Number(new URLSearchParams(location.search).get('size') || 100));
const panel = document.createElement('extended-openai-memory-management-panel');
const hass = {user: {id: 'test-user'}, callWS: backend.call};
window.browserHarness = {panel, hass, calls: backend.calls, getState: () => backend.state, windowErrors: [], rejections: []};
window.addEventListener('error', event => browserHarness.windowErrors.push(String(event.error || event.message)));
window.addEventListener('unhandledrejection', event => browserHarness.rejections.push(String(event.reason)));
window.dataCollectionBackend = backend;
document.body.append(panel);
panel.hass = hass;
</script></body></html>
