query_image:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    model:
      example: gpt-4.1-mini
      selector:
        text:
    api_mode:
      default: auto
      selector:
        select:
          options:
            - label: Auto
              value: auto
            - label: Chat Completions
              value: chat_completions
            - label: Responses
              value: responses
    prompt:
      example: "What’s in this image?"
      required: true
      selector:
        text:
          multiline: true
    images:
      example: '{"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Gfp-wisconsin-madison-the-nature-boardwalk.jpg/2560px-Gfp-wisconsin-madison-the-nature-boardwalk.jpg"}'
      required: true
      default: []
      selector:
        object:
    max_tokens:
      example: 300
      default: 300
      selector:
        number:
          min: 1
          mode: box
change_config:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    api_key:
      selector:
        text:
          type: password
    base_url:
      example: https://api.openai.com/v1
      selector:
        text:
    api_version:
      selector:
        text:
    organization:
      selector:
        text:
    skip_authentication:
      selector:
        boolean:
    api_provider:
      example: openai
      selector:
        select:
          options:
            - openai
            - azure
          mode: dropdown
download_skill:
  name: Download skill
  description: Download a skill from the GitHub repository and install it to the user skills directory. Available skills can be found at https://github.com/conorod1992/extended_openai_conversation/tree/develop/examples/skills
  fields:
    skill_name:
      required: true
      example: crypto
      description: Name of the skill to download (e.g., crypto, weather, calendar)
      selector:
        text:
reload_skills:
  name: Reload skills
  description: Reload all skills from the user skills directory to pick up changes or newly added skills
memory_list:
  name: List memories
  description: List or search persistent memories for the calling Home Assistant user.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    agent_id:
      required: true
      description: Conversation agent. Legacy action calls may also use its subentry ID.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
    query:
      description: Optional search query. Leave empty to browse memories.
      selector:
        text:
    category:
      description: Optional category filter.
      selector:
        text:
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 100
          mode: box
    offset:
      default: 0
      selector:
        number:
          min: 0
          mode: box
memory_delete:
  name: Delete memories
  description: Permanently delete selected persistent memories for the calling Home Assistant user.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    agent_id:
      required: true
      description: Conversation agent. Legacy action calls may also use its subentry ID.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
    memory_ids:
      required: true
      description: One or more memory IDs returned by memory_list.
      selector:
        object:
memory_clear:
  name: Clear memories
  description: Permanently clear all memories, or one category, for the calling Home Assistant user.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    agent_id:
      required: true
      description: Conversation agent. Legacy action calls may also use its subentry ID.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
    category:
      description: Optional category to clear. Leave empty to clear all memories in your user scope.
      selector:
        text:
    confirm:
      required: true
      default: false
      description: Must be enabled to confirm this destructive action.
      selector:
        boolean:
