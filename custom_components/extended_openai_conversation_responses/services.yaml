broadcast:
  name: Broadcast spoken message
  description: Send a TTS announcement to selected Assist satellites without interrupting busy voice sessions. Broadcast must be enabled from Extended OpenAI first.
  fields:
    message:
      name: Message
      description: Text to announce.
      required: true
      selector:
        text:
          multiline: true
    whole_home:
      name: Whole home
      description: Send to every announcement-capable Assist satellite except the origin.
      default: false
      selector:
        boolean:
    entity_id:
      name: Assist satellites
      description: One or more Assist satellite entities.
      selector:
        entity:
          multiple: true
          filter:
            domain: assist_satellite
    device_id:
      name: Devices
      description: Devices whose Assist satellites should receive the announcement.
      selector:
        device:
          multiple: true
    area_id:
      name: Areas
      description: Areas whose Assist satellites should receive the announcement.
      selector:
        area:
          multiple: true
    floor_id:
      name: Floors
      description: Floors whose Assist satellites should receive the announcement.
      selector:
        floor:
          multiple: true
    label_id:
      name: Labels
      description: Labels whose Assist satellites should receive the announcement.
      selector:
        label:
          multiple: true
    ttl_seconds:
      name: Queue expiry
      description: Maximum number of seconds a busy satellite may wait for delivery.
      default: 120
      selector:
        number:
          min: 5
          max: 3600
          mode: box
query_image:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    model:
      example: gpt-4.1-mini
      selector:
        text:
    api_mode:
      default: auto
      selector:
        select:
          options:
            - label: Auto
              value: auto
            - label: Chat Completions
              value: chat_completions
            - label: Responses
              value: responses
    prompt:
      example: "What’s in this image?"
      required: true
      selector:
        text:
          multiline: true
    images:
      example: '{"url": "https://upload.wikimedia.org/wikipedia/commons/thumb/d/dd/Gfp-wisconsin-madison-the-nature-boardwalk.jpg/2560px-Gfp-wisconsin-madison-the-nature-boardwalk.jpg"}'
      required: true
      default: []
      selector:
        object:
    max_tokens:
      example: 300
      default: 300
      selector:
        number:
          min: 1
          mode: box
call_function:
  name: Call configured function
  description: Call an enabled Extended OpenAI configured function from a Request Rule action sequence.
  fields:
    function:
      required: true
      description: Exact configured Function Tool name.
      selector:
        text:
    arguments:
      description: Function arguments. Request Rule captured values are available as templates such as {{ item }}.
      selector:
        object:
process:
  name: Process request directly
  description: Send text through the selected Extended OpenAI agent's normal processing pipeline without re-entering Home Assistant conversation routing.
  fields:
    text:
      required: true
      example: "Turn off the kitchen light"
      selector:
        text:
          multiline: true
    agent_id:
      description: Optional when only one Extended OpenAI conversation agent is available.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
    conversation_id:
      description: Optional conversation ID to continue an existing conversation.
      selector:
        text:
    device_id:
      description: Optional source device ID used for normal voice ownership and continuity rules.
      selector:
        text:
    satellite_id:
      description: Optional Assist satellite ID used for normal voice ownership and continuity rules.
      selector:
        text:
    language:
      description: Optional language code. Defaults to Home Assistant's language.
      selector:
        language:
change_config:
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    api_key:
      selector:
        text:
          type: password
    base_url:
      example: https://api.openai.com/v1
      selector:
        text:
    api_version:
      selector:
        text:
    organization:
      selector:
        text:
    skip_authentication:
      selector:
        boolean:
    api_provider:
      example: openai
      selector:
        select:
          options:
            - openai
            - azure
          mode: dropdown
download_skill:
  name: Download skill
  description: Download a skill from the GitHub repository and install it to the user skills directory. Available skills can be found at https://github.com/conorod1992/extended_openai_conversation/tree/develop/examples/skills
  fields:
    skill_name:
      required: true
      example: crypto
      description: Name of the skill to download (e.g., crypto, weather, calendar)
      selector:
        text:
reload_skills:
  name: Reload skills
  description: Reload all skills from the user skills directory to pick up changes or newly added skills
memory_list:
  name: List memories
  description: List or search persistent memories for the calling Home Assistant user.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    agent_id:
      required: true
      description: Conversation agent. Legacy action calls may also use its subentry ID.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
    query:
      description: Optional search query. Leave empty to browse memories.
      selector:
        text:
    category:
      description: Optional category filter.
      selector:
        text:
    limit:
      default: 50
      selector:
        number:
          min: 1
          max: 100
          mode: box
    offset:
      default: 0
      selector:
        number:
          min: 0
          mode: box
memory_delete:
  name: Delete memories
  description: Permanently delete selected persistent memories for the calling Home Assistant user.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    agent_id:
      required: true
      description: Conversation agent. Legacy action calls may also use its subentry ID.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
    memory_ids:
      required: true
      description: One or more memory IDs returned by memory_list.
      selector:
        object:
memory_clear:
  name: Clear memories
  description: Permanently clear all memories, or one category, for the calling Home Assistant user.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    agent_id:
      required: true
      description: Conversation agent. Legacy action calls may also use its subentry ID.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
    category:
      description: Optional category to clear. Leave empty to clear all memories in your user scope.
      selector:
        text:
    confirm:
      required: true
      default: false
      description: Must be enabled to confirm this destructive action.
      selector:
        boolean:
enable_function_tools:
  name: Enable Function Tools
  description: Enable one or more configured Function Tools for a conversation agent. This administrator action is not exposed to the model automatically.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    agent_id:
      required: true
      description: Conversation agent. Legacy action calls may also use its subentry ID.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
    functions:
      required: true
      description: One or more configured model-facing Function Tool names.
      selector:
        text:
          multiple: true
disable_function_tools:
  name: Disable Function Tools
  description: Disable one or more configured Function Tools so their schemas are withheld and calls are rejected. This administrator action is not exposed to the model automatically.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    agent_id:
      required: true
      description: Conversation agent. Legacy action calls may also use its subentry ID.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
    functions:
      required: true
      description: One or more configured model-facing Function Tool names.
      selector:
        text:
          multiple: true
guest_mode_update:
  name: Update Guest Mode
  description: Set or replace the Guest Mode interval for a conversation agent. This trusted administrator action may shorten or move the interval.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    agent_id:
      required: true
      description: Conversation agent. Legacy action calls may also use its subentry ID.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
    active_from:
      description: ISO 8601 start time. Leave empty to start now.
      selector:
        datetime:
    active_until:
      description: ISO 8601 end time. Ignored when indefinite is enabled.
      selector:
        datetime:
    indefinite:
      default: false
      selector:
        boolean:
guest_mode_disable:
  name: End Guest Mode
  description: Immediately end active Guest Mode or cancel a future schedule for a conversation agent.
  fields:
    config_entry:
      required: true
      selector:
        config_entry:
          integration: extended_openai_conversation_responses
    agent_id:
      required: true
      description: Conversation agent. Legacy action calls may also use its subentry ID.
      selector:
        entity:
          filter:
            integration: extended_openai_conversation_responses
            domain: conversation
