name: PR20 patch

on:
  push:
    branches:
      - fix/pr20-stream-terminal-refusal

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr20-stream-terminal-refusal
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Apply and validate patch
        shell: bash
        run: |
          python .github/pr20_patch.py
          python -m pip install --quiet ruff
          ruff format custom_components/extended_openai_conversation_responses/entity.py tests/test_responses_api.py tests/test_pr20_stream_terminal_refusal.py
          ruff check custom_components/extended_openai_conversation_responses/entity.py tests/test_responses_api.py tests/test_pr20_stream_terminal_refusal.py
          python -m py_compile custom_components/extended_openai_conversation_responses/entity.py tests/test_pr20_stream_terminal_refusal.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr20-apply.yml .github/pr20_patch.py
          git add custom_components/extended_openai_conversation_responses/entity.py tests/test_responses_api.py tests/test_pr20_stream_terminal_refusal.py
          git commit -m "Fix streaming refusals and terminal validation"
          git push origin HEAD:fix/pr20-stream-terminal-refusal
