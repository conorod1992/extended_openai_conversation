name: HA Dev CI Image

on:
  pull_request:
    paths:
      - "ci/Dockerfile.dev"
      - "ci/Dockerfile.typecheck"
      - "ci/typecheck_image_key.py"
      - "ci/check_ha_dev_image.py"
      - "ci/install_ha_dependencies.py"
      - "ci/install_ha_media_dependencies.py"
      - "ci/reconcile_ha_dev_environment.sh"
      - "ci/check_ha_dev_environment.py"
      - "requirements_test.txt"
      - "custom_components/extended_openai_conversation_responses/manifest.json"
      - ".github/workflows/ci-image-dev.yml"
  push:
    branches:
      - develop
    paths:
      - "ci/Dockerfile.dev"
      - "ci/Dockerfile.typecheck"
      - "ci/typecheck_image_key.py"
      - "ci/check_ha_dev_image.py"
      - "ci/install_ha_dependencies.py"
      - "ci/install_ha_media_dependencies.py"
      - "ci/reconcile_ha_dev_environment.sh"
      - "requirements_test.txt"
      - "custom_components/extended_openai_conversation_responses/manifest.json"
      - ".github/workflows/ci-image-dev.yml"
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ha-dev-ci-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-dev
  HA_CORE_REPO: home-assistant/core

jobs:
  build:
    name: Build pinned HA dev CI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve current Home Assistant dev snapshot
        id: ha
        run: |
          HA_CORE_SHA="$(git ls-remote "https://github.com/${HA_CORE_REPO}.git" refs/heads/dev | awk '{print $1}')"
          test -n "$HA_CORE_SHA"
          PYTHON_VERSION="$(curl -fsSL "https://raw.githubusercontent.com/${HA_CORE_REPO}/$HA_CORE_SHA/.python-version" | tr -d '\n')"
          test -n "$PYTHON_VERSION"
          echo "sha=$HA_CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "python-version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          get_package_version() {
            local manifest="$1"
            local package="$2"
            echo "$manifest" | grep -o "\"$package==[^\"]*\"" | sed "s/\"$package==//;s/\"//"
          }

          OPENAI_MANIFEST="$(curl -fsSL "https://raw.githubusercontent.com/${HA_CORE_REPO}/$HA_CORE_SHA/homeassistant/components/openai_conversation/manifest.json")"
          CONVERSATION_MANIFEST="$(curl -fsSL "https://raw.githubusercontent.com/${HA_CORE_REPO}/$HA_CORE_SHA/homeassistant/components/conversation/manifest.json")"
          REST_MANIFEST="$(curl -fsSL "https://raw.githubusercontent.com/${HA_CORE_REPO}/$HA_CORE_SHA/homeassistant/components/rest/manifest.json")"
          SCRAPE_MANIFEST="$(curl -fsSL "https://raw.githubusercontent.com/${HA_CORE_REPO}/$HA_CORE_SHA/homeassistant/components/scrape/manifest.json")"

          OPENAI_VERSION="$(get_package_version "$OPENAI_MANIFEST" "openai")"
          HASSIL_VERSION="$(get_package_version "$CONVERSATION_MANIFEST" "hassil")"
          HA_INTENTS_VERSION="$(get_package_version "$CONVERSATION_MANIFEST" "home-assistant-intents")"
          XMLTODICT_VERSION="$(get_package_version "$REST_MANIFEST" "xmltodict")"
          BEAUTIFULSOUP4_VERSION="$(get_package_version "$SCRAPE_MANIFEST" "beautifulsoup4")"
          LXML_VERSION="$(get_package_version "$SCRAPE_MANIFEST" "lxml")"

          for value in "$OPENAI_VERSION" "$HASSIL_VERSION" "$HA_INTENTS_VERSION" "$XMLTODICT_VERSION" "$BEAUTIFULSOUP4_VERSION" "$LXML_VERSION"; do
            test -n "$value"
          done

          echo "openai-version=$OPENAI_VERSION" >> "$GITHUB_OUTPUT"
          echo "hassil-version=$HASSIL_VERSION" >> "$GITHUB_OUTPUT"
          echo "home-assistant-intents-version=$HA_INTENTS_VERSION" >> "$GITHUB_OUTPUT"
          echo "xmltodict-version=$XMLTODICT_VERSION" >> "$GITHUB_OUTPUT"
          echo "beautifulsoup4-version=$BEAUTIFULSOUP4_VERSION" >> "$GITHUB_OUTPUT"
          echo "lxml-version=$LXML_VERSION" >> "$GITHUB_OUTPUT"

          echo "HA dev: $HA_CORE_SHA"
          echo "Python: $PYTHON_VERSION"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Type Check image key
        id: typecheck-key
        env:
          PYTHON_VERSION: ${{ steps.ha.outputs.python-version }}
          OPENAI_VERSION: ${{ steps.ha.outputs.openai-version }}
          HASSIL_VERSION: ${{ steps.ha.outputs.hassil-version }}
          HA_INTENTS_VERSION: ${{ steps.ha.outputs.home-assistant-intents-version }}
          XMLTODICT_VERSION: ${{ steps.ha.outputs.xmltodict-version }}
          BEAUTIFULSOUP4_VERSION: ${{ steps.ha.outputs.beautifulsoup4-version }}
          LXML_VERSION: ${{ steps.ha.outputs.lxml-version }}
        run: echo "key=$(python ci/typecheck_image_key.py)" >> "$GITHUB_OUTPUT"

      - name: Record image build time
        id: image-time
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish HA dev image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile.dev
          target: ha-dev
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            HA_CORE_SHA=${{ steps.ha.outputs.sha }}
            IMAGE_BUILT_AT=${{ steps.image-time.outputs.created }}
            PYTHON_VERSION=${{ steps.ha.outputs.python-version }}
          tags: |
            ${{ env.IMAGE_NAME }}:ha-dev
            ${{ env.IMAGE_NAME }}:ha-dev-${{ steps.ha.outputs.sha }}
          cache-from: type=gha,scope=ha-dev-ci-image
          cache-to: type=gha,mode=max,scope=ha-dev-ci-image

      - name: Build and publish Type Check image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile.typecheck
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            TYPECHECK_ENV_KEY=${{ steps.typecheck-key.outputs.key }}
            PYTHON_VERSION=${{ steps.ha.outputs.python-version }}
            OPENAI_VERSION=${{ steps.ha.outputs.openai-version }}
            HASSIL_VERSION=${{ steps.ha.outputs.hassil-version }}
            HA_INTENTS_VERSION=${{ steps.ha.outputs.home-assistant-intents-version }}
            XMLTODICT_VERSION=${{ steps.ha.outputs.xmltodict-version }}
            BEAUTIFULSOUP4_VERSION=${{ steps.ha.outputs.beautifulsoup4-version }}
            LXML_VERSION=${{ steps.ha.outputs.lxml-version }}
          tags: |
            ${{ env.IMAGE_NAME }}:typecheck
            ${{ env.IMAGE_NAME }}:typecheck-${{ steps.typecheck-key.outputs.key }}
          cache-from: type=gha,scope=typecheck-ci-image
          cache-to: type=gha,mode=max,scope=typecheck-ci-image

      - name: Verify published image
        if: github.event_name != 'pull_request'
        run: |
          docker pull "${IMAGE_NAME}:ha-dev"
          docker run --rm "${IMAGE_NAME}:ha-dev" bash -lc '
            python /opt/eoai-ci/check_ha_dev_environment.py
            test "$(cat /opt/eoai-ci/ha-core-sha)" = "${{ steps.ha.outputs.sha }}"
            python -c "from importlib.metadata import version; print(\"homeassistant=\" + version(\"homeassistant\")); print(\"pytest-homeassistant-custom-component=\" + version(\"pytest-homeassistant-custom-component\"))"
          '
          python ci/check_ha_dev_image.py "${IMAGE_NAME}:ha-dev" "${{ steps.ha.outputs.sha }}"
          docker pull "${IMAGE_NAME}:typecheck-${{ steps.typecheck-key.outputs.key }}"
          docker run --rm "${IMAGE_NAME}:typecheck-${{ steps.typecheck-key.outputs.key }}" bash -lc '
            test "$(cat /opt/eoai-ci/typecheck-image-key)" = "${{ steps.typecheck-key.outputs.key }}"
            test -s /opt/eoai-ci/typecheck-environment.txt
            mypy --version
            pip check
          '

      - name: Publish image summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### HA dev CI image"
            echo
            echo "HA dev image: `${IMAGE_NAME}:ha-dev`"
            echo "Type Check image: `${IMAGE_NAME}:typecheck-${{ steps.typecheck-key.outputs.key }}`"
            echo "HA Core: `${{ steps.ha.outputs.sha }}`"
            echo "Python: `${{ steps.ha.outputs.python-version }}`"
          } >> "$GITHUB_STEP_SUMMARY"
