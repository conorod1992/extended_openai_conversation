name: HA Dev CI Image

on:
  pull_request:
    paths:
      - "ci/Dockerfile.dev"
      - "ci/install_ha_dependencies.py"
      - "ci/install_ha_media_dependencies.py"
      - "ci/reconcile_ha_dev_environment.sh"
      - "requirements_test.txt"
      - "custom_components/extended_openai_conversation_responses/manifest.json"
      - ".github/workflows/ci-image-dev.yml"
  push:
    branches:
      - develop
    paths:
      - "ci/Dockerfile.dev"
      - "ci/install_ha_dependencies.py"
      - "ci/install_ha_media_dependencies.py"
      - "ci/reconcile_ha_dev_environment.sh"
      - "requirements_test.txt"
      - "custom_components/extended_openai_conversation_responses/manifest.json"
      - ".github/workflows/ci-image-dev.yml"
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ha-dev-ci-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-dev
  HA_CORE_REPO: home-assistant/core

jobs:
  build:
    name: Build pinned HA dev CI image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve current Home Assistant dev snapshot
        id: ha
        run: |
          HA_CORE_SHA="$(git ls-remote "https://github.com/${HA_CORE_REPO}.git" refs/heads/dev | awk '{print $1}')"
          test -n "$HA_CORE_SHA"
          PYTHON_VERSION="$(curl -fsSL "https://raw.githubusercontent.com/${HA_CORE_REPO}/$HA_CORE_SHA/.python-version" | tr -d '\n')"
          test -n "$PYTHON_VERSION"
          echo "sha=$HA_CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "python-version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "HA dev: $HA_CORE_SHA"
          echo "Python: $PYTHON_VERSION"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and publish HA dev image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile.dev
          target: ha-dev
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            HA_CORE_SHA=${{ steps.ha.outputs.sha }}
            PYTHON_VERSION=${{ steps.ha.outputs.python-version }}
          tags: |
            ${{ env.IMAGE_NAME }}:ha-dev
            ${{ env.IMAGE_NAME }}:ha-dev-${{ steps.ha.outputs.sha }}
          cache-from: type=gha,scope=ha-dev-ci-image
          cache-to: type=gha,mode=max,scope=ha-dev-ci-image

      - name: Verify published image
        if: github.event_name != 'pull_request'
        run: |
          docker pull "${IMAGE_NAME}:ha-dev"
          docker run --rm "${IMAGE_NAME}:ha-dev" bash -lc '
            pip check
            test "$(cat /opt/eoai-ci/ha-core-sha)" = "${{ steps.ha.outputs.sha }}"
            python -c "from importlib.metadata import version; print(\"homeassistant=\" + version(\"homeassistant\")); print(\"pytest-homeassistant-custom-component=\" + version(\"pytest-homeassistant-custom-component\"))"
          '

      - name: Publish image summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### HA dev CI image"
            echo
            echo "Image: `${IMAGE_NAME}:ha-dev`"
            echo "HA Core: `${{ steps.ha.outputs.sha }}`"
            echo "Python: `${{ steps.ha.outputs.python-version }}`"
          } >> "$GITHUB_STEP_SUMMARY"
