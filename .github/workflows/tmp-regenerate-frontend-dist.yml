name: Temporary regenerate frontend dist

on:
  push:
    branches:
      - cleanup/frontend-management-micro-modules

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Regenerate frontend dist')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cleanup/frontend-management-micro-modules
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Commit generated frontend bundle
        run: |
          if git diff --quiet -- custom_components/extended_openai_conversation_responses/frontend/dist/; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/frontend/dist/
          git commit -m "Regenerate frontend dist"
          git push origin HEAD:cleanup/frontend-management-micro-modules
