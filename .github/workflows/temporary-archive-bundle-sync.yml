name: Temporary archive frontend asset sync

on:
  push:
    branches:
      - fix/lossless-editors-rule-rename

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build tracked production frontend
        working-directory: frontend
        run: npm run build
      - name: Commit only generated frontend assets
        shell: bash
        run: |
          set -euo pipefail
          git add custom_components/extended_openai_conversation_responses/frontend/dist/
          if git diff --staged --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild conversation history bundle for reverse paging"
          git push origin HEAD:refs/heads/fix/lossless-editors-rule-rename
