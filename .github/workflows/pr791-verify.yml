name: Temp PR791 Frontend Verify

on:
  push:
    branches:
      - perf/overview-progressive-cold-load

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: perf/overview-progressive-cold-load
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check shipped frontend modules
        run: |
          find custom_components/extended_openai_conversation_responses/frontend             -maxdepth 1 -type f -name '*.js' -print0             | xargs -0 -n1 node --check
          find tests -maxdepth 1 -type f -name '*.test.mjs' -print0             | sort -z             | xargs -0 -n1 node
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- custom_components/extended_openai_conversation_responses/frontend/dist/; then
            echo "Bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/frontend/dist/
          git commit -m "Rebuild frontend bundle"
          git push origin HEAD:perf/overview-progressive-cold-load
