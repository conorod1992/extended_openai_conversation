name: Temporary PR 1279 frontend bundle rebuild

on:
  push:
    branches:
      - fix/lossless-editors-rule-rename
    paths:
      - .github/workflows/temporary-pr1279-bundle-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: github.repository == 'conorod1992/extended_openai_conversation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/lossless-editors-rule-rename
          persist-credentials: true
      - name: Use pinned frontend Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Build with locked dependencies
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run build --prefix frontend
          python ci/check_frontend_bundle.py
      - name: Commit only generated frontend assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- custom_components/extended_openai_conversation_responses/frontend/dist/
          if git diff --cached --quiet; then
            echo "Frontend assets already current"
            exit 0
          fi
          git commit -m "build: regenerate tracked frontend assets for Quiet Hours wording"
          git push origin HEAD:refs/heads/fix/lossless-editors-rule-rename
# Re-run after the revised Quiet Hours copy fits the existing bundle budget.
