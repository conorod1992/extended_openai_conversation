name: Temporary frontend policy contract check

on:
  push:
    branches:
      - test/frontend-policy-contract-v2

permissions:
  contents: read

jobs:
  check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: test/frontend-policy-contract-v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Syntax check policy tests
        run: |
          node --check tests/frontend-policy-contract.test.mjs
          node --check tests_browser/frontend-policy-contract.spec.mjs
      - name: Run static policy contract
        run: node tests/frontend-policy-contract.test.mjs
