name: PR17 routing and format fix

on:
  push:
    branches:
      - fix/pr17-request-rule-determinism

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr17-request-rule-determinism
      - name: Apply focused routing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/extended_openai_conversation_responses/request_rules.py')
          text = path.read_text()

          replacements = [
              (
                  'def _duplicate_rule_name(\n    source_name: str, rules: Sequence[Mapping[str, Any]]\n) -> str:\n',
                  'def _duplicate_rule_name(source_name: str, rules: Sequence[Mapping[str, Any]]) -> str:\n',
              ),
              (
                  '''        return RuleEvaluation(\n            match,\n            rule["match_type"] in {"equals", "sentence_pattern"},\n            action["success_response"],\n            request_override,\n        )\n''',
                  '''        return RuleEvaluation(\n            match,\n            rule["match_type"] in {"equals", "sentence_pattern"},\n            resolve_slot_values(action["success_response"], match.slots),\n            request_override,\n        )\n''',
              ),
              (
                  '''    return RuleEvaluation(\n        match,\n        consume,\n        action["success_response"] if consume else None,\n        request_override,\n    )\n''',
                  '''    return RuleEvaluation(\n        match,\n        consume,\n        (\n            resolve_slot_values(action["success_response"], match.slots)\n            if consume\n            else None\n        ),\n        request_override,\n    )\n''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'Expected one match, got {text.count(old)}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)

          test_path = Path('tests/test_request_rules_pr17.py')
          test = test_path.read_text()
          old = '''    model_rule = routing_rule(\n        rule_id="model",\n        phrase="use {model_name}",\n        match_type="sentence_pattern",\n        model="{model_name}",\n    )\n    result = await async_evaluate_rule(\n'''
          new = '''    model_rule = routing_rule(\n        rule_id="model",\n        phrase="use {model_name}",\n        match_type="sentence_pattern",\n        model="{model_name}",\n    )\n    model_rule["action"]["success_response"] = "Using {model_name}"\n    result = await async_evaluate_rule(\n'''
          if test.count(old) != 1:
              raise SystemExit('Expected captured model test block once')
          test = test.replace(old, new)
          old = '''    assert result is not None\n    assert runtime.get("session")[CONF_CHAT_MODEL] == "gpt-5"\n'''
          new = '''    assert result is not None\n    assert result.response == "Using gpt-5"\n    assert runtime.get("session")[CONF_CHAT_MODEL] == "gpt-5"\n'''
          if test.count(old) != 1:
              raise SystemExit('Expected captured model assertion block once')
          test_path.write_text(test.replace(old, new))
          PY
      - name: Commit focused fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add custom_components/extended_openai_conversation_responses/request_rules.py tests/test_request_rules_pr17.py
          git commit -m "Resolve captured routing responses and formatting"
          git push origin HEAD:fix/pr17-request-rule-determinism
