name: Temporary Ruff formatter

on:
  push:
    branches:
      - fix/gpt6-astra-compatibility

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/gpt6-astra-compatibility

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Apply Ruff formatting
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff format \
            custom_components/extended_openai_conversation_responses/const.py \
            custom_components/extended_openai_conversation_responses/helpers.py \
            custom_components/extended_openai_conversation_responses/entity.py

      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            custom_components/extended_openai_conversation_responses/const.py \
            custom_components/extended_openai_conversation_responses/helpers.py \
            custom_components/extended_openai_conversation_responses/entity.py
          git commit -m "Apply Ruff formatting"
          git push origin HEAD:fix/gpt6-astra-compatibility
