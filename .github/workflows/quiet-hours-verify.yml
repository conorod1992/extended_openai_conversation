name: Quiet Hours branch verification

on:
  push:
    branches:
      - feature/quiet-hours-v2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements_test.txt ruff
          python -m pip install openai hassil xmltodict beautifulsoup4 lxml
      - name: Format focused Python files
        run: |
          files=(custom_components/extended_openai_conversation_responses/quiet_hours.py custom_components/extended_openai_conversation_responses/quiet_hours_runtime.py tests/test_quiet_hours.py tests_real_ha/test_quiet_hours.py)
          python -m ruff check --fix "${files[@]}"
          python -m ruff format "${files[@]}"
          if ! git diff --quiet -- "${files[@]}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${files[@]}"
            git commit -m "Format Quiet Hours implementation"
            git push
          fi
      - name: Ruff
        run: |
          python -m ruff check custom_components/extended_openai_conversation_responses/quiet_hours.py custom_components/extended_openai_conversation_responses/quiet_hours_runtime.py tests/test_quiet_hours.py tests_real_ha/test_quiet_hours.py
          python -m ruff format --check custom_components/extended_openai_conversation_responses/quiet_hours.py custom_components/extended_openai_conversation_responses/quiet_hours_runtime.py tests/test_quiet_hours.py tests_real_ha/test_quiet_hours.py
      - name: Quiet Hours unit tests
        run: python -m pytest -q tests/test_quiet_hours.py
      - name: Quiet Hours real HA tests
        run: python -m pytest -q tests_real_ha/test_quiet_hours.py
      - name: Frontend syntax
        run: |
          node --check custom_components/extended_openai_conversation_responses/frontend/quiet-hours-ui.js
          node --check custom_components/extended_openai_conversation_responses/frontend/agent-config-loader.js
