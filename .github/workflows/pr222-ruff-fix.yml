name: PR222 Ruff cleanup

on:
  push:
    branches:
      - feature/unified-export-backup-import-restore

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-export-backup-import-restore
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Apply repository Ruff rules to changed Python modules
        shell: bash
        run: |
          pip install ruff==0.16.6
          ruff check --fix custom_components/extended_openai_conversation_responses/transfer.py custom_components/extended_openai_conversation_responses/backup_transfer.py
          ruff format custom_components/extended_openai_conversation_responses/transfer.py custom_components/extended_openai_conversation_responses/backup_transfer.py
          ruff check custom_components/extended_openai_conversation_responses/transfer.py custom_components/extended_openai_conversation_responses/backup_transfer.py
          ruff format --check custom_components/extended_openai_conversation_responses/transfer.py custom_components/extended_openai_conversation_responses/backup_transfer.py
          rm .github/workflows/pr222-ruff-fix.yml
      - name: Commit Ruff cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format unified transfer modules"
          git push origin HEAD:feature/unified-export-backup-import-restore
