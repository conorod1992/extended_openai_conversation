name: Temp PR802 Ruff Format

on:
  push:
    branches:
      - perf/guest-knowledge-progressive-loading

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/guest-knowledge-progressive-loading
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.14.5"
      - run: pip install ruff==0.13.2
      - run: ruff format custom_components/extended_openai_conversation_responses/management_ui.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/management_ui.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format Guest Mode management changes"
          git push origin HEAD:perf/guest-knowledge-progressive-loading
