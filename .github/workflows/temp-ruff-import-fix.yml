name: Temporary Ruff import fix

on:
  push:
    branches:
      - fix/durable-delayed-tool-lifecycle

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/durable-delayed-tool-lifecycle
      - run: |
          pip install ruff
          ruff check --fix custom_components/extended_openai_conversation_responses/__init__.py
          if git diff --quiet -- custom_components/extended_openai_conversation_responses/__init__.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/__init__.py
          git commit -m "Sort delayed scheduler startup import"
          git push origin HEAD:fix/durable-delayed-tool-lifecycle
