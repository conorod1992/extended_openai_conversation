name: PR221 context wrapper compatibility fix

on:
  push:
    branches:
      - feature/correctable-function-tool-recovery

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/correctable-function-tool-recovery
          fetch-depth: 0

      - name: Restore transformer wrapper contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/extended_openai_conversation_responses/context_usage_hardening.py")
          text = path.read_text()

          signature_line = "        recovery_state: Any = None,\n"
          if text.count(signature_line) != 2:
              raise SystemExit(
                  f"expected two recovery_state wrapper parameters, found {text.count(signature_line)}"
              )
          text = text.replace(signature_line, "")

          replacements = {
              '''        async for item in original_chat_transform(\n            entity, chat_log, normalized_stream(), request_usage, recovery_state\n        ):''':
              '''        async for item in original_chat_transform(\n            entity, chat_log, normalized_stream(), request_usage\n        ):''',
              '''        async for item in original_responses_transform(\n            entity, chat_log, normalized_stream(), request_usage, recovery_state\n        ):''':
              '''        async for item in original_responses_transform(\n            entity, chat_log, normalized_stream(), request_usage\n        ):''',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one wrapper-call match, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path(".github/workflows/pr221-context-wrapper-fix.yml").unlink()
          PY

      - name: Commit wrapper compatibility fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore usage wrapper stream compatibility"
          git push origin HEAD:feature/correctable-function-tool-recovery
