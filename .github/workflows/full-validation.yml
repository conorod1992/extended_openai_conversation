name: Full validation

run-name: Full validation Â· ${{ inputs.mode || 'full' }} Â· seed=${{ inputs.seed || 'random' }} Â· dev=${{ inputs.ha_dev_sha || 'resolve' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full coverage or quick (skip Enhanced long-lifetime and iOS; no release certification)
        required: true
        type: choice
        default: quick
        options: [full, quick]
      seed:
        description: Optional reproducible seed for enhanced stress
        required: false
        type: string

      ha_dev_sha:
        description: Optional full Home Assistant dev commit SHA for replay
        required: false
        type: string

permissions:
  actions: write
  contents: write
  checks: write

concurrency:
  group: full-validation-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch selected CI test lanes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Dispatch test workflows and record the pending cohort
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.sha }}
          GH_REF: ${{ github.ref_name }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_RUN_ATTEMPT: ${{ github.run_attempt }}
          FULL_VALIDATION_SEED: ${{ inputs.seed }}
          FULL_VALIDATION_HA_DEV_SHA: ${{ inputs.ha_dev_sha }}
          FULL_VALIDATION_MODE: ${{ inputs.mode }}
          FULL_VALIDATION_EXPLICIT_SEED: ${{ inputs.seed }}
          FULL_VALIDATION_ASYNC: "1"
        run: python3 ci/full_validation.py
      - name: Preserve exact validation cohort for release certification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-validation-cohort
          path: full-validation-cohort.json
          if-no-files-found: error
          retention-days: 14
