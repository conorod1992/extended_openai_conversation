name: OpenAI SDK Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read
  packages: read

jobs:
  sdk-contract:
    name: SDK wire contract / ${{ matrix.sdk }}
    continue-on-error: ${{ matrix.sdk == 'latest-3x-early-warning' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["2.21.0", "2.45.0", "3.10.0", latest-3x-early-warning]
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      EOAI_CONTAINER_IMAGE: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
    steps:
      - name: Checkout exact invocation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select SDK version for early warning
        run: |
          set -euo pipefail
          if [ "${{ matrix.sdk }}" = "latest-3x-early-warning" ]; then
            # Experimental only; this does not widen the manifest's tested range.
            SPEC='openai>=3.10.0,<4'
          else
            SPEC="openai==${{ matrix.sdk }}"
          fi
          python -m pip install --upgrade "$SPEC"
          python -m pip check
          python -c 'import openai; print("OpenAI SDK under test:", openai.__version__)'
      - name: Run focused real SDK wire contract
        run: |
          python -m pytest -q \
            tests/test_openai_sdk_wire.py \
            tests/test_openai_sdk_malformed_wire.py \
            tests/test_openai_sdk_error_matrix.py \
            tests/test_openai_sdk_catalog_matrix.py \
            tests/test_openai_sdk_multicall_wire.py \
            tests/test_openai_sdk_ha_compatibility.py \
            tests/test_openai_compat.py
      - name: Record exact-source SDK evidence
        if: always()
        env:
          ENHANCED_JOB_STATUS: ${{ job.status }}
          EVIDENCE_LANE: ${{ matrix.sdk }}
        run: python ci/workflow_evidence.py sdk workflow-evidence.json
      - name: Upload exact-source SDK evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-evidence-${{ matrix.sdk }}
          path: workflow-evidence.json
          if-no-files-found: error
          retention-days: 30
