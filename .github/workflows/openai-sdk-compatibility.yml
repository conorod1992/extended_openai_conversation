name: OpenAI SDK Compatibility

on:
  workflow_dispatch:
    inputs:
      ha_dev_sha:
        description: Optional immutable Home Assistant dev commit supplied by Full Validation
        type: string
        required: false
  workflow_call:
    inputs:
      ha_dev_sha:
        description: Optional immutable Home Assistant dev commit supplied by Full Validation
        type: string
        required: false
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read
  packages: read

jobs:
  sdk-contract:
    name: SDK wire contract / ${{ matrix.sdk }}
    continue-on-error: ${{ matrix.sdk == 'latest-3x-early-warning' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["2.21.0", "2.45.0", "3.10.0", "3.26.0", latest-3x-early-warning]
        include:
          - sdk: "2.21.0"
            ha: "2026.7.0"
          - sdk: "2.45.0"
            ha: "2026.8.0"
          - sdk: "3.10.0"
            ha: "2026.10.0"
          - sdk: "3.26.0"
            ha: stable
          - sdk: latest-3x-early-warning
            ha: stable
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      EOAI_CONTAINER_IMAGE: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      ADVISORY_SDK_SPEC: openai>3.26.0,<4
    steps:
      - name: Checkout exact invocation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install native build tools for isolated snapshots
        # The runtime image omits its builder's compiler. Older HA snapshots
        # can require source builds of their declared audio dependencies.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++
      - name: Reconcile a compatible Home Assistant snapshot
        run: |
          set -euo pipefail
          VERSION="${{ matrix.ha }}"
          if [ "$VERSION" = stable ]; then
            VERSION="$(python -c 'import json; from urllib.request import urlopen; print(json.load(urlopen("https://pypi.org/pypi/homeassistant/json", timeout=30))["info"]["version"])')"
          fi
          # A current image can retain dependencies not used by older HA.
          # Use a clean venv; install integration dependencies from the selected
          # HA manifests via the existing reconciliation script. Gazetteer is a
          # bootstrap for current HA, not a universal historical requirement.
          python -m venv "$RUNNER_TEMP/sdk-venv"
          source "$RUNNER_TEMP/sdk-venv/bin/activate"
          echo "$RUNNER_TEMP/sdk-venv/bin" >> "$GITHUB_PATH"
          export EOAI_TEST_REQUIREMENTS="$RUNNER_TEMP/sdk-test-requirements.txt"
          grep -v '^gazetteer-matcher==' requirements_test.txt > "$EOAI_TEST_REQUIREMENTS"
          PLUGIN_VERSION="$(python ci/resolve_ha_test_plugin.py "$VERSION")"
          export EOAI_EXPECTED_HA_VERSION="$VERSION"
          export EOAI_EXPECTED_HA_TEST_PLUGIN_VERSION="$PLUGIN_VERSION"
          bash ci/reconcile_stable_environment.sh
          echo "EOAI_EXPECTED_HA_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Check advisory SDK eligibility
        id: advisory
        if: matrix.sdk == 'latest-3x-early-warning'
        run: python ci/sdk_advisory.py "$ADVISORY_SDK_SPEC"
      - name: Select SDK version for early warning
        if: steps.advisory.outputs.unavailable_reason == ''
        run: |
          set -euo pipefail
          if [ "${{ matrix.sdk }}" = "latest-3x-early-warning" ]; then
            # Experimental only; this does not widen the manifest's tested range.
            SPEC="$ADVISORY_SDK_SPEC"
          else
            SPEC="openai==${{ matrix.sdk }}"
          fi
          # Do not turn a wire pass into evidence for an unsupported HA/SDK pair.
          # An exact incompatible advisory pin is reported before this step.
          # Other installation failures still fail the job.
          CONSTRAINTS="$(python -c 'from pathlib import Path; import homeassistant; print(Path(homeassistant.__file__).parent / "package_constraints.txt")')"
          python -m pip install --upgrade --constraint "$CONSTRAINTS" "$SPEC"
          python -m pip check
          python -c 'import openai; print("OpenAI SDK under test:", openai.__version__)'
      - name: Run focused real SDK wire contract
        if: steps.advisory.outputs.unavailable_reason == ''
        run: |
          python -m pytest -q \
            tests/test_openai_sdk_wire.py \
            tests/test_provider_output_classification.py tests/test_provider_output_budget.py tests/test_responses_stream_order.py \
            tests/test_responses_history_coherence.py \
            tests_stress/test_provider_real_connection_pool.py::test_explicit_prompt_cache_crosses_supported_sdk_wire \
            tests/test_openai_sdk_malformed_wire.py \
            tests/test_openai_sdk_error_matrix.py \
            tests/test_openai_sdk_catalog_matrix.py \
            tests/test_openai_sdk_multicall_wire.py \
            tests/test_openai_sdk_ha_compatibility.py \
            tests/test_openai_compat.py
      - name: Record exact-source SDK evidence
        if: always()
        env:
          ENHANCED_JOB_STATUS: ${{ job.status }}
          EVIDENCE_LANE: ${{ matrix.sdk }}
          SDK_UNAVAILABLE_REASON: ${{ steps.advisory.outputs.unavailable_reason }}
        run: python ci/workflow_evidence.py sdk workflow-evidence.json
      - name: Upload exact-source SDK evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdk-evidence-${{ matrix.sdk }}
          path: workflow-evidence.json
          if-no-files-found: error
          retention-days: 30

  ha-manifest-constraints:
    name: Manifest requirements / HA ${{ matrix.track }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        track: [oldest-supported, stable, dev]
    steps:
      - name: Checkout exact invocation source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve Home Assistant source and constraints
        id: ha
        env:
          HA_TRACK: ${{ matrix.track }}
          REQUESTED_HA_DEV_SHA: ${{ inputs.ha_dev_sha }}
        run: |
          set -euo pipefail
          case "$HA_TRACK" in
            oldest-supported)
              ref="$(python3 -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')"
              ;;
            stable)
              ref="$(python3 -c 'import json; from urllib.request import urlopen; print(json.load(urlopen("https://pypi.org/pypi/homeassistant/json", timeout=30))["info"]["version"])')"
              ;;
            dev)
              ref="$(python3 ci/ha_dev_snapshot.py --sha "$REQUESTED_HA_DEV_SHA")"
              ;;
          esac
          [[ "$ref" =~ ^([0-9]{4}\.[0-9]+\.[0-9]+|[0-9a-f]{40})$ ]]
          echo "Home Assistant $HA_TRACK: $ref"
          base_url="https://raw.githubusercontent.com/home-assistant/core/$ref"
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            "$base_url/homeassistant/package_constraints.txt" \
            --output "$RUNNER_TEMP/ha-package-constraints.txt"
          python_version="$(curl --fail --silent --show-error --retry 3 --max-time 30 "$base_url/.python-version" | cut -d. -f1,2)"
          [[ "$python_version" =~ ^[0-9]+\.[0-9]+$ ]]
          echo "python-version=$python_version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.ha.outputs.python-version }}
      - name: Check all declared integration requirements
        run: python ci/check_ha_manifest_constraints.py "$RUNNER_TEMP/ha-package-constraints.txt"
