name: EOAI deployment architecture acceptance

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-native:
    name: Packaged install / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: x86_64-native
          - runner: ubuntu-24.04-arm
            label: arm64-native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant and test dependencies
        run: |
          python -m pip install --upgrade pip
          VERSION="$(curl -fsSL https://pypi.org/pypi/homeassistant/json | python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')"
          PLUGIN_VERSION="$(python ci/resolve_ha_test_plugin.py "$VERSION")"
          pip install -r requirements_test.txt
          python ci/install_ha_test_plugin.py "$VERSION" "$PLUGIN_VERSION"
          echo "EOAI_EXPECTED_HA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "EOAI_EXPECTED_HA_TEST_PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"
          python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          python -m pip check
      - name: Stage production-style component payload
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/eoai-package"
          mkdir -p "$DEST"
          cp -a custom_components/extended_openai_conversation_responses "$DEST/"
          echo "RELEASE_COMPONENT_DIR=$DEST/extended_openai_conversation_responses" >> "$GITHUB_ENV"
          echo "RELEASE_EXPECTED_VERSION=$(python -c 'import json; print(json.load(open("custom_components/extended_openai_conversation_responses/manifest.json"))["version"])')" >> "$GITHUB_ENV"
          echo "EOAI_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          case "${{ matrix.label }}" in
            x86_64-native) test "$(uname -m)" = x86_64 ;;
            arm64-native) [[ "$(uname -m)" =~ ^(aarch64|arm64)$ ]] ;;
          esac
      - name: Exercise packaged install and compact native runtime
        run: |
          pytest \
            tests_real_ha/test_packaged_release.py \
            tests_real_ha/test_store_write_process_crash.py \
            tests_stress/test_file_edit_native_cancellation.py::test_cancelled_native_edit_retains_path_until_worker_settles \
            tests_stress/test_function_provider_wire_remaining.py::test_sqlite_lock_deadline_and_worker_recovery_on_public_assist \
            tests_stress/test_function_provider_wire_remaining.py::test_bash_exited_leader_pipe_descendants_settle_on_public_assist \
            tests_real_ha/test_ai_task_provider_wire.py::test_plain_and_structured_ai_tasks_cross_sdk_wire \
            -v -s --asyncio-mode=auto --timeout=300 --tb=short
      - name: Exercise independent HA installation and cold-start recovery
        run: |
          python -m venv "$RUNNER_TEMP/isolated-ha"
          "$RUNNER_TEMP/isolated-ha/bin/python" -m pip install "homeassistant==$EOAI_EXPECTED_HA_VERSION"
          python ci/isolated_install_acceptance.py \
            --runtime-python "$RUNNER_TEMP/isolated-ha/bin/python" \
            --component "$RELEASE_COMPONENT_DIR" \
            --work "$RUNNER_TEMP/isolated-acceptance"
      - name: Record native architecture identity
        run: |
          mkdir -p deployment-evidence
          python - <<'PY'
          import json, platform, subprocess
          from importlib.metadata import version
          from pathlib import Path
          Path("deployment-evidence/architecture.json").write_text(json.dumps({
              "native": True,
              "machine": platform.machine(),
              "candidate_sha": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "homeassistant": version("homeassistant"),
              "runtime_boundaries": ["atomic_store_process_kill", "native_edit_settlement", "sqlite_lock_worker", "bash_descendant_cleanup", "chat_and_responses_sdk"],
          }, indent=2))
          PY
      - name: Upload isolated runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-deployment-${{ matrix.label }}
          path: ${{ runner.temp }}/isolated-acceptance/evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-${{ matrix.label }}
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 14
