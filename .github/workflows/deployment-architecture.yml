name: EOAI deployment architecture acceptance

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packaged-native:
    name: Packaged install / ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            label: x86_64-native
          - runner: ubuntu-24.04-arm
            label: arm64-native
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install Home Assistant and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install homeassistant
          python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
      - name: Stage production-style component payload
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/eoai-package"
          mkdir -p "$DEST"
          cp -a custom_components/extended_openai_conversation_responses "$DEST/"
          echo "RELEASE_COMPONENT_DIR=$DEST/extended_openai_conversation_responses" >> "$GITHUB_ENV"
          echo "RELEASE_EXPECTED_VERSION=$(python -c 'import json; print(json.load(open("custom_components/extended_openai_conversation_responses/manifest.json"))["version"])')" >> "$GITHUB_ENV"
          echo "EOAI_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          case "${{ matrix.label }}" in
            x86_64-native) test "$(uname -m)" = x86_64 ;;
            arm64-native) [[ "$(uname -m)" =~ ^(aarch64|arm64)$ ]] ;;
          esac
      - name: Exercise clean packaged install
        run: |
          pytest tests_real_ha/test_packaged_release.py -v -s --asyncio-mode=auto --timeout=300 --tb=short
      - name: Record native architecture identity
        run: |
          mkdir -p deployment-evidence
          python - <<'PY'
          import json, platform
          from pathlib import Path
          Path("deployment-evidence/architecture.json").write_text(json.dumps({
              "native": True,
              "machine": platform.machine(),
          }, indent=2))
          PY
      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-${{ matrix.label }}
          path: deployment-evidence/
          if-no-files-found: warn
          retention-days: 14
