name: Apply PR18 Request Rule safety fixes

on:
  push:
    branches:
      - fix/pr18-request-rule-execution-safety

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr18-request-rule-execution-safety
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply focused PR18 patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_section(path, start, end, body):
              p = Path(path)
              text = p.read_text()
              start_at = text.find(start)
              if start_at < 0:
                  raise SystemExit(f"{path}: start marker not found: {start!r}")
              end_at = text.find(end, start_at + len(start))
              if end_at < 0:
                  raise SystemExit(f"{path}: end marker not found: {end!r}")
              p.write_text(text[:start_at] + body + text[end_at:])

          request_rules = "custom_components/extended_openai_conversation_responses/request_rules.py"
          replace_once(
              request_rules,
              'JINJA_SLOT_REFERENCE = re.compile(r"\\{\\{\\s*([A-Za-z_][A-Za-z0-9_]{0,63})\\s*\\}\\}")',
              'JINJA_SLOT_REFERENCE = re.compile(\n    r"\\{\\{\\s*(?:request\\.slots\\.)?([A-Za-z_][A-Za-z0-9_]{0,63})\\s*\\}\\}"\n)',
          )
          replace_once(
              request_rules,
              '    response: str | None = None\n    request_override: dict[str, str] | None = None\n\n\nclass RequestRuleStore',
              '    response: str | None = None\n    request_override: dict[str, str] | None = None\n    successful: bool = True\n\n\nclass RequestRuleStore',
          )

          replace_section(
              request_rules,
              'def rule_has_sensitive_actions(rule: Mapping[str, Any]) -> bool:\n',
              '\n\nasync def async_call_active_function',
              '''def _iter_script_actions(\n    sequence: Sequence[Mapping[str, Any]],\n    *,\n    depth: int = 0,\n    budget: list[int] | None = None,\n):\n    """Yield executable action mappings from native nested script branches."""\n    if depth > MAX_SCRIPT_DEPTH:\n        raise ValueError(f"action sequence exceeds maximum depth {MAX_SCRIPT_DEPTH}")\n    if budget is None:\n        budget = [0]\n\n    def nested_sequence(value: Any):\n        if not isinstance(value, Sequence) or isinstance(value, (str, bytes)):\n            return None\n        if not all(isinstance(child, Mapping) for child in value):\n            return None\n        return cast(Sequence[Mapping[str, Any]], value)\n\n    for item in sequence:\n        budget[0] += 1\n        if budget[0] > MAX_SCRIPT_NODES:\n            raise ValueError(f"action sequence exceeds {MAX_SCRIPT_NODES} nodes")\n        yield item\n\n        for key in ("sequence", "then", "else", "default", "parallel"):\n            nested = nested_sequence(item.get(key))\n            if nested is not None:\n                yield from _iter_script_actions(\n                    nested, depth=depth + 1, budget=budget\n                )\n\n        choose = item.get("choose")\n        if isinstance(choose, Sequence) and not isinstance(choose, (str, bytes)):\n            for branch in choose:\n                if not isinstance(branch, Mapping):\n                    continue\n                nested = nested_sequence(branch.get("sequence"))\n                if nested is not None:\n                    yield from _iter_script_actions(\n                        nested, depth=depth + 1, budget=budget\n                    )\n\n        repeat = item.get("repeat")\n        if isinstance(repeat, Mapping):\n            nested = nested_sequence(repeat.get("sequence"))\n            if nested is not None:\n                yield from _iter_script_actions(\n                    nested, depth=depth + 1, budget=budget\n                )\n\n\ndef rule_has_sensitive_actions(rule: Mapping[str, Any]) -> bool:\n    """Flag tolerant matching for sensitive actions anywhere in a script tree."""\n    if rule.get("action_type") != "local_action":\n        return False\n    actions = cast(Mapping[str, Any], rule.get("action", {})).get("actions", [])\n    for action in _iter_script_actions(cast(Sequence[Mapping[str, Any]], actions)):\n        service_name = str(action.get("action", action.get("service", "")))\n        domain, _, service = service_name.casefold().partition(".")\n        if domain in SENSITIVE_DOMAINS or (\n            domain == "cover" and any(term in service for term in ("open", "close"))\n        ):\n            return True\n    return False\n''',
          )

          replace_section(
              request_rules,
              'def _resolve_guest_slot_templates(value: Any, slots: Mapping[str, str]) -> Any:\n',
              '\n\ndef _resolved_routing_value',
              '''def _resolve_guest_slot_templates(value: Any, slots: Mapping[str, str]) -> Any:\n    """Resolve only deterministic captured-value templates for Guest preflight."""\n\n    def replace_slot(match: re.Match[str]) -> str:\n        name = match.group(1)\n        if name not in slots:\n            raise GuestModeDenied(GUEST_MODE_UNAVAILABLE)\n        return slots[name]\n\n    if isinstance(value, str):\n        rendered = JINJA_SLOT_REFERENCE.sub(replace_slot, value)\n        if "{{" in rendered or "{%" in rendered or "{#" in rendered:\n            raise GuestModeDenied(GUEST_MODE_UNAVAILABLE)\n        return rendered\n    if isinstance(value, Mapping):\n        return {\n            key: _resolve_guest_slot_templates(item, slots)\n            for key, item in value.items()\n        }\n    if isinstance(value, list):\n        return [_resolve_guest_slot_templates(item, slots) for item in value]\n    return value\n\n\ndef _guest_script_allowed(\n    hass: HomeAssistant,\n    sequence: Sequence[Mapping[str, Any]],\n    policy: GuestCapabilityPolicy,\n) -> bool:\n    """Preauthorize every executable action before a Guest script can start."""\n    for item in _iter_script_actions(sequence):\n        action_name = item.get("action", item.get("service"))\n        if action_name is not None:\n            if not isinstance(action_name, str):\n                return False\n            if action_name == f"{DOMAIN}.{SERVICE_CALL_FUNCTION}":\n                data = item.get("data", {})\n                if not isinstance(data, Mapping):\n                    return False\n                function_name = data.get("function")\n                if not isinstance(function_name, str) or not policy.allows_configured_tool(\n                    function_name\n                ):\n                    return False\n                continue\n            if not guest_arguments_allowed_runtime(\n                hass,\n                item,\n                policy,\n                control=True,\n                require_entity_selector=True,\n            ):\n                return False\n        elif any(key in item for key in ("device_id", "event", "event_type")):\n            # Device and event actions do not provide an entity-scoped boundary.\n            return False\n    return True\n''',
          )

          replace_section(
              request_rules,
              '    if rule["action_type"] == "local_action":\n',
              '    if action["reset"]:\n',
              '''    if rule["action_type"] == "local_action":\n        policy = guest_policy or GuestCapabilityPolicy.unrestricted()\n        executable_actions = action["actions"]\n        if policy.guest_active:\n            try:\n                executable_actions = _resolve_guest_slot_templates(\n                    executable_actions, match.slots\n                )\n                allowed = _guest_script_allowed(\n                    hass,\n                    cast(Sequence[Mapping[str, Any]], executable_actions),\n                    policy,\n                )\n            except GuestModeDenied:\n                allowed = False\n            except Exception:\n                _LOGGER.exception(\n                    "Guest authorization failed for Request Rule %s", rule["id"]\n                )\n                allowed = False\n            if not allowed:\n                return RuleEvaluation(\n                    match, True, GUEST_MODE_UNAVAILABLE, successful=False\n                )\n        try:\n            schema_actions = cv.SCRIPT_SCHEMA(executable_actions)\n            validated_actions = await async_validate_actions_config(\n                hass, schema_actions\n            )\n            script = Script(\n                hass,\n                validated_actions,\n                f"Request Rule {rule['id']}",\n                DOMAIN,\n                log_exceptions=False,\n            )\n            token = _ACTIVE_FUNCTION_EXECUTOR.set(function_executor)\n            try:\n                await script.async_run(\n                    {\n                        **match.slots,\n                        "request": {"slots": dict(match.slots)},\n                    },\n                    context,\n                )\n            finally:\n                _ACTIVE_FUNCTION_EXECUTOR.reset(token)\n                await script.async_unload()\n        except GuestModeDenied:\n            return RuleEvaluation(\n                match, True, GUEST_MODE_UNAVAILABLE, successful=False\n            )\n        except Exception:\n            _LOGGER.exception("Request Rule local action failed for %s", rule["id"])\n            return RuleEvaluation(\n                match,\n                True,\n                resolve_slot_values(action["failure_response"], match.slots),\n                successful=False,\n            )\n        return RuleEvaluation(\n            match, True, resolve_slot_values(action["success_response"], match.slots)\n        )\n\n''',
          )

          conversation = "custom_components/extended_openai_conversation_responses/conversation.py"
          replace_once(
              conversation,
              '                        source_device_id,\n                    )',
              '                        source_device_id,\n                        successful=evaluation.successful,\n                    )',
          )
          replace_section(
              conversation,
              '    async def _async_complete_local_rule(\n',
              '    async def _async_execute_request_rule_function(\n',
              '''    async def _async_complete_local_rule(\n        self,\n        user_input: ConversationInput,\n        chat_log: ChatLog,\n        response: str,\n        archive_session: ArchiveSession | None,\n        continuity_key: str | None,\n        source_device_id: str | None,\n        *,\n        successful: bool,\n    ) -> ConversationResult:\n        """Finalize a locally consumed rule as a zero-provider-request run."""\n        if self._usage is not None:\n            async with self._usage.async_run(\n                home_assistant_conversation_id=user_input.conversation_id,\n                source_device_id=source_device_id,\n            ) as run:\n                result = self._local_rule_result(user_input, chat_log, response)\n                if not successful:\n                    self._usage.mark_current_run_failed("RequestRuleExecutionFailed")\n                await self._async_archive_turn(\n                    archive_session,\n                    run.run_id,\n                    user_input,\n                    chat_log,\n                    successful=successful,\n                )\n        else:\n            result = self._local_rule_result(user_input, chat_log, response)\n            await self._async_archive_turn(\n                archive_session,\n                None,\n                user_input,\n                chat_log,\n                successful=successful,\n            )\n        assert self._continuity is not None\n        if successful:\n            await self._continuity.async_record_success(\n                continuity_key, chat_log.content\n            )\n        else:\n            await self._continuity.async_release(continuity_key)\n        return result\n\n''',
          )

          management = "custom_components/extended_openai_conversation_responses/management_ui.py"
          replace_once(
              management,
              'from .request_rules import (\n    async_get_request_rules,\n    rule_has_sensitive_actions,\n    validate_rule,\n)',
              'from .request_rules import (\n    async_get_request_rules,\n    get_request_rule_runtime,\n    rule_has_sensitive_actions,\n    validate_rule,\n)',
          )
          replace_once(
              management,
              'WS_COMMAND = f"{DOMAIN}/management"\n_UI_SETUP = f"{DOMAIN}.management_ui_setup"',
              '''WS_COMMAND = f"{DOMAIN}/management"\n_UI_SETUP = f"{DOMAIN}.management_ui_setup"\n\n\ndef _reset_request_rule_runtime(\n    hass: HomeAssistant, entry_id: str, subentry_id: str, continuity_key: str\n) -> None:\n    """Clear Request Rule routing state for one ended continuity session."""\n    get_request_rule_runtime(hass, entry_id, subentry_id).reset(\n        f"continuity:{continuity_key}"\n    )''',
          )
          replace_once(
              management,
              '                if function_groups is not None:\n                    function_groups.end(f"continuity:{continuity_key}")\n            return {"ended": int(ended)}',
              '                if function_groups is not None:\n                    function_groups.end(f"continuity:{continuity_key}")\n                _reset_request_rule_runtime(\n                    hass, entry_id, subentry_id, continuity_key\n                )\n            return {"ended": int(ended)}',
          )

          state_safety = "custom_components/extended_openai_conversation_responses/frontend/management-state-safety.js"
          replace_section(
              state_safety,
              'function dialogState(dialog) {\n',
              '\n\nexport function dialogHasUnsavedChanges',
              '''function dialogState(dialog) {\n  if (!dialog) return [];\n  return [...dialog.querySelectorAll("input,select,textarea,ha-selector")]\n    .filter((control) => !["button", "submit", "reset", "file", "search"].includes(control.type))\n    .map((control) => {\n      const isSelector = String(control.tagName || "").toUpperCase() === "HA-SELECTOR";\n      return {\n        id: control.id || control.name || "",\n        type: control.type || control.tagName,\n        checked: "checked" in control ? Boolean(control.checked) : undefined,\n        value: isSelector ? clone(control.value ?? null) : control.value,\n      };\n    });\n}\n''',
          )

          ui = "custom_components/extended_openai_conversation_responses/frontend/request-rules-ui-impl.js"
          replace_once(
              ui,
              'const sensitivityLabel = (value) => value >= 93 ? "Conservative" : value >= 88 ? "Normal" : "Tolerant";\nconst sensitivityValue = (value) => value === "Conservative" ? 94 : value === "Tolerant" ? 84 : 90;',
              '''export const fuzzyThresholdValue = (value) => {\n  const parsed = Number(value);\n  return Number.isInteger(parsed) && parsed >= 70 && parsed <= 100 ? parsed : 90;\n};''',
          )
          replace_once(
              ui,
              '<span class="matching-control"><select id="${prefix}-threshold" ${values.fuzzy ? "" : "disabled"}><option ${sensitivityLabel(values.fuzzy_threshold) === "Conservative" ? "selected" : ""}>Conservative</option><option ${sensitivityLabel(values.fuzzy_threshold) === "Normal" ? "selected" : ""}>Normal</option><option ${sensitivityLabel(values.fuzzy_threshold) === "Tolerant" ? "selected" : ""}>Tolerant</option></select></span>',
              '<span class="matching-control"><input id="${prefix}-threshold" type="number" min="70" max="100" step="1" value="${fuzzyThresholdValue(values.fuzzy_threshold)}" ${values.fuzzy ? "" : "disabled"}></span>',
          )
          replace_once(
              ui,
              '`${rule.action.model || "Current model"}${rule.action.reasoning_effort ? ` · ${rule.action.reasoning_effort} reasoning` : ""} · ${rule.action.scope === "conversation" ? "rest of conversation" : "this request"}`',
              '`${panel._e(rule.action.model || "Current model")}${rule.action.reasoning_effort ? ` · ${panel._e(rule.action.reasoning_effort)} reasoning` : ""} · ${rule.action.scope === "conversation" ? "rest of conversation" : "this request"}`',
          )
          p = Path(ui)
          text = p.read_text()
          text = text.replace('sensitivityLabel(rule?.matching?.fuzzy_threshold ?? 90)', 'String(fuzzyThresholdValue(rule?.matching?.fuzzy_threshold ?? 90))')
          text = text.replace('sensitivityValue(', 'fuzzyThresholdValue(')
          p.write_text(text)
          replace_once(
              ui,
              'export function friendlyFieldChange(value) {\n  return value === undefined || value === null || value === "" ? {operation:"delete"} : {operation:"set", value};\n}',
              '''export function friendlyFieldChange(value) {\n  return value === undefined || value === null || value === "" ? {operation:"delete"} : {operation:"set", value};\n}\n\nexport async function recoverRequestRuleMutation(panel, error, label) {\n  const message = error?.message || String(error || "Unknown error");\n  panel._toast?.(`${label}: ${message}`, true);\n  const cacheKey = panel._sectionCacheKey?.();\n  if (cacheKey) panel._sectionCache?.delete(cacheKey);\n  try {\n    await panel._loadSection(true);\n  } catch (refreshError) {\n    const refreshMessage = refreshError?.message || String(refreshError || "Unknown error");\n    panel._toast?.(`Unable to refresh Request Rules: ${refreshMessage}`, true);\n  }\n}''',
          )

          replace_once(
              ui,
              '  root.querySelectorAll(".rule-duplicate").forEach((button) => button.addEventListener("click", async () => { await panel._call("request_rules", "duplicate", {rule_id:button.dataset.id}); await panel._loadSection(); }));\n  root.querySelectorAll(".rule-delete").forEach((button) => button.addEventListener("click", async () => { if (!await panel._confirm("Delete Request Rule?", "This cannot be undone.", "Delete")) return; await panel._call("request_rules", "delete", {rule_id:button.dataset.id, confirm:true}); await panel._loadSection(); }));\n  root.querySelectorAll(".rule-enabled").forEach((input) => input.addEventListener("change", async () => { const rule = rules.find((item) => item.id === input.dataset.id); await panel._call("request_rules", "update", {rule_id:rule.id, rule:{...rule, enabled:input.checked, sensitive_matching_warning:undefined}}); await panel._loadSection(true); }));',
              '''  root.querySelectorAll(".rule-duplicate").forEach((button) => button.addEventListener("click", async () => {\n    try { await panel._call("request_rules", "duplicate", {rule_id:button.dataset.id}); await panel._loadSection(); }\n    catch (err) { await recoverRequestRuleMutation(panel, err, "Unable to duplicate Request Rule"); }\n  }));\n  root.querySelectorAll(".rule-delete").forEach((button) => button.addEventListener("click", async () => {\n    if (!await panel._confirm("Delete Request Rule?", "This cannot be undone.", "Delete")) return;\n    try { await panel._call("request_rules", "delete", {rule_id:button.dataset.id, confirm:true}); await panel._loadSection(); }\n    catch (err) { await recoverRequestRuleMutation(panel, err, "Unable to delete Request Rule"); }\n  }));\n  root.querySelectorAll(".rule-enabled").forEach((input) => input.addEventListener("change", async () => {\n    const rule = rules.find((item) => item.id === input.dataset.id);\n    try { await panel._call("request_rules", "update", {rule_id:rule.id, rule:{...rule, enabled:input.checked, sensitive_matching_warning:undefined}}); await panel._loadSection(true); }\n    catch (err) { input.checked = Boolean(rule.enabled); await recoverRequestRuleMutation(panel, err, "Unable to update Request Rule"); }\n  }));''',
          )
          replace_once(
              ui,
              '  q("#rules-default-save")?.addEventListener("click", async () => { await panel._call("request_rules", "defaults", {defaults:{word_forms:q("#rules-default-word-forms").checked, wording_alternatives:q("#rules-default-wording").checked, fuzzy:q("#rules-default-fuzzy").checked, fuzzy_threshold:fuzzyThresholdValue(q("#rules-default-threshold").value)}}); await panel._loadSection(); });',
              '''  q("#rules-default-save")?.addEventListener("click", async () => {\n    try { await panel._call("request_rules", "defaults", {defaults:{word_forms:q("#rules-default-word-forms").checked, wording_alternatives:q("#rules-default-wording").checked, fuzzy:q("#rules-default-fuzzy").checked, fuzzy_threshold:fuzzyThresholdValue(q("#rules-default-threshold").value)}}); await panel._loadSection(); }\n    catch (err) { await recoverRequestRuleMutation(panel, err, "Unable to save Request Rule defaults"); }\n  });''',
          )
          replace_once(
              ui,
              '  q("#wording-save")?.addEventListener("click", async () => { const wording_groups = [...root.querySelectorAll(".wording-group")].map((row) => ({canonical:row.querySelector(".wording-canonical").value.trim(), alternatives:row.querySelector(".wording-alternatives").value.split(",").map((item) => item.trim()).filter(Boolean)})); await panel._call("request_rules", "wording_groups", {wording_groups}); await panel._loadSection(); });',
              '''  q("#wording-save")?.addEventListener("click", async () => {\n    const wording_groups = [...root.querySelectorAll(".wording-group")].map((row) => ({canonical:row.querySelector(".wording-canonical").value.trim(), alternatives:row.querySelector(".wording-alternatives").value.split(",").map((item) => item.trim()).filter(Boolean)}));\n    try { await panel._call("request_rules", "wording_groups", {wording_groups}); await panel._loadSection(); }\n    catch (err) { await recoverRequestRuleMutation(panel, err, "Unable to save wording alternatives"); }\n  });''',
          )

          Path("tests/test_request_rules_pr18.py").write_text(r'''"""PR18 Request Rule execution-safety regressions."""

from contextlib import asynccontextmanager
from types import SimpleNamespace
from typing import Any

import pytest

from custom_components.extended_openai_conversation_responses.const import (
    DOMAIN,
    SERVICE_CALL_FUNCTION,
)
from custom_components.extended_openai_conversation_responses.conversation import (
    ExtendedOpenAIAgentEntity,
)
from custom_components.extended_openai_conversation_responses.guest_mode import (
    GUEST_MODE_UNAVAILABLE,
    GuestCapabilityPolicy,
    GuestModeDenied,
)
from custom_components.extended_openai_conversation_responses.management_ui import (
    _reset_request_rule_runtime,
)
from custom_components.extended_openai_conversation_responses.request_rules import (
    RuleMatch,
    _guest_script_allowed,
    _resolve_guest_slot_templates,
    async_evaluate_rule,
    get_request_rule_runtime,
    rule_has_sensitive_actions,
)


def test_nested_sensitive_action_is_detected() -> None:
    rule = {
        "action_type": "local_action",
        "action": {
            "actions": [
                {
                    "choose": [
                        {
                            "conditions": [],
                            "sequence": [
                                {
                                    "action": "lock.unlock",
                                    "target": {"entity_id": "lock.front_door"},
                                }
                            ],
                        }
                    ]
                }
            ]
        },
    }
    assert rule_has_sensitive_actions(rule)


def test_guest_preflight_checks_nested_configured_functions() -> None:
    actions = [
        {"delay": "00:00:01"},
        {
            "choose": [
                {
                    "conditions": [],
                    "sequence": [
                        {
                            "action": f"{DOMAIN}.{SERVICE_CALL_FUNCTION}",
                            "data": {"function": "owner_only", "arguments": {}},
                        }
                    ],
                }
            ]
        },
    ]
    policy = GuestCapabilityPolicy(True, configured_tool_names=frozenset())
    assert not _guest_script_allowed(SimpleNamespace(), actions, policy)


def test_guest_slot_templates_allow_only_deterministic_captures() -> None:
    assert _resolve_guest_slot_templates(
        {
            "data": {
                "direct": "{{ item }}",
                "qualified": "{{ request.slots.item }}",
            }
        },
        {"item": "milk"},
    ) == {"data": {"direct": "milk", "qualified": "milk"}}

    with pytest.raises(GuestModeDenied):
        _resolve_guest_slot_templates("{{ request.slots.missing }}", {"item": "milk"})
    with pytest.raises(GuestModeDenied):
        _resolve_guest_slot_templates("{{ item | upper }}", {"item": "milk"})


@pytest.mark.asyncio
async def test_guest_denial_happens_before_script_execution(monkeypatch: pytest.MonkeyPatch) -> None:
    constructed = False

    class FailIfConstructed:
        def __init__(self, *args: Any, **kwargs: Any) -> None:
            nonlocal constructed
            constructed = True

    import custom_components.extended_openai_conversation_responses.request_rules as module

    monkeypatch.setattr(module, "Script", FailIfConstructed)
    rule = {
        "id": "nested-guest",
        "name": "Nested guest action",
        "match_type": "equals",
        "action_type": "local_action",
        "action": {
            "actions": [
                {"delay": "00:00:01"},
                {
                    "choose": [
                        {
                            "conditions": [],
                            "sequence": [
                                {
                                    "action": f"{DOMAIN}.{SERVICE_CALL_FUNCTION}",
                                    "data": {
                                        "function": "owner_only",
                                        "arguments": {},
                                    },
                                }
                            ],
                        }
                    ]
                },
            ],
            "success_response": "Done",
            "failure_response": "Failed",
        },
    }

    class Rules:
        def match(self, _text: str) -> RuleMatch:
            return RuleMatch(rule, "run it", False, 100.0)

    evaluation = await async_evaluate_rule(
        SimpleNamespace(),
        Rules(),  # type: ignore[arg-type]
        SimpleNamespace(),  # type: ignore[arg-type]
        "run it",
        "continuity:test",
        guest_policy=GuestCapabilityPolicy(
            True, configured_tool_names=frozenset()
        ),
    )
    assert evaluation is not None
    assert evaluation.response == GUEST_MODE_UNAVAILABLE
    assert evaluation.successful is False
    assert constructed is False


@pytest.mark.asyncio
async def test_failed_local_rule_is_archived_and_recorded_as_failed() -> None:
    class Usage:
        def __init__(self) -> None:
            self.run = SimpleNamespace(run_id="run-1", successful=True, error_type=None)

        @asynccontextmanager
        async def async_run(self, **_kwargs: Any):
            yield self.run

        def mark_current_run_failed(self, error_type: str) -> None:
            self.run.successful = False
            self.run.error_type = error_type

    class Continuity:
        def __init__(self) -> None:
            self.successes: list[str | None] = []
            self.releases: list[str | None] = []

        async def async_record_success(self, key: str | None, _content: Any) -> None:
            self.successes.append(key)

        async def async_release(self, key: str | None) -> None:
            self.releases.append(key)

    class Agent:
        def __init__(self) -> None:
            self._usage = Usage()
            self._continuity = Continuity()
            self.archived: list[bool] = []

        def _local_rule_result(self, *_args: Any) -> str:
            return "result"

        async def _async_archive_turn(self, *_args: Any, successful: bool) -> None:
            self.archived.append(successful)

    agent = Agent()
    result = await ExtendedOpenAIAgentEntity._async_complete_local_rule(
        agent,  # type: ignore[arg-type]
        SimpleNamespace(conversation_id="conversation-1"),
        SimpleNamespace(content=["user", "assistant"]),
        "Failed",
        None,
        "owner-key",
        None,
        successful=False,
    )

    assert result == "result"
    assert agent.archived == [False]
    assert agent._usage.run.successful is False
    assert agent._usage.run.error_type == "RequestRuleExecutionFailed"
    assert agent._continuity.successes == []
    assert agent._continuity.releases == ["owner-key"]


def test_ending_continuity_clears_request_rule_routing_state() -> None:
    hass = SimpleNamespace(data={})
    runtime = get_request_rule_runtime(hass, "entry", "agent")
    runtime.set("continuity:owner-key", {"chat_model": "gpt-test"})
    assert runtime.get("continuity:owner-key")

    _reset_request_rule_runtime(hass, "entry", "agent", "owner-key")
    assert runtime.get("continuity:owner-key") == {}
''')

