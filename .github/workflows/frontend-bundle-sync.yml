name: Frontend bundle sync

on:
  push:
    branches:
      - frontend-production-bundling
    paths:
      - "frontend/**"
      - "custom_components/extended_openai_conversation_responses/frontend/**"
      - ".github/workflows/frontend-bundle-sync.yml"

permissions:
  contents: write

concurrency:
  group: frontend-bundle-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: frontend-production-bundling

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build production frontend
        working-directory: frontend
        run: npm run build

      - name: Commit generated production assets
        run: |
          git add -f custom_components/extended_openai_conversation_responses/frontend/dist
          if git diff --cached --quiet; then
            echo "Production bundle already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: persist production frontend assets"
          git push origin HEAD:frontend-production-bundling
