name: Rebuild PR 774 frontend dist

on:
  push:
    branches:
      - cleanup/scoped-details-styles

permissions:
  contents: write

jobs:
  rebuild:
    if: github.event.head_commit.message != 'Rebuild frontend dist for PR 774'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: cleanup/scoped-details-styles
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Commit generated dist and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/frontend/dist/
          git rm .github/workflows/rebuild-774-dist.yml
          git commit -m "Rebuild frontend dist for PR 774"
          git push origin HEAD:cleanup/scoped-details-styles
