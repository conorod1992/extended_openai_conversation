name: Temporary maintenance lease patch

on:
  push:
    branches:
      - fix/maintenance-logical-lease

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/maintenance-logical-lease
      - name: Apply maintenance fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/extended_openai_conversation_responses/agent_maintenance.py')
          text = path.read_text()
          text = text.replace(
              'from contextlib import asynccontextmanager\nfrom functools import wraps\n',
              'from contextlib import asynccontextmanager\nfrom contextvars import ContextVar\nfrom functools import wraps\n',
              1,
          )
          text = text.replace(
              '        self._active_readers = 0\n        self._reader_depth: dict[asyncio.Task[Any], int] = {}\n',
              '        self._active_readers = 0\n        self._reader_owner: ContextVar[object | None] = ContextVar(\n            f"extended_openai_maintenance_reader_{id(self)}", default=None\n        )\n        self._reader_depth: dict[object, int] = {}\n',
              1,
          )
          old = '''    @asynccontextmanager\n    async def shared(self) -> AsyncIterator[None]:\n        """Enter ordinary agent work, waiting behind pending maintenance."""\n        task = asyncio.current_task()\n        if task is None:  # pragma: no cover - asyncio always supplies one here\n            raise RuntimeError("Agent maintenance reader requires an asyncio task")\n\n        async with self._condition:\n            depth = self._reader_depth.get(task, 0)\n            if depth:\n                self._reader_depth[task] = depth + 1\n            else:\n                await self._condition.wait_for(\n                    lambda: not self._writer_active and self._waiting_writers == 0\n                )\n                self._reader_depth[task] = 1\n                self._active_readers += 1\n        try:\n            yield\n        finally:\n            async with self._condition:\n                depth = self._reader_depth[task]\n                if depth > 1:\n                    self._reader_depth[task] = depth - 1\n                else:\n                    del self._reader_depth[task]\n                    self._active_readers -= 1\n                    if self._active_readers == 0:\n                        self._condition.notify_all()\n'''
          new = '''    @asynccontextmanager\n    async def shared(self) -> AsyncIterator[None]:\n        """Enter ordinary agent work, preserving a logical lease across child tasks."""\n        owner = self._reader_owner.get()\n        owner_token = None\n\n        async with self._condition:\n            depth = self._reader_depth.get(owner, 0) if owner is not None else 0\n            if depth:\n                # Context variables propagate into child tasks created by Home\n                # Assistant Script. Treat those descendants as part of the same\n                # logical request so a waiting writer cannot deadlock on its parent.\n                self._reader_depth[owner] = depth + 1\n            else:\n                await self._condition.wait_for(\n                    lambda: not self._writer_active and self._waiting_writers == 0\n                )\n                owner = object()\n                owner_token = self._reader_owner.set(owner)\n                self._reader_depth[owner] = 1\n                self._active_readers += 1\n        try:\n            yield\n        finally:\n            if owner is None:  # pragma: no cover - every admitted reader owns a token\n                raise RuntimeError("Agent maintenance reader lease was not established")\n            async with self._condition:\n                depth = self._reader_depth[owner]\n                if depth > 1:\n                    self._reader_depth[owner] = depth - 1\n                else:\n                    del self._reader_depth[owner]\n                    self._active_readers -= 1\n                    if self._active_readers == 0:\n                        self._condition.notify_all()\n            if owner_token is not None:\n                self._reader_owner.reset(owner_token)\n'''
          if old not in text:
              raise SystemExit('shared gate block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('custom_components/extended_openai_conversation_responses/delayed_tools.py')
          text = path.read_text()
          marker = 'from .agent_config import configured_function_tools_from_data, function_tool_enabled\n'
          text = text.replace(
              marker,
              marker + 'from .agent_maintenance import get_agent_maintenance_gate\n',
              1,
          )
          old = '''                retry = await self._async_execute_due(call_id)\n                if not retry:\n'''
          new = '''                record = self._records.get(call_id)\n                if record is None or record.status != _PENDING:\n                    return\n                gate = get_agent_maintenance_gate(\n                    self.hass, record.entry_id, record.subentry_id\n                )\n                # Live resolution, the durable execution boundary, the external tool\n                # action and finalization form one ordinary-agent lease. Restore must\n                # not overlap any of them.\n                async with gate.shared():\n                    retry = await self._async_execute_due(call_id)\n                if not retry:\n'''
          if old not in text:
              raise SystemExit('delayed execution call not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('tests/test_agent_maintenance.py')
          text = path.read_text()
          marker = '''async def _enter_writer(gate: AgentMaintenanceGate, entered: asyncio.Event) -> None:\n'''
          addition = '''async def test_child_task_reader_reenters_parent_lease_while_writer_waits() -> None:\n    """HA Script child work inherits the logical reader instead of deadlocking."""\n    gate = AgentMaintenanceGate()\n    writer_entered = asyncio.Event()\n    child_entered = asyncio.Event()\n\n    async with gate.shared():\n        writer = asyncio.create_task(_enter_writer(gate, writer_entered))\n        await asyncio.sleep(0)\n\n        async def child_reader() -> None:\n            async with gate.shared():\n                child_entered.set()\n\n        child = asyncio.create_task(child_reader())\n        await asyncio.wait_for(child_entered.wait(), timeout=1)\n        await child\n        assert not writer_entered.is_set()\n\n    await asyncio.wait_for(writer_entered.wait(), timeout=1)\n    await writer\n\n\n'''
          if marker not in text:
              raise SystemExit('maintenance test marker not found')
          path.write_text(text.replace(marker, addition + marker, 1))

          path = Path('tests/test_delayed_tool_lifecycle.py')
          text = path.read_text()
          text = text.replace(
              'from __future__ import annotations\n\nfrom types import SimpleNamespace\n',
              'from __future__ import annotations\n\nimport asyncio\nfrom types import SimpleNamespace\n',
              1,
          )
          text = text.replace(
              'from custom_components.extended_openai_conversation_responses.const import DOMAIN\n',
              'from custom_components.extended_openai_conversation_responses.agent_maintenance import (\n    get_agent_maintenance_gate,\n)\nfrom custom_components.extended_openai_conversation_responses.const import DOMAIN\n',
              1,
          )
          text = text.replace(
              '    DelayedToolManager,\n',
              '    DelayedToolCall,\n    DelayedToolManager,\n',
              1,
          )
          addition = '''\n\ndef _due_call(call_id: str = "call-due") -> DelayedToolCall:\n    now = delayed_tools.dt_util.utcnow().isoformat()\n    return DelayedToolCall(\n        call_id=call_id,\n        entry_id="entry-1",\n        subentry_id="agent-1",\n        tool_name="control_light",\n        arguments={"value": 1},\n        due_at=now,\n        created_at=now,\n    )\n\n\nasync def test_due_delayed_tool_waits_behind_exclusive_restore(hass, monkeypatch) -> None:\n    """A due action cannot cross its live execution boundary during restore."""\n    manager = DelayedToolManager(hass)\n    manager._started = True\n    record = _due_call()\n    manager._records[record.call_id] = record\n    execute_due = AsyncMock(return_value=False)\n    monkeypatch.setattr(manager, "_async_execute_due", execute_due)\n    gate = get_agent_maintenance_gate(hass, record.entry_id, record.subentry_id)\n\n    async with gate.exclusive():\n        task = asyncio.create_task(manager._async_wait_and_execute(record.call_id))\n        await asyncio.sleep(0)\n        assert not execute_due.await_count\n\n    await asyncio.wait_for(task, timeout=1)\n    execute_due.assert_awaited_once_with(record.call_id)\n\n\nasync def test_active_delayed_tool_holds_restore_until_execution_finishes(\n    hass, monkeypatch\n) -> None:\n    """Restore waits for an already-started delayed execution lease to drain."""\n    manager = DelayedToolManager(hass)\n    manager._started = True\n    record = _due_call("call-active")\n    manager._records[record.call_id] = record\n    execution_entered = asyncio.Event()\n    release_execution = asyncio.Event()\n    writer_entered = asyncio.Event()\n\n    async def execute_due(_call_id: str) -> bool:\n        execution_entered.set()\n        await release_execution.wait()\n        return False\n\n    monkeypatch.setattr(manager, "_async_execute_due", execute_due)\n    delayed = asyncio.create_task(manager._async_wait_and_execute(record.call_id))\n    await asyncio.wait_for(execution_entered.wait(), timeout=1)\n\n    gate = get_agent_maintenance_gate(hass, record.entry_id, record.subentry_id)\n\n    async def restore() -> None:\n        async with gate.exclusive():\n            writer_entered.set()\n\n    writer = asyncio.create_task(restore())\n    await asyncio.sleep(0)\n    assert not writer_entered.is_set()\n\n    release_execution.set()\n    await asyncio.wait_for(delayed, timeout=1)\n    await asyncio.wait_for(writer_entered.wait(), timeout=1)\n    await writer\n'''
          path.write_text(text + addition)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/extended_openai_conversation_responses/agent_maintenance.py custom_components/extended_openai_conversation_responses/delayed_tools.py tests/test_agent_maintenance.py tests/test_delayed_tool_lifecycle.py
          git commit -m 'Carry maintenance leases across child tasks and delayed tools'
          git push origin HEAD:fix/maintenance-logical-lease
