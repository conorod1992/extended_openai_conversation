name: Quiet Hours final check

on:
  push:
    branches:
      - feature/quiet-hours-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test and integration dependencies
        run: |
          python -m pip install -r requirements_test.txt
          python -m pip install 'openai==2.45.0' ruff
      - name: Ruff
        run: |
          python -m ruff format --check custom_components/extended_openai_conversation_responses/quiet_hours.py custom_components/extended_openai_conversation_responses/quiet_hours_runtime.py tests/test_quiet_hours.py tests/test_quiet_hours_runtime_coverage.py tests_real_ha/test_quiet_hours_acceptance.py
          python -m ruff check custom_components/extended_openai_conversation_responses/quiet_hours.py custom_components/extended_openai_conversation_responses/quiet_hours_runtime.py tests/test_quiet_hours.py tests/test_quiet_hours_runtime_coverage.py tests_real_ha/test_quiet_hours_acceptance.py
      - name: Quiet Hours unit tests
        run: python -m pytest tests/test_quiet_hours.py tests/test_quiet_hours_runtime_coverage.py -q
      - name: Quiet Hours frontend tests
        run: |
          node --check custom_components/extended_openai_conversation_responses/frontend/quiet-hours-ui.js
          node --test tests/quiet-hours.test.mjs
