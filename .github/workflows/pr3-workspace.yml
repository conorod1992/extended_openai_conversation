name: PR3 validation workspace

on:
  push:
    branches: [perf/persistent-knowledge-memory-pr3]
    paths: [.github/workflows/pr3-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install existing frontend and browser test dependencies
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0
      - name: Package tracked source and test dependencies only
        run: |
          git archive HEAD -o /tmp/pr3-workspace.tar
          tar -rf /tmp/pr3-workspace.tar frontend/node_modules node_modules
          gzip /tmp/pr3-workspace.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr3-validation-workspace
          path: /tmp/pr3-workspace.tar.gz
          if-no-files-found: error
          retention-days: 1
