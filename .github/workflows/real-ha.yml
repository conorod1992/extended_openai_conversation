name: Real HA Acceptance

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: "30 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HA_CORE_REPO: "home-assistant/core"
  HA_CORE_BRANCH: "dev"

jobs:
  prepare:
    name: Resolve HA Python version
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.versions.outputs.python-version }}
    steps:
      - name: Read Python version from Home Assistant Core
        id: versions
        run: |
          PYTHON_VERSION="$(curl -fsSL "https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/${{ env.HA_CORE_BRANCH }}/.python-version" | tr -d '\n')"
          test -n "$PYTHON_VERSION"
          echo "python-version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Home Assistant Python version: $PYTHON_VERSION"

  acceptance:
    name: Genuine Home Assistant lifecycle
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ needs.prepare.outputs.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          allow-prereleases: true

      - name: Install Home Assistant stable test harness
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install homeassistant

      - name: Install integration dependency requirements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          import homeassistant

          components = Path(next(iter(homeassistant.__path__))) / "components"
          custom_manifest = json.loads(
              Path(
                  "custom_components/extended_openai_conversation_responses/manifest.json"
              ).read_text()
          )

          requirements = set(custom_manifest.get("requirements", []))
          pending = [
              *custom_manifest.get("dependencies", []),
              *custom_manifest.get("after_dependencies", []),
          ]
          visited = set()

          # The Home Assistant wheel intentionally does not install every built-in
          # integration's optional Python requirements. Walk both hard dependencies
          # and after-dependencies recursively: after-dependencies can still be
          # imported at runtime (AI Task imports Camera, for example), so their Python
          # requirements must exist even though HA does not force those integrations
          # to be set up.
          while pending:
              domain = pending.pop()
              if domain in visited:
                  continue
              visited.add(domain)

              manifest_path = components / domain / "manifest.json"
              if not manifest_path.exists():
                  raise RuntimeError(
                      f"Home Assistant dependency manifest not found: {domain}"
                  )

              manifest = json.loads(manifest_path.read_text())
              requirements.update(manifest.get("requirements", []))
              pending.extend(manifest.get("dependencies", []))
              pending.extend(manifest.get("after_dependencies", []))

          print("Resolved HA dependency integrations:", ", ".join(sorted(visited)))
          if requirements:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", *sorted(requirements)]
              )
          PY

      - name: Verify resolved test environment
        run: |
          pip check
          python - <<'PY'
          from importlib.metadata import version
          print("homeassistant=" + version("homeassistant"))
          print("pytest-homeassistant-custom-component=" + version("pytest-homeassistant-custom-component"))
          PY

      - name: Run genuine Home Assistant acceptance tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail
          pytest tests_real_ha/ \
            -v \
            --asyncio-mode=auto \
            --timeout=60 \
            --junitxml=real-ha-junit.xml \
            --cov=custom_components.extended_openai_conversation_responses.config_flow \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:real-ha-config-flow-coverage.xml \
            2>&1 | tee real-ha-pytest.log

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-ha-acceptance-diagnostics
          path: |
            real-ha-pytest.log
            real-ha-junit.xml
            real-ha-config-flow-coverage.xml
          if-no-files-found: warn
          retention-days: 7
