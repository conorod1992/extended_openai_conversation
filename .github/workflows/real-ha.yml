name: Real HA Acceptance

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HA_CORE_REPO: "home-assistant/core"
  HA_CORE_BRANCH: "dev"

jobs:
  prepare:
    name: Resolve HA Python version
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.versions.outputs.python-version }}
      ha-core-sha: ${{ steps.versions.outputs.ha-core-sha }}
    steps:
      - name: Resolve Home Assistant Core dev snapshot
        id: versions
        run: |
          HA_CORE_SHA="$(git ls-remote "https://github.com/${{ env.HA_CORE_REPO }}.git" "refs/heads/${{ env.HA_CORE_BRANCH }}" | awk '{print $1}')"
          test -n "$HA_CORE_SHA"
          PYTHON_VERSION="$(curl -fsSL "https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/.python-version" | tr -d '\n')"
          test -n "$PYTHON_VERSION"
          echo "ha-core-sha=$HA_CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "python-version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Home Assistant Core dev commit: $HA_CORE_SHA"
          echo "Home Assistant Python version: $PYTHON_VERSION"

  stable:
    name: Genuine Home Assistant lifecycle (stable / ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard:
          - parallel-safe
          - serial-only
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reconcile current test requirements
        run: |
          CURRENT_ENVIRONMENT_SHA="$(cat requirements_test.txt custom_components/extended_openai_conversation_responses/manifest.json | sha256sum | awk '{print $1}')"
          BUILT_ENVIRONMENT_SHA="$(cat /opt/eoai-ci/environment.sha256)"
          if [ "$CURRENT_ENVIRONMENT_SHA" = "$BUILT_ENVIRONMENT_SHA" ]; then
            echo "Prebuilt dependency environment matches this checkout; skipping reconciliation."
          else
            echo "Dependency declarations changed; reconciling prebuilt environment."
            pip install -r requirements_test.txt
            pip install --upgrade homeassistant
            python ci/install_ha_dependencies.py \
              --manifest custom_components/extended_openai_conversation_responses/manifest.json
          fi

      - name: Verify stable test environment
        run: |
          pip check
          python - <<'PY'
          from importlib.metadata import version
          print("homeassistant=" + version("homeassistant"))
          print("pytest-homeassistant-custom-component=" + version("pytest-homeassistant-custom-component"))
          PY

      - name: Verify stable shard partition
        run: |
          python - <<'PY'
          from pathlib import Path

          excluded = {
              "test_release_upgrade_acceptance.py",
              "test_release_upgrade_custom_function_tool.py",
              "test_browser_release_upgrade_acceptance.py",
              "test_packaged_release.py",
              "test_packaged_process_restart.py",
          }
          serial_only = {
              "test_active_request_shutdown_recovery.py",
              "test_backup_restore_atomicity.py",
              "test_backup_restore_delayed_tool_collision.py",
              "test_backup_restore_live_runtime_refresh.py",
              "test_browser_backend_acceptance.py",
              "test_browser_process_restart_acceptance.py",
              "test_browser_refresh_boundary_acceptance.py",
              "test_browser_runtime_acceptance.py",
              "test_cancel_after_side_effect.py",
              "test_concurrent_multi_entry_lifecycle.py",
              "test_config_update_inflight_request.py",
              "test_corrupt_subsystem_store_startup_isolation.py",
              "test_cross_entry_inflight_lifecycle.py",
              "test_delayed_tool_due_reauthorization.py",
              "test_delayed_tool_process_restart.py",
              "test_immediate_tool_process_crash.py",
              "test_inflight_subentry_removal.py",
              "test_lifecycle_concurrency.py",
              "test_live_config_mutation_semantics.py",
              "test_live_subentry_removal.py",
              "test_multi_entry_lifecycle.py",
              "test_pending_store_write_shutdown_recovery.py",
              "test_persisted_startup_migration.py",
              "test_persistence_state_round_trips.py",
              "test_provider_failure_recovery.py",
              "test_provider_wire_truncated_tool_stream.py",
              "test_runtime_recovery_journey.py",
              "test_runtime_stress.py",
              "test_same_title_subentry_recreation.py",
              "test_shared_conversation_and_entry_removal.py",
              "test_shared_service_lifecycle.py",
              "test_sibling_subentry_inflight_reload.py",
              "test_target_registry_mutation_race.py",
              "test_temporary_memory_lifecycle.py",
              "test_temporary_memory_unload_reload.py",
              "test_usage_accounting_failure_recovery.py",
          }

          discovered = {
              path.name
              for path in Path("tests_real_ha").glob("test_*.py")
          }
          generic = discovered - excluded
          unknown = serial_only - generic
          if unknown:
              raise SystemExit(
                  "Serial-only shard lists missing/non-generic files: "
                  + ", ".join(sorted(unknown))
              )

          parallel_safe = generic - serial_only
          if not parallel_safe:
              raise SystemExit("Parallel-safe shard is unexpectedly empty")
          if parallel_safe & serial_only:
              raise SystemExit("Stable shard partition overlaps")

          print(f"parallel-safe files: {len(parallel_safe)}")
          print(f"serial-only files: {len(serial_only)}")
          print(f"excluded specialized files: {len(excluded)}")
          PY

      - name: Run genuine Home Assistant acceptance tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail

          SERIAL_ONLY=(
            tests_real_ha/test_active_request_shutdown_recovery.py
            tests_real_ha/test_backup_restore_atomicity.py
            tests_real_ha/test_backup_restore_delayed_tool_collision.py
            tests_real_ha/test_backup_restore_live_runtime_refresh.py
            tests_real_ha/test_browser_backend_acceptance.py
            tests_real_ha/test_browser_process_restart_acceptance.py
            tests_real_ha/test_browser_refresh_boundary_acceptance.py
            tests_real_ha/test_browser_runtime_acceptance.py
            tests_real_ha/test_cancel_after_side_effect.py
            tests_real_ha/test_concurrent_multi_entry_lifecycle.py
            tests_real_ha/test_config_update_inflight_request.py
            tests_real_ha/test_corrupt_subsystem_store_startup_isolation.py
            tests_real_ha/test_cross_entry_inflight_lifecycle.py
            tests_real_ha/test_delayed_tool_due_reauthorization.py
            tests_real_ha/test_delayed_tool_process_restart.py
            tests_real_ha/test_immediate_tool_process_crash.py
            tests_real_ha/test_inflight_subentry_removal.py
            tests_real_ha/test_lifecycle_concurrency.py
            tests_real_ha/test_live_config_mutation_semantics.py
            tests_real_ha/test_live_subentry_removal.py
            tests_real_ha/test_multi_entry_lifecycle.py
            tests_real_ha/test_pending_store_write_shutdown_recovery.py
            tests_real_ha/test_persisted_startup_migration.py
            tests_real_ha/test_persistence_state_round_trips.py
            tests_real_ha/test_provider_failure_recovery.py
            tests_real_ha/test_provider_wire_truncated_tool_stream.py
            tests_real_ha/test_runtime_recovery_journey.py
            tests_real_ha/test_runtime_stress.py
            tests_real_ha/test_same_title_subentry_recreation.py
            tests_real_ha/test_shared_conversation_and_entry_removal.py
            tests_real_ha/test_shared_service_lifecycle.py
            tests_real_ha/test_sibling_subentry_inflight_reload.py
            tests_real_ha/test_target_registry_mutation_race.py
            tests_real_ha/test_temporary_memory_lifecycle.py
            tests_real_ha/test_temporary_memory_unload_reload.py
            tests_real_ha/test_usage_accounting_failure_recovery.py
          )

          if [ "${{ matrix.shard }}" = "serial-only" ]; then
            TEST_PATHS=("${SERIAL_ONLY[@]}")
            COVERAGE_ARGS=()
          else
            TEST_PATHS=(tests_real_ha/)
            TEST_PATHS+=(
              --ignore=tests_real_ha/test_release_upgrade_acceptance.py
              --ignore=tests_real_ha/test_release_upgrade_custom_function_tool.py
              --ignore=tests_real_ha/test_browser_release_upgrade_acceptance.py
              --ignore=tests_real_ha/test_packaged_release.py
              --ignore=tests_real_ha/test_packaged_process_restart.py
            )
            for path in "${SERIAL_ONLY[@]}"; do
              TEST_PATHS+=(--ignore="$path")
            done
            COVERAGE_ARGS=(
              --cov=custom_components.extended_openai_conversation_responses.config_flow
              --cov-branch
              --cov-report=term-missing
              --cov-report=xml:real-ha-config-flow-coverage.xml
            )
          fi

          pytest "${TEST_PATHS[@]}" \
            -v \
            --asyncio-mode=auto \
            --timeout=60 \
            --durations=30 \
            --junitxml="real-ha-junit-${{ matrix.shard }}.xml" \
            "${COVERAGE_ARGS[@]}" \
            2>&1 | tee "real-ha-pytest-${{ matrix.shard }}.log"

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-ha-acceptance-diagnostics-stable-${{ matrix.shard }}
          path: |
            real-ha-pytest-${{ matrix.shard }}.log
            real-ha-junit-${{ matrix.shard }}.xml
            real-ha-config-flow-coverage.xml
          if-no-files-found: warn
          retention-days: 7

  upcoming:
    name: Genuine Home Assistant lifecycle (upcoming)
    runs-on: ubuntu-latest
    needs: prepare
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ needs.prepare.outputs.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install upcoming test requirements without released HA
        run: |
          grep -v '^pytest-homeassistant-custom-component' requirements_test.txt \
            > "${RUNNER_TEMP}/requirements-real-ha-upcoming.txt"
          pip install -r "${RUNNER_TEMP}/requirements-real-ha-upcoming.txt"

      - name: Cache upcoming Home Assistant Core wheel
        id: ha-dev-wheel-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ha-dev-wheel
          key: ${{ runner.os }}-ha-dev-wheel-${{ needs.prepare.outputs.python-version }}-${{ needs.prepare.outputs.ha-core-sha }}

      - name: Build upcoming Home Assistant Core wheel
        if: steps.ha-dev-wheel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/ha-dev-wheel"
          pip wheel --no-deps \
            "git+https://github.com/${{ env.HA_CORE_REPO }}.git@${{ needs.prepare.outputs.ha-core-sha }}" \
            --wheel-dir "${RUNNER_TEMP}/ha-dev-wheel"

      - name: Install upcoming Home Assistant Core
        run: |
          pip install "${RUNNER_TEMP}"/ha-dev-wheel/homeassistant-*.whl

      - name: Install Home Assistant pytest fixture plugin without stable HA
        run: |
          PLUGIN_SPEC="$(grep '^pytest-homeassistant-custom-component' requirements_test.txt)"
          test -n "$PLUGIN_SPEC"

          pip install --no-deps "$PLUGIN_SPEC"
          python - <<'PY'
          from importlib.metadata import requires
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from pathlib import Path

          plugin = "pytest-homeassistant-custom-component"
          filtered = []
          for spec in requires(plugin) or []:
              requirement = Requirement(spec)
              if canonicalize_name(requirement.name) == "homeassistant":
                  continue
              if requirement.marker is not None and not requirement.marker.evaluate():
                  continue
              filtered.append(spec)

          path = Path("/tmp/pytest-ha-plugin-deps.txt")
          path.write_text("\n".join(filtered) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
          pip install -r /tmp/pytest-ha-plugin-deps.txt

      - name: Install integration dependency requirements
        run: |
          python ci/install_ha_dependencies.py \
            --manifest custom_components/extended_openai_conversation_responses/manifest.json

      - name: Verify upcoming test environment
        run: |
          python - <<'PY'
          from importlib.metadata import version
          print("homeassistant=" + version("homeassistant"))
          print("pytest-homeassistant-custom-component=" + version("pytest-homeassistant-custom-component"))
          PY
          echo "home-assistant-core-sha=${{ needs.prepare.outputs.ha-core-sha }}"

      - name: Run genuine Home Assistant acceptance tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail

          # Upcoming HA is a compatibility canary, not a second copy of the
          # complete EOAI acceptance suite. Keep this list focused on seams
          # where Home Assistant API/lifecycle changes can break the integration.
          TEST_PATHS=(
            tests_real_ha/test_acceptance_lifecycle.py
            tests_real_ha/test_ai_task_lifecycle.py
            tests_real_ha/test_ai_task_runtime.py
            tests_real_ha/test_assist_origin_context.py
            tests_real_ha/test_assist_streaming_speech_processing.py
            tests_real_ha/test_assist_voice_identity_precedence.py
            tests_real_ha/test_browser_backend_acceptance.py
            tests_real_ha/test_config_entry_disable_enable.py
            tests_real_ha/test_config_flow.py
            tests_real_ha/test_config_flow_edges.py
            tests_real_ha/test_config_flow_lifecycle_contracts.py
            tests_real_ha/test_entity_registry_customization.py
            tests_real_ha/test_entity_registry_disabled.py
            tests_real_ha/test_exposed_attribute_catalog_acceptance.py
            tests_real_ha/test_frontend_asset_registration.py
            tests_real_ha/test_ha_llm_tool_acceptance.py
            tests_real_ha/test_intercom_voice_acceptance.py
            tests_real_ha/test_management_backend_acceptance.py
            tests_real_ha/test_native_indirect_mixed_exposure.py
            tests_real_ha/test_native_indirect_target_resolution.py
            tests_real_ha/test_native_multi_indirect_target_union.py
            tests_real_ha/test_native_registry_state_disagreement.py
            tests_real_ha/test_native_service_disappearance.py
            tests_real_ha/test_native_service_schema_rejection.py
            tests_real_ha/test_native_target_disappearance.py
            tests_real_ha/test_native_unavailable_target.py
            tests_real_ha/test_partial_platform_setup_retry.py
            tests_real_ha/test_runtime_reauthentication.py
            tests_real_ha/test_security_routing_boundaries.py
            tests_real_ha/test_service_registry_acceptance.py
            tests_real_ha/test_user_permission_acceptance.py
          )

          pytest "${TEST_PATHS[@]}" \
            -v \
            --asyncio-mode=auto \
            --timeout=60 \
            --durations=30 \
            --junitxml=real-ha-junit.xml \
            2>&1 | tee real-ha-pytest.log

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-ha-acceptance-diagnostics-upcoming
          path: |
            real-ha-pytest.log
            real-ha-junit.xml
          if-no-files-found: warn
          retention-days: 7
