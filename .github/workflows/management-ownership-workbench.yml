name: Management ownership workbench
on:
  push:
    branches: [refactor/management-api-ownership]
    paths:
      - .github/workflows/management-ownership-workbench.yml
      - scripts/management_ownership_workbench.py
permissions:
  contents: write
concurrency:
  group: management-ownership-workbench
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/management-api-ownership
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply verified edits
        run: python scripts/management_ownership_workbench.py
      - name: Format and commit incremental implementation
        run: |
          python -m pip install ruff
          ruff check --fix custom_components/
          ruff format custom_components/
          python -m compileall -q custom_components/
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components tests tests_real_ha
          if ! git diff --cached --quiet; then
            git commit -m 'Make Management command ownership explicit'
            git push origin HEAD:refactor/management-api-ownership
          fi
      - name: Install stable test environment
        run: |
          pip install -r requirements_test.txt mypy
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import homeassistant
          components = Path(next(iter(homeassistant.__path__))) / 'components'
          manifest = json.loads(Path('custom_components/extended_openai_conversation_responses/manifest.json').read_text())
          requirements = set(manifest.get('requirements', []))
          pending = [*manifest.get('dependencies', []), *manifest.get('after_dependencies', [])]
          visited = set()
          while pending:
              domain = pending.pop()
              if domain in visited:
                  continue
              visited.add(domain)
              dependency = json.loads((components / domain / 'manifest.json').read_text())
              requirements.update(dependency.get('requirements', []))
              pending.extend(dependency.get('dependencies', []))
              pending.extend(dependency.get('after_dependencies', []))
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *sorted(requirements)])
          PY
      - name: Export isolated Python test dependencies
        run: |
          prefix=$(python -c 'import sys; print(sys.prefix)')
          tar --exclude='__pycache__' --exclude='*.pyc' -C "$prefix" -czf /tmp/python-management-env.tar.gz bin lib
      - uses: actions/upload-artifact@v4
        with:
          name: management-python-environment
          path: /tmp/python-management-env.tar.gz
          retention-days: 2
      - name: Run Management regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_management*.py tests/test_function_dependency*.py tests/test_request_rule_match_preview.py tests/test_feature_status.py tests/test_input_footprint.py tests/test_temporary_memory_ownership*.py tests/test_agent_maintenance*.py tests/test_function_repair_configuration_contract.py -q --timeout=30 --tb=short --junitxml=/tmp/management-results.xml 2>&1 | tee /tmp/management-tests.log
      - name: Type check
        if: always()
        run: mypy custom_components/extended_openai_conversation_responses 2>&1 | tee /tmp/management-mypy.log
      - name: Export reviewed checkout
        if: always()
        run: git archive --format=tar.gz HEAD > /tmp/management-ownership-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: management-ownership-workbench
          path: |
            /tmp/management-ownership-source.tar.gz
            /tmp/management-tests.log
            /tmp/management-mypy.log
            /tmp/management-results.xml
          retention-days: 2
