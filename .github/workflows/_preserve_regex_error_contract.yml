name: Preserve regex error contract

on:
  push:
    branches:
      - feature/correctable-function-tool-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/correctable-function-tool-recovery
          fetch-depth: 0

      - name: Preserve existing disabled-mode error text
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/extended_openai_conversation_responses/function_execution.py")
          text = path.read_text()
          old = '''        raise FunctionValidationInfrastructureError(\n            \"Configured Function Tool pattern validation could not complete safely\"\n        ) from err\n'''
          new = '''        raise FunctionValidationInfrastructureError(str(err)) from err\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("validation error wrapper anchor not found")
              text = text.replace(old, new, 1)
          path.write_text(text)
          Path(".github/workflows/_preserve_regex_error_contract.yml").unlink()
          PY

      - name: Format and validate
        run: |
          python -m pip install ruff
          ruff format custom_components/extended_openai_conversation_responses/function_execution.py
          ruff check custom_components/extended_openai_conversation_responses/function_execution.py
          git diff --check

      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve regex validation error text"
          git push origin HEAD:feature/correctable-function-tool-recovery
