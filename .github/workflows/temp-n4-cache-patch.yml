name: Temporary N4 cache patch

on:
  push:
    branches:
      - fix/tool-schema-cache-key

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/tool-schema-cache-key
      - name: Apply cache fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/extended_openai_conversation_responses/request_static_cache.py')
          text = path.read_text()
          text = text.replace('from functools import wraps\nfrom typing import Any\n', 'from functools import wraps\nimport json\nfrom typing import Any\n', 1)
          old = '''_FORMATTED_TOOLS: ContextVar[\n    dict[tuple[str, tuple[int, ...]], tuple[dict[str, Any], ...]] | None\n] = ContextVar("extended_openai_formatted_tool_cache", default=None)\n'''
          new = '''type _FormattedToolCacheEntry = tuple[\n    tuple[dict[str, Any], ...],\n    tuple[str, ...],\n    tuple[dict[str, Any], ...],\n]\n_FORMATTED_TOOLS: ContextVar[\n    dict[tuple[str, tuple[int, ...]], _FormattedToolCacheEntry] | None\n] = ContextVar("extended_openai_formatted_tool_cache", default=None)\n'''
          if old not in text:
              raise SystemExit('cache type block not found')
          text = text.replace(old, new, 1)
          old = '''def cached_format_tools(\n    function_tools: list[dict[str, Any]],\n    api_mode: str,\n    formatter: Callable[[list[dict[str, Any]], str], list[dict[str, Any]]],\n) -> list[dict[str, Any]]:\n    """Reuse provider-formatted schemas within one request for an identical tool set."""\n    cache = _FORMATTED_TOOLS.get()\n    if cache is None:\n        return formatter(function_tools, api_mode)\n    key = (api_mode, tuple(id(tool) for tool in function_tools))\n    formatted = cache.get(key)\n    if formatted is None:\n        formatted = tuple(formatter(function_tools, api_mode))\n        cache[key] = formatted\n    return list(formatted)\n'''
          new = '''def _tool_format_signature(tool: dict[str, Any]) -> str | None:\n    """Return the model-facing fields that can affect provider schema formatting."""\n    function = tool.get("function")\n    relevant_function = (\n        {\n            key: function.get(key)\n            for key in ("type", "operation", "name")\n            if key in function\n        }\n        if isinstance(function, dict)\n        else {}\n    )\n    try:\n        return json.dumps(\n            {"spec": tool.get("spec"), "function": relevant_function},\n            ensure_ascii=False,\n            separators=(",", ":"),\n            sort_keys=True,\n        )\n    except (TypeError, ValueError):\n        # A malformed/non-JSON schema is outside the normal model payload contract.\n        # Do not cache it by identity; let the formatter surface its normal error.\n        return None\n\n\ndef cached_format_tools(\n    function_tools: list[dict[str, Any]],\n    api_mode: str,\n    formatter: Callable[[list[dict[str, Any]], str], list[dict[str, Any]]],\n) -> list[dict[str, Any]]:\n    """Reuse provider-formatted schemas only for the exact unchanged tool objects."""\n    cache = _FORMATTED_TOOLS.get()\n    if cache is None:\n        return formatter(function_tools, api_mode)\n\n    signatures = tuple(_tool_format_signature(tool) for tool in function_tools)\n    if any(signature is None for signature in signatures):\n        return formatter(function_tools, api_mode)\n    stable_signatures = tuple(signature for signature in signatures if signature is not None)\n    key = (api_mode, tuple(id(tool) for tool in function_tools))\n    cached = cache.get(key)\n    if cached is not None:\n        original_tools, original_signatures, formatted = cached\n        if (\n            len(original_tools) == len(function_tools)\n            and all(\n                original is current\n                for original, current in zip(original_tools, function_tools, strict=True)\n            )\n            and original_signatures == stable_signatures\n        ):\n            return list(formatted)\n\n    formatted = tuple(formatter(function_tools, api_mode))\n    # Keep strong references to the original containers. Their ids therefore cannot\n    # be recycled into a false cache hit while this request-local entry exists.\n    cache[key] = (tuple(function_tools), stable_signatures, formatted)\n    return list(formatted)\n'''
          if old not in text:
              raise SystemExit('cached_format_tools block not found')
          path.write_text(text.replace(old, new, 1))

          test = Path('tests/test_request_static_cache.py')
          text = test.read_text()
          marker = '''def test_zero_skills_remove_only_canonical_loader() -> None:\n'''
          addition = '''def test_provider_format_cache_invalidates_in_place_schema_changes() -> None:\n    calls = 0\n    tools = [{"spec": {"name": "one"}, "function": {"type": "template"}}]\n\n    def formatter(value, _api_mode):\n        nonlocal calls\n        calls += 1\n        return [{"name": value[0]["spec"]["name"]}]\n\n    token = _FORMATTED_TOOLS.set({})\n    try:\n        assert cached_format_tools(tools, "responses", formatter) == [{"name": "one"}]\n        tools[0]["spec"]["name"] = "two"\n        assert cached_format_tools(tools, "responses", formatter) == [{"name": "two"}]\n    finally:\n        _FORMATTED_TOOLS.reset(token)\n\n    assert calls == 2\n\n\ndef test_provider_format_cache_rejects_identity_key_collision() -> None:\n    calls = 0\n    old_tool = {"spec": {"name": "old"}, "function": {"type": "template"}}\n    new_tool = {"spec": {"name": "new"}, "function": {"type": "template"}}\n\n    def formatter(value, _api_mode):\n        nonlocal calls\n        calls += 1\n        return [{"name": value[0]["spec"]["name"]}]\n\n    token = _FORMATTED_TOOLS.set({})\n    try:\n        cached_format_tools([new_tool], "responses", formatter)\n        cache = _FORMATTED_TOOLS.get()\n        assert cache is not None\n        key = ("responses", (id(new_tool),))\n        _, signatures, _ = cache[key]\n        cache[key] = ((old_tool,), signatures, ({"name": "old"},))\n        assert cached_format_tools([new_tool], "responses", formatter) == [\n            {"name": "new"}\n        ]\n    finally:\n        _FORMATTED_TOOLS.reset(token)\n\n    assert calls == 2\n\n\n'''
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          test.write_text(text.replace(marker, addition + marker, 1))
          PY
          ruff format custom_components/extended_openai_conversation_responses/request_static_cache.py tests/test_request_static_cache.py || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/extended_openai_conversation_responses/request_static_cache.py tests/test_request_static_cache.py
          git commit -m 'Harden request-local tool schema cache keys'
          git push origin HEAD:fix/tool-schema-cache-key
