name: Temporary PR24 continuity patch

on:
  push:
    branches:
      - fix/continuity-claim-ownership

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/continuity-claim-ownership
      - name: Apply targeted patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          continuity_path = Path("custom_components/extended_openai_conversation_responses/continuity.py")
          continuity = continuity_path.read_text()
          continuity = replace_once(
              continuity,
              "    history: list[conversation.Content]\n    resumed: bool\n",
              "    history: list[conversation.Content]\n    resumed: bool\n    claim_token: str | None = None\n",
              "resolution claim token",
          )
          continuity = replace_once(
              continuity,
              "    in_flight: bool = False\n",
              "    in_flight: bool = False\n    claim_token: str | None = None\n",
              "active claim token",
          )
          continuity = replace_once(
              continuity,
              "                active.in_flight = True\n                self.resume_count += 1\n                return ContinuityResolution(\n                    active.conversation_id, key, active.history.copy(), True\n                )\n            # A non-ULID caller-selected ID is explicitly supported by HA's\n            # chat-session helper and remains stable if Core recreates its log.\n            conversation_id = self._new_conversation_id(namespace)\n            self._sessions[key] = ActiveConversation(\n                key, conversation_id, label, now, [], True\n            )\n            self.new_session_count += 1\n            return ContinuityResolution(conversation_id, key, [], False)\n",
              "                claim_token = uuid4().hex\n                active.in_flight = True\n                active.claim_token = claim_token\n                self.resume_count += 1\n                return ContinuityResolution(\n                    active.conversation_id,\n                    key,\n                    active.history.copy(),\n                    True,\n                    claim_token=claim_token,\n                )\n            # A non-ULID caller-selected ID is explicitly supported by HA's\n            # chat-session helper and remains stable if Core recreates its log.\n            conversation_id = self._new_conversation_id(namespace)\n            claim_token = uuid4().hex\n            self._sessions[key] = ActiveConversation(\n                key, conversation_id, label, now, [], True, claim_token\n            )\n            self.new_session_count += 1\n            return ContinuityResolution(\n                conversation_id, key, [], False, claim_token=claim_token\n            )\n",
              "claim creation",
          )
          continuity = replace_once(
              continuity,
              "    async def async_record_success(\n        self, key: str | None, content: list[conversation.Content]\n    ) -> None:\n        \"\"\"Record a successful turn after the model call has completed.\"\"\"\n        if key is None:\n            return\n        async with self._lock:\n            active = self._sessions.get(key)\n            if active is None:\n                return\n            active.history = content.copy()\n            active.last_active = dt_util.utcnow()\n            active.in_flight = False\n\n    async def async_release(self, key: str | None) -> None:\n        \"\"\"Release a request claim after failure or cancellation.\"\"\"\n        if key is None:\n            return\n        async with self._lock:\n            active = self._sessions.get(key)\n            if active is not None:\n                active.in_flight = False\n",
              "    async def async_record_success(\n        self,\n        key: str | None,\n        claim_token: str | None,\n        content: list[conversation.Content],\n    ) -> None:\n        \"\"\"Record a successful turn only for the request that owns the claim.\"\"\"\n        if key is None or claim_token is None:\n            return\n        async with self._lock:\n            active = self._sessions.get(key)\n            if active is None or active.claim_token != claim_token:\n                return\n            active.history = content.copy()\n            active.last_active = dt_util.utcnow()\n            active.in_flight = False\n            active.claim_token = None\n\n    async def async_release(\n        self, key: str | None, claim_token: str | None\n    ) -> None:\n        \"\"\"Release only the request claim identified by its opaque token.\"\"\"\n        if key is None or claim_token is None:\n            return\n        async with self._lock:\n            active = self._sessions.get(key)\n            if active is not None and active.claim_token == claim_token:\n                active.in_flight = False\n                active.claim_token = None\n",
              "claim completion methods",
          )
          continuity_path.write_text(continuity)

          conversation_path = Path("custom_components/extended_openai_conversation_responses/conversation.py")
          conversation = conversation_path.read_text()
          conversation = replace_once(
              conversation,
              "                await asyncio.shield(self._continuity.async_release(resolution.key))\n",
              "                await asyncio.shield(\n                    self._continuity.async_release(\n                        resolution.key, resolution.claim_token\n                    )\n                )\n",
              "outer release",
          )
          count = conversation.count("resolution.key, chat_log.content")
          if count != 2:
              raise SystemExit(f"resolution success calls: expected 2, got {count}")
          conversation = conversation.replace(
              "resolution.key, chat_log.content",
              "resolution.key, resolution.claim_token, chat_log.content",
          )
          conversation = replace_once(
              conversation,
              "                        archive_session,\n                        resolution.key,\n                        source_device_id,\n",
              "                        archive_session,\n                        resolution.key,\n                        resolution.claim_token,\n                        source_device_id,\n",
              "local rule call token",
          )
          conversation = replace_once(
              conversation,
              "        archive_session: ArchiveSession | None,\n        continuity_key: str | None,\n        source_device_id: str | None,\n",
              "        archive_session: ArchiveSession | None,\n        continuity_key: str | None,\n        continuity_claim_token: str | None,\n        source_device_id: str | None,\n",
              "local rule signature token",
          )
          conversation = replace_once(
              conversation,
              "            await self._continuity.async_record_success(\n                continuity_key, chat_log.content\n            )\n        else:\n            await self._continuity.async_release(continuity_key)\n",
              "            await self._continuity.async_record_success(\n                continuity_key, continuity_claim_token, chat_log.content\n            )\n",
              "local rule completion ownership",
          )
          conversation_path.write_text(conversation)

          tests_path = Path("tests/test_continuity.py")
          tests = tests_path.read_text()
          replacements = [
              ("await manager.async_record_success(first.key, history)", "await manager.async_record_success(first.key, first.claim_token, history)"),
              ("        first.key, [conversation.SystemContent(content=\"system\")]\n", "        first.key, first.claim_token, [conversation.SystemContent(content=\"system\")]\n"),
              ("await manager.async_release(first.key)", "await manager.async_release(first.key, first.claim_token)"),
              ("        expired.key, [conversation.SystemContent(content=\"bounded\")]\n", "        expired.key,\n        expired.claim_token,\n        [conversation.SystemContent(content=\"bounded\")],\n"),
              ("await manager.async_release(active.key)", "await manager.async_release(active.key, active.claim_token)"),
              ("        first.key, history\n", "        first.key, first.claim_token, history\n"),
              ("await manager.async_record_success(owner.key, owner_history)", "await manager.async_record_success(owner.key, owner.claim_token, owner_history)"),
              ("        first.key, [conversation.SystemContent(content=\"expired guest history\")]\n", "        first.key,\n        first.claim_token,\n        [conversation.SystemContent(content=\"expired guest history\")],\n"),
              ("await manager.async_release(expired.key)", "await manager.async_release(expired.key, expired.claim_token)"),
          ]
          for index, (old, new) in enumerate(replacements, start=1):
              if old not in tests:
                  raise SystemExit(f"test replacement {index} not found")
              tests = tests.replace(old, new, 1)

          tests += '''\n\nasync def test_stale_success_cannot_mutate_replacement_session() -> None:\n    manager = ConversationContinuity("agent")\n    scope = user_scope("alice", source="test")\n    first = await manager.async_resolve(\n        CONVERSATION_CONTINUITY_USER, scope, None, None, 30\n    )\n    assert first.key is not None\n    assert first.claim_token is not None\n    assert await manager.async_end(first.key)\n\n    replacement = await manager.async_resolve(\n        CONVERSATION_CONTINUITY_USER, scope, None, None, 30\n    )\n    assert replacement.key == first.key\n    assert replacement.claim_token is not None\n    assert replacement.claim_token != first.claim_token\n\n    stale_history = [conversation.SystemContent(content="stale")]\n    await manager.async_record_success(first.key, first.claim_token, stale_history)\n\n    active = manager._sessions[first.key]\n    assert active.history == []\n    assert active.in_flight is True\n    assert active.claim_token == replacement.claim_token\n\n    fresh_history = [conversation.SystemContent(content="fresh")]\n    await manager.async_record_success(\n        replacement.key, replacement.claim_token, fresh_history\n    )\n    assert active.history == fresh_history\n    assert active.in_flight is False\n    assert active.claim_token is None\n\n\nasync def test_stale_release_cannot_clear_newer_claim() -> None:\n    manager = ConversationContinuity("agent")\n    scope = user_scope("alice", source="test")\n    first = await manager.async_resolve(\n        CONVERSATION_CONTINUITY_USER, scope, None, None, 30\n    )\n    assert first.key is not None\n    assert first.claim_token is not None\n    await manager.async_record_success(\n        first.key,\n        first.claim_token,\n        [conversation.SystemContent(content="first")],\n    )\n\n    second = await manager.async_resolve(\n        CONVERSATION_CONTINUITY_USER, scope, None, None, 30\n    )\n    assert second.claim_token is not None\n    assert second.claim_token != first.claim_token\n\n    await manager.async_release(first.key, first.claim_token)\n    active = manager._sessions[first.key]\n    assert active.in_flight is True\n    assert active.claim_token == second.claim_token\n\n    await manager.async_release(second.key, second.claim_token)\n    assert active.in_flight is False\n    assert active.claim_token is None\n'''
          tests_path.write_text(tests)
          PY
      - name: Format and sanity-check
        shell: bash
        run: |
          python -m compileall -q custom_components/extended_openai_conversation_responses/continuity.py custom_components/extended_openai_conversation_responses/conversation.py tests/test_continuity.py
          if command -v ruff >/dev/null 2>&1; then
            ruff format custom_components/extended_openai_conversation_responses/continuity.py custom_components/extended_openai_conversation_responses/conversation.py tests/test_continuity.py
          fi
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/continuity.py custom_components/extended_openai_conversation_responses/conversation.py tests/test_continuity.py
          git diff --cached --check
          git commit -m "Fix continuity claim ownership races"
          git push origin HEAD:fix/continuity-claim-ownership
