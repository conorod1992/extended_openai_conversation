name: Release Upgrade Acceptance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      from_version:
        description: "Published release tag to upgrade from, or 'latest'"
        required: false
        default: "latest"
        type: string
  pull_request:
    paths:
      - "tests_real_ha/test_release_upgrade_acceptance.py"
      - "tests_real_ha/test_release_upgrade_custom_function_tool.py"
      - "tests_real_ha/test_browser_release_upgrade_acceptance.py"
      - "tests_browser/release-upgrade-visible.spec.mjs"
      - "tests_browser/real-ha-fixture.html"
      - "tests_browser/real-ha-harness.mjs"
      - "playwright.config.mjs"
      - "scripts/upgrade_acceptance_requirements.py"
      - ".github/workflows/upgrade-acceptance.yml"

concurrency:
  group: release-upgrade-acceptance-${{ github.ref }}-${{ inputs.from_version || 'latest' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  upgrade:
    name: ${{ matrix.from_version }} to develop
    strategy:
      fail-fast: false
      matrix:
        # Reviewed migration epochs. Keep release-created state at each boundary.
        # 6.2.0 is the oldest coherent tagged Responses payload in this fork.
        from_version: ${{ fromJSON(github.event_name == 'schedule' && '["latest","6.8.2","6.5.0","6.3.1","6.2.0"]' || format('["{0}"]', inputs.from_version || 'latest')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:browser-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'develop' }}
          fetch-depth: 0

      - name: Trust mounted checkout for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve released and candidate payloads
        id: payloads
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_FROM: ${{ matrix.from_version }}
        run: |
          set -euo pipefail
          FROM_VERSION="$REQUESTED_FROM"
          if [[ -z "$FROM_VERSION" || "$FROM_VERSION" == "latest" ]]; then
            FROM_VERSION="$(
              curl -fsSL                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H "Accept: application/vnd.github+json"                 "https://api.github.com/repos/${{ github.repository }}/releases/latest"                 | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])'
            )"
          fi

          git fetch --force --tags origin
          git rev-parse --verify "refs/tags/${FROM_VERSION}^{commit}" >/dev/null

          FROM_ROOT="${RUNNER_TEMP}/upgrade-from"
          TO_ROOT="${RUNNER_TEMP}/upgrade-to"
          rm -rf "$FROM_ROOT" "$TO_ROOT"
          mkdir -p "$FROM_ROOT" "$TO_ROOT"

          git archive "$FROM_VERSION" \
            custom_components/extended_openai_conversation_responses \
            | tar -x -C "$FROM_ROOT"

          while IFS= read -r -d '' file; do
            mkdir -p "$TO_ROOT/$(dirname "$file")"
            cp "$file" "$TO_ROOT/$file"
          done < <(git ls-files -z custom_components/extended_openai_conversation_responses)

          FROM_COMPONENT="$FROM_ROOT/custom_components/extended_openai_conversation_responses"
          TO_COMPONENT="$TO_ROOT/custom_components/extended_openai_conversation_responses"
          FROM_MANIFEST_VERSION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$FROM_COMPONENT/manifest.json")"
          TO_MANIFEST_VERSION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$TO_COMPONENT/manifest.json")"

          if [[ "$FROM_MANIFEST_VERSION" != "$FROM_VERSION" ]]; then
            echo "Release tag $FROM_VERSION contains manifest version $FROM_MANIFEST_VERSION"
            exit 1
          fi

          echo "from_version=$FROM_VERSION" >> "$GITHUB_OUTPUT"
          echo "to_version=$TO_MANIFEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "from_component=$FROM_COMPONENT" >> "$GITHUB_OUTPUT"
          echo "to_component=$TO_COMPONENT" >> "$GITHUB_OUTPUT"

      - name: Reconcile current stable test requirements
        run: |
          CURRENT_ENVIRONMENT_SHA="$(cat requirements_test.txt custom_components/extended_openai_conversation_responses/manifest.json | sha256sum | awk '{print $1}')"
          BUILT_ENVIRONMENT_SHA="$(cat /opt/eoai-ci/environment.sha256)"
          if [ "$CURRENT_ENVIRONMENT_SHA" = "$BUILT_ENVIRONMENT_SHA" ]; then
            echo "Prebuilt dependency environment matches this checkout; skipping reconciliation."
          else
            echo "Dependency declarations changed; reconciling prebuilt environment."
            pip install -r requirements_test.txt
            pip install --upgrade homeassistant
            python ci/install_ha_dependencies.py               --manifest custom_components/extended_openai_conversation_responses/manifest.json
          fi

      - name: Verify prebuilt browser environment
        run: |
          pip check
          python -c "from importlib.metadata import version; print('homeassistant=' + version('homeassistant'))"
          node --version
          npx playwright --version
          test -d "${PLAYWRIGHT_BROWSERS_PATH}"

      - name: Install requirements for both integration payloads
        env:
          FROM_COMPONENT: ${{ steps.payloads.outputs.from_component }}
          TO_COMPONENT: ${{ steps.payloads.outputs.to_component }}
        run: |
          python scripts/upgrade_acceptance_requirements.py \
            "$FROM_COMPONENT" "$TO_COMPONENT" \
            > "${RUNNER_TEMP}/upgrade-requirements.txt"
          if [[ -s "${RUNNER_TEMP}/upgrade-requirements.txt" ]]; then
            python -m pip install -r "${RUNNER_TEMP}/upgrade-requirements.txt"
          fi

      - name: Install local Playwright test runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0

      - name: Run published-release backend and browser upgrade acceptance
        env:
          UPGRADE_FROM_COMPONENT_DIR: ${{ steps.payloads.outputs.from_component }}
          UPGRADE_TO_COMPONENT_DIR: ${{ steps.payloads.outputs.to_component }}
          UPGRADE_FROM_VERSION: ${{ steps.payloads.outputs.from_version }}
          UPGRADE_TO_VERSION: ${{ steps.payloads.outputs.to_version }}
          RUN_UPGRADE_BROWSER: "1"
        run: |
          pytest \
            tests_real_ha/test_release_upgrade_acceptance.py \
            tests_real_ha/test_release_upgrade_custom_function_tool.py \
            tests_real_ha/test_browser_release_upgrade_acceptance.py \
            -v \
            --asyncio-mode=auto \
            --timeout=300

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-upgrade-${{ matrix.from_version }}-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
