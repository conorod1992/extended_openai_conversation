name: Temporary resolve PR 251

on:
  push:
    branches:
      - fix/always-local-followups

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/always-local-followups
          fetch-depth: 0

      - name: Merge develop and resolve expected orchestration conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin develop

          cp tests/test_conversation_orchestration.py /tmp/pr251_orchestration.py

          set +e
          git merge --no-commit --no-ff origin/develop
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$conflicts" != "tests/test_conversation_orchestration.py" ]; then
            echo "Unexpected conflict set (merge status $merge_status):"
            printf '%s\n' "$conflicts"
            exit 1
          fi

          # Use the newly merged #250 coverage as the base, then transplant only
          # #251's intentional local-follow-up behavior tests.
          git checkout --theirs -- tests/test_conversation_orchestration.py

          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path

          path = Path("tests/test_conversation_orchestration.py")
          develop = path.read_text()
          pr251 = Path("/tmp/pr251_orchestration.py").read_text()

          names_to_replace = (
              "test_consumed_request_rule_bypasses_local_intent_and_provider",
              "test_local_intent_bypasses_provider_and_records_continuity",
          )
          rejected_name = "test_rejected_request_rule_does_not_continue_in_always_mode"

          def function_span(source: str, name: str) -> tuple[int, int, str]:
              lines = source.splitlines(keepends=True)
              tree = ast.parse(source)
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == name:
                      starts = [node.lineno]
                      starts.extend(dec.lineno for dec in node.decorator_list)
                      start = min(starts) - 1
                      end = node.end_lineno
                      return start, end, "".join(lines[start:end])
              raise RuntimeError(f"Function not found: {name}")

          # Replace in reverse source order so earlier line numbers remain valid.
          replacements = []
          for name in names_to_replace:
              d_start, d_end, _ = function_span(develop, name)
              _, _, replacement = function_span(pr251, name)
              replacements.append((d_start, d_end, replacement))

          lines = develop.splitlines(keepends=True)
          for start, end, replacement in sorted(replacements, reverse=True):
              repl_lines = replacement.splitlines(keepends=True)
              if repl_lines and not repl_lines[-1].endswith("\n"):
                  repl_lines[-1] += "\n"
              lines[start:end] = repl_lines
          merged = "".join(lines)

          # #250 added _assist_fixture immediately after the prior tests. Insert
          # #251's routing-rejection regression just before that fixture.
          tree = ast.parse(merged)
          if not any(
              isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
              and node.name == rejected_name
              for node in tree.body
          ):
              _, _, rejected = function_span(pr251, rejected_name)
              fixture_start, _, _ = function_span(merged, "_assist_fixture")
              merged_lines = merged.splitlines(keepends=True)
              rejected_text = rejected.rstrip() + "\n\n\n"
              merged_lines[fixture_start:fixture_start] = [rejected_text]
              merged = "".join(merged_lines)

          # Semantic guards: retain #250's new lifecycle coverage and #251's
          # behavior matrix at the same time.
          required = (
              "test_separate_assist_calls_reinject_saved_history_into_recreated_chat_log",
              "test_assist_owner_and_guest_histories_are_isolated_in_both_directions",
              "@pytest.mark.parametrize(\"successful\", [False, True])",
              "successful and mode == CONTINUE_CONVERSATION_ALWAYS",
              rejected_name,
          )
          missing = [item for item in required if item not in merged]
          if missing:
              raise RuntimeError(f"Merged test file lost required coverage: {missing}")

          ast.parse(merged)
          path.write_text(merged)
          PY

          git add tests/test_conversation_orchestration.py
          git rm .github/workflows/tmp-resolve-pr251.yml

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          python -m py_compile tests/test_conversation_orchestration.py
          git commit -m "Merge develop into PR 251 after lifecycle coverage"
          git push origin HEAD:fix/always-local-followups
