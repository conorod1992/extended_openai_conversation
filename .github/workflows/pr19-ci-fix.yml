name: PR19 CI fix

on:
  push:
    branches:
      - fix/pr19-management-state-integrity
    paths:
      - .github/workflows/pr19-ci-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/pr19-management-state-integrity
      - name: Apply consolidated PR19 CI fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "custom_components/extended_openai_conversation_responses/secret_redaction.py",
              '''    if isinstance(value, list):\n        result = []\n        for item in value:\n            restored = _restore_redacted_secrets(item)\n            if restored is not _DROP:\n                result.append(restored)\n        return result\n    if not isinstance(value, dict):\n        return value\n    result: dict[Any, Any] = {}\n    for key, item in value.items():\n        restored = _restore_redacted_secrets(item)\n        if restored is not _DROP:\n            result[key] = restored\n    return result\n''',
              '''    if isinstance(value, list):\n        restored_items = []\n        for item in value:\n            restored = _restore_redacted_secrets(item)\n            if restored is not _DROP:\n                restored_items.append(restored)\n        return restored_items\n    if not isinstance(value, dict):\n        return value\n    restored_mapping: dict[Any, Any] = {}\n    for key, item in value.items():\n        restored = _restore_redacted_secrets(item)\n        if restored is not _DROP:\n            restored_mapping[key] = restored\n    return restored_mapping\n''',
          )

          replace(
              "custom_components/extended_openai_conversation_responses/management_ui.py",
              "from pathlib import Path\nimport re\nfrom types import MappingProxyType\n",
              "from pathlib import Path\nfrom types import MappingProxyType\n",
          )
          replace(
              "custom_components/extended_openai_conversation_responses/management_ui.py",
              '''    GUEST_V2_FIELDS,\n    AgentConfigError,\n''',
              '''    GUEST_V2_FIELDS,\n    MAX_AGENT_TITLE_LENGTH,\n    AgentConfigError,\n''',
          )
          replace(
              "custom_components/extended_openai_conversation_responses/management_ui.py",
              '''    preserve_legacy_guest_policy,\n    MAX_AGENT_TITLE_LENGTH,\n    starter_function_tool_yaml,\n''',
              '''    preserve_legacy_guest_policy,\n    starter_function_tool_yaml,\n''',
          )
          replace(
              "custom_components/extended_openai_conversation_responses/management_ui.py",
              '''        if action == "create":\n            source = await library.async_create(\n                message.get("title", ""),\n                message.get("description", ""),\n                message.get("content", ""),\n            )\n            return {"status": "created", "source": knowledge_source_as_dict(source)}\n        if action == "update":\n            source = await library.async_update(\n                str(message.get("source_id", "")),\n                message.get("title"),\n                message.get("description"),\n                message.get("content"),\n            )\n            return {"status": "updated", "source": knowledge_source_as_dict(source)}\n''',
              '''        if action == "create":\n            knowledge_source = await library.async_create(\n                message.get("title", ""),\n                message.get("description", ""),\n                message.get("content", ""),\n            )\n            return {\n                "status": "created",\n                "source": knowledge_source_as_dict(knowledge_source),\n            }\n        if action == "update":\n            knowledge_source = await library.async_update(\n                str(message.get("source_id", "")),\n                message.get("title"),\n                message.get("description"),\n                message.get("content"),\n            )\n            return {\n                "status": "updated",\n                "source": knowledge_source_as_dict(knowledge_source),\n            }\n''',
          )

          replace(
              "custom_components/extended_openai_conversation_responses/request_rules.py",
              '''import asyncio\nfrom hashlib import sha256\nimport json\nfrom collections.abc import Awaitable, Callable, Mapping, Sequence\nfrom contextvars import ContextVar\nfrom copy import deepcopy\nfrom dataclasses import dataclass, field\nfrom difflib import SequenceMatcher\nimport logging\n''',
              '''import asyncio\nfrom collections.abc import Awaitable, Callable, Mapping, Sequence\nfrom contextvars import ContextVar\nfrom copy import deepcopy\nfrom dataclasses import dataclass, field\nfrom difflib import SequenceMatcher\nfrom hashlib import sha256\nimport json\nimport logging\n''',
          )

          replace(
              "tests/test_agent_config_transfer.py",
              '''from custom_components.extended_openai_conversation_responses.management_ui import (\n    _export_agent,\n    _parse_import_document,\n    _redact_export_secrets,\n)\n''',
              '''from custom_components.extended_openai_conversation_responses.management_ui import (\n    _export_agent,\n    _parse_import_document,\n    _redact_export_secrets,\n)\nfrom custom_components.extended_openai_conversation_responses.secret_redaction import (\n    REDACTED_SECRET_SENTINEL,\n)\n''',
          )
          replace(
              "tests/test_agent_config_transfer.py",
              '''    assert "api_key" not in redacted["function"]\n    assert "apiKey" not in redacted["function"]\n    assert "clientSecret" not in redacted["function"]\n    assert "accessToken" not in redacted["function"]\n    assert "refreshToken" not in redacted["function"]\n    assert "Authorization" not in redacted["function"]["headers"]\n''',
              '''    assert redacted["function"]["api_key"] == REDACTED_SECRET_SENTINEL\n    assert redacted["function"]["apiKey"] == REDACTED_SECRET_SENTINEL\n    assert redacted["function"]["clientSecret"] == REDACTED_SECRET_SENTINEL\n    assert redacted["function"]["accessToken"] == REDACTED_SECRET_SENTINEL\n    assert redacted["function"]["refreshToken"] == REDACTED_SECRET_SENTINEL\n    assert (\n        redacted["function"]["headers"]["Authorization"]\n        == REDACTED_SECRET_SENTINEL\n    )\n    assert redacted["function"]["headers"]["Accept"] == "json"\n''',
          )

          path = Path("tests/test_pr19_management_state_integrity.py")
          text = path.read_text()
          count = text.count('"format": "extended_openai_agent_config",')
          if count != 2:
              raise SystemExit(f"Expected 2 legacy format markers, found {count}")
          path.write_text(text.replace(
              '"format": "extended_openai_agent_config",',
              '"schema": "extended_openai_conversation.agent",',
          ))

          replace(
              "tests/test_request_rules.py",
              '''    assert updated_groups == {"wording_groups": groups}\n''',
              '''    assert updated_groups["wording_groups"] == groups\n    assert isinstance(updated_groups["revision"], str)\n''',
          )
          replace(
              "tests/test_request_rules.py",
              '''    assert deleted == {"deleted": True}\n''',
              '''    assert deleted["deleted"] is True\n    assert isinstance(deleted["revision"], str)\n''',
          )

          replace(
              "tests/pr19-management-state-ui.test.mjs",
              '''    new RegExp(`request_rules.{0,80}${action}.{0,180}revision`, "s"),\n''',
              '''    new RegExp(`panel\\\\._call\\\\("request_rules", "${action}", [^\\\\n]*revision`),\n''',
          )
          PY
      - name: Remove helper workflow and push
        run: |
          rm .github/workflows/pr19-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix PR19 CI regressions"
          git push origin HEAD:fix/pr19-management-state-integrity
