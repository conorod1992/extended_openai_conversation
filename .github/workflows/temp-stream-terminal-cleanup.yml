name: Temporary stream terminal cleanup

on:
  push:
    branches:
      - fix/stream-terminal-correctness

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/stream-terminal-correctness
      - name: Remove duplicated local assignment
        shell: python
        run: |
          from pathlib import Path
          path = Path("custom_components/extended_openai_conversation_responses/entity.py")
          text = path.read_text()
          duplicate = "            finish_reason = choice.finish_reason\n            finish_reason = choice.finish_reason\n"
          if duplicate in text:
              path.write_text(text.replace(duplicate, "            finish_reason = choice.finish_reason\n", 1))
      - name: Commit cleanup
        run: |
          if git diff --quiet -- custom_components/extended_openai_conversation_responses/entity.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/entity.py
          git commit -m "Deduplicate Chat finish reason assignment"
          git push origin HEAD:fix/stream-terminal-correctness
