name: Temporary regex production patch

on:
  push:
    branches:
      - fix/regex-process-isolation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/regex-process-isolation
      - name: Apply production wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/extended_openai_conversation_responses/function_execution.py')
          text = path.read_text()
          marker = '''async def async_validate_function_arguments(\n    hass: HomeAssistant,\n    spec: Mapping[str, Any],\n    arguments: Mapping[str, Any],\n) -> dict[str, Any]:\n    """Validate Function Tool arguments away from Home Assistant's event loop."""\n    return await hass.async_add_executor_job(\n        validate_function_arguments, spec, arguments\n    )\n'''
          replacement = '''def _schema_contains_pattern(schema: Mapping[str, Any]) -> bool:\n    """Return whether a schema tree contains a configured string pattern."""\n    if "pattern" in schema:\n        return True\n    properties = schema.get("properties")\n    if isinstance(properties, Mapping) and any(\n        isinstance(child, Mapping) and _schema_contains_pattern(child)\n        for child in properties.values()\n    ):\n        return True\n    additional = schema.get("additionalProperties")\n    if isinstance(additional, Mapping) and _schema_contains_pattern(additional):\n        return True\n    items = schema.get("items")\n    return isinstance(items, Mapping) and _schema_contains_pattern(items)\n\n\ndef _schema_without_patterns(value: Any) -> Any:\n    """Copy a JSON-schema tree while removing only runtime pattern constraints."""\n    if isinstance(value, Mapping):\n        return {\n            key: _schema_without_patterns(item)\n            for key, item in value.items()\n            if key != "pattern"\n        }\n    if isinstance(value, list):\n        return [_schema_without_patterns(item) for item in value]\n    return value\n\n\ndef _collect_pattern_checks(\n    name: str,\n    value: Any,\n    schema: Mapping[str, Any],\n    checks: list[tuple[str, str, str, int]],\n) -> None:\n    """Collect configured regex checks from already type-validated arguments."""\n    expected = schema.get("type")\n    if expected is None:\n        if _OBJECT_KEYWORDS.intersection(schema):\n            expected = "object"\n        elif _ARRAY_KEYWORDS.intersection(schema):\n            expected = "array"\n    expected_types = {expected} if isinstance(expected, str) else set(expected or [])\n\n    if "object" in expected_types and isinstance(value, Mapping):\n        properties = schema.get("properties", {})\n        additional = schema.get("additionalProperties", True)\n        if isinstance(properties, Mapping):\n            for key, item in value.items():\n                child = properties.get(key)\n                if child is None and isinstance(additional, Mapping):\n                    child = additional\n                if isinstance(child, Mapping):\n                    _collect_pattern_checks(\n                        _field_name(name, str(key)), item, child, checks\n                    )\n    elif "array" in expected_types and isinstance(value, list):\n        items = schema.get("items")\n        if isinstance(items, Mapping):\n            for index, item in enumerate(value):\n                _collect_pattern_checks(\n                    f"{name or 'input'}[{index}]", item, items, checks\n                )\n    elif "string" in expected_types and isinstance(value, str):\n        pattern = schema.get("pattern")\n        if pattern is not None:\n            if not isinstance(pattern, str):\n                raise _schema_error("pattern must be a string")\n            checks.append((name or "input", pattern, value, 0))\n\n\nasync def async_validate_function_arguments(\n    hass: HomeAssistant,\n    spec: Mapping[str, Any],\n    arguments: Mapping[str, Any],\n) -> dict[str, Any]:\n    """Validate Function Tool arguments with bounded configurable regex matching."""\n    schema = spec.get("parameters", {})\n    if not isinstance(schema, Mapping) or not _schema_contains_pattern(schema):\n        return await hass.async_add_executor_job(\n            validate_function_arguments, spec, arguments\n        )\n\n    # Run all non-pattern validation first, so configured regex is evaluated only\n    # against values that have already passed the normal schema/type contract.\n    stripped_spec = dict(spec)\n    stripped_spec["parameters"] = _schema_without_patterns(schema)\n    validated = await hass.async_add_executor_job(\n        validate_function_arguments, stripped_spec, arguments\n    )\n\n    checks: list[tuple[str, str, str, int]] = []\n    _collect_pattern_checks("", validated, schema, checks)\n    if not checks:\n        return validated\n\n    from .regex_execution import async_search_configured_patterns\n\n    matches = await async_search_configured_patterns(\n        hass, [(pattern, value, flags) for _, pattern, value, flags in checks]\n    )\n    for (name, _pattern, _value, _flags), matches_pattern in zip(\n        checks, matches, strict=True\n    ):\n        if not matches_pattern:\n            raise HomeAssistantError(\n                f"Function input `{name}` does not match its required pattern"\n            )\n    return validated\n'''
          if marker not in text:
              raise SystemExit('async validator block not found')
          path.write_text(text.replace(marker, replacement, 1))

          path = Path('custom_components/extended_openai_conversation_responses/functions/bash.py')
          text = path.read_text()
          text = text.replace(
              'from ..regex_execution import async_run_configurable_regex\n',
              'from ..regex_execution import async_search_configured_patterns\n',
              1,
          )
          old = '''        """Run command guards, including configured regex allowlists, off-loop."""\n        await async_run_configurable_regex(\n            hass,\n            self._guard_command,\n            command,\n            cwd,\n            restrict_to_workspace,\n            allow_patterns,\n        )\n'''
          new = '''        """Run configured allowlist regex in a bounded child process."""\n        if allow_patterns:\n            matches = await async_search_configured_patterns(\n                hass,\n                [(pattern, command, re.IGNORECASE) for pattern in allow_patterns],\n            )\n            if not any(matches):\n                raise ValueError("Command blocked: not in allowlist")\n\n        # Built-in defensive patterns are fixed by the integration and remain on the\n        # ordinary executor fast path. Do not re-run administrator patterns here.\n        await hass.async_add_executor_job(\n            self._guard_command,\n            command,\n            cwd,\n            restrict_to_workspace,\n            None,\n        )\n'''
          if old not in text:
              raise SystemExit('bash async guard block not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('custom_components/extended_openai_conversation_responses/delayed_tools.py')
          text = path.read_text()
          text = text.replace(
              '    split_legacy_execution_delay,\n    validate_function_arguments,\n',
              '    async_validate_function_arguments,\n    split_legacy_execution_delay,\n',
              1,
          )
          old = '        arguments = validate_function_arguments(spec, tool_input.tool_args)\n'
          new = '''        arguments = await async_validate_function_arguments(\n            entity.hass, spec, tool_input.tool_args\n        )\n'''
          if old not in text:
              raise SystemExit('delayed sync validation call not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/extended_openai_conversation_responses/function_execution.py custom_components/extended_openai_conversation_responses/functions/bash.py custom_components/extended_openai_conversation_responses/delayed_tools.py
          git commit -m 'Route configurable regex through bounded process isolation'
          git push origin HEAD:fix/regex-process-isolation
