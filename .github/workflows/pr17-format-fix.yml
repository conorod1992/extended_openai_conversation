name: PR17 format fix

on:
  push:
    branches:
      - fix/pr17-request-rule-determinism

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr17-request-rule-determinism
      - name: Apply formatter-only change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/extended_openai_conversation_responses/request_rules.py")
          text = path.read_text()
          old = '''    return {\n        entity.name: str(entity.value).strip()\n        for entity in context.entities\n    }\n'''
          new = '''    return {entity.name: str(entity.value).strip() for entity in context.entities}\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one formatter target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr17-format-fix.yml
          git add custom_components/extended_openai_conversation_responses/request_rules.py
          git commit -m "Format PR17 sentence matcher"
          git push
