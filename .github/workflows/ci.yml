name: ci

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HA_CORE_REPO: "home-assistant/core"
  HA_CORE_BRANCH: "dev"

jobs:
  prepare:
    name: Prepare versions from HA core
    runs-on: ubuntu-latest
    outputs:
      python-version: ${{ steps.get-versions.outputs.python-version }}
      ha-core-sha: ${{ steps.get-versions.outputs.ha-core-sha }}
      openai-version: ${{ steps.get-versions.outputs.openai-version }}
      hassil-version: ${{ steps.get-versions.outputs.hassil-version }}
      home-assistant-intents-version: ${{ steps.get-versions.outputs.home-assistant-intents-version }}
      xmltodict-version: ${{ steps.get-versions.outputs.xmltodict-version }}
      beautifulsoup4-version: ${{ steps.get-versions.outputs.beautifulsoup4-version }}
      lxml-version: ${{ steps.get-versions.outputs.lxml-version }}
    steps:
      - name: Get versions from Home Assistant core
        id: get-versions
        run: |
          # Function to extract package version from manifest
          get_package_version() {
            local manifest="$1"
            local package="$2"
            echo "$manifest" | grep -o "\"$package==[^\"]*\"" | sed "s/\"$package==//;s/\"//"
          }

          # Resolve one exact HA Core dev snapshot and use it consistently for
          # Python, dependency metadata, and the cached HA-dev wheel.
          HA_CORE_SHA="$(git ls-remote "https://github.com/${{ env.HA_CORE_REPO }}.git" "refs/heads/${{ env.HA_CORE_BRANCH }}" | awk '{print $1}')"
          test -n "$HA_CORE_SHA"
          echo "ha-core-sha=$HA_CORE_SHA" >> $GITHUB_OUTPUT
          echo "Home Assistant Core dev commit: $HA_CORE_SHA"

          PYTHON_VERSION=$(curl -fsSL https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/.python-version | tr -d '\n')
          echo "python-version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "Python version from HA core: $PYTHON_VERSION"

          # Get openai_conversation dependencies
          OPENAI_MANIFEST=$(curl -fsSL https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/homeassistant/components/openai_conversation/manifest.json)
          OPENAI_VERSION=$(get_package_version "$OPENAI_MANIFEST" "openai")
          echo "openai-version=$OPENAI_VERSION" >> $GITHUB_OUTPUT
          echo "openai version from HA core: $OPENAI_VERSION"

          # Get conversation dependencies
          CONVERSATION_MANIFEST=$(curl -fsSL https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/homeassistant/components/conversation/manifest.json)
          HASSIL_VERSION=$(get_package_version "$CONVERSATION_MANIFEST" "hassil")
          echo "hassil-version=$HASSIL_VERSION" >> $GITHUB_OUTPUT
          echo "hassil version from HA core: $HASSIL_VERSION"

          HA_INTENTS_VERSION=$(get_package_version "$CONVERSATION_MANIFEST" "home-assistant-intents")
          echo "home-assistant-intents-version=$HA_INTENTS_VERSION" >> $GITHUB_OUTPUT
          echo "home-assistant-intents version from HA core: $HA_INTENTS_VERSION"

          # Get rest dependencies
          REST_MANIFEST=$(curl -fsSL https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/homeassistant/components/rest/manifest.json)
          XMLTODICT_VERSION=$(get_package_version "$REST_MANIFEST" "xmltodict")
          echo "xmltodict-version=$XMLTODICT_VERSION" >> $GITHUB_OUTPUT
          echo "xmltodict version from HA core: $XMLTODICT_VERSION"

          # Get scrape dependencies
          SCRAPE_MANIFEST=$(curl -fsSL https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/homeassistant/components/scrape/manifest.json)
          BS4_VERSION=$(get_package_version "$SCRAPE_MANIFEST" "beautifulsoup4")
          echo "beautifulsoup4-version=$BS4_VERSION" >> $GITHUB_OUTPUT
          echo "beautifulsoup4 version from HA core: $BS4_VERSION"

          LXML_VERSION=$(get_package_version "$SCRAPE_MANIFEST" "lxml")
          echo "lxml-version=$LXML_VERSION" >> $GITHUB_OUTPUT
          echo "lxml version from HA core: $LXML_VERSION"
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ needs.prepare.outputs.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff linter
        run: ruff check custom_components/

      - name: Run Ruff formatter check
        run: ruff format --check custom_components/

      - name: Check frontend modules and help metadata
        run: |
          node --check custom_components/extended_openai_conversation_responses/frontend/agent-config-help.js
          node --check custom_components/extended_openai_conversation_responses/frontend/agent-config-editor.js
          node --check custom_components/extended_openai_conversation_responses/frontend/frontend-navigation.js
          node --check custom_components/extended_openai_conversation_responses/frontend/guest-mode-ui.js
          node --check custom_components/extended_openai_conversation_responses/frontend/guide-content.js
          node --check custom_components/extended_openai_conversation_responses/frontend/guide-page.js
          node --check custom_components/extended_openai_conversation_responses/frontend/management-panel.js
          node --check custom_components/extended_openai_conversation_responses/frontend/overview-page.js
          node --check custom_components/extended_openai_conversation_responses/frontend/request-rules-ui.js
          node --check custom_components/extended_openai_conversation_responses/frontend/usage-chart.js

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ needs.prepare.outputs.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install dependencies with versions from HA core
          pip install \
            "openai==${{ needs.prepare.outputs.openai-version }}" \
            "hassil==${{ needs.prepare.outputs.hassil-version }}" \
            "home-assistant-intents==${{ needs.prepare.outputs.home-assistant-intents-version }}" \
            "xmltodict==${{ needs.prepare.outputs.xmltodict-version }}" \
            "beautifulsoup4==${{ needs.prepare.outputs.beautifulsoup4-version }}" \
            "lxml==${{ needs.prepare.outputs.lxml-version }}"
          pip install -r requirements_test.txt
          pip install mypy

      - name: Run MyPy
        run: mypy custom_components/extended_openai_conversation_responses

  stable-test:
    name: Test (HA stable)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reconcile current stable test requirements
        run: |
          CURRENT_ENVIRONMENT_SHA="$(cat requirements_test.txt custom_components/extended_openai_conversation_responses/manifest.json | sha256sum | awk '{print $1}')"
          BUILT_ENVIRONMENT_SHA="$(cat /opt/eoai-ci/environment.sha256)"
          if [ "$CURRENT_ENVIRONMENT_SHA" = "$BUILT_ENVIRONMENT_SHA" ]; then
            echo "Prebuilt dependency environment matches this checkout; skipping reconciliation."
          else
            echo "Dependency declarations changed; reconciling prebuilt environment."
            pip install -r requirements_test.txt
            pip install --upgrade homeassistant
            python ci/install_ha_dependencies.py \
              --manifest custom_components/extended_openai_conversation_responses/manifest.json
          fi

      - name: Install AI Task media dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import homeassistant

          components = Path(next(iter(homeassistant.__path__))) / "components"
          requirements = set()
          for domain in ("camera", "stream"):
              manifest = json.loads((components / domain / "manifest.json").read_text())
              requirements.update(manifest.get("requirements", []))
          if requirements:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *sorted(requirements)])
          PY

      - name: Verify stable test environment
        run: |
          pip check
          python -c "from importlib.metadata import version; print('homeassistant=' + version('homeassistant'))"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ \
            -n 2 \
            --dist=loadscope \
            -v \
            --asyncio-mode=auto \
            --timeout=30 \
            --cov=custom_components/extended_openai_conversation_responses \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term-missing

  dev-test:
    name: Test (HA dev)
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ needs.prepare.outputs.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          allow-prereleases: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "openai==${{ needs.prepare.outputs.openai-version }}" \
            "hassil==${{ needs.prepare.outputs.hassil-version }}" \
            "home-assistant-intents==${{ needs.prepare.outputs.home-assistant-intents-version }}" \
            "xmltodict==${{ needs.prepare.outputs.xmltodict-version }}" \
            "beautifulsoup4==${{ needs.prepare.outputs.beautifulsoup4-version }}" \
            "lxml==${{ needs.prepare.outputs.lxml-version }}"
          grep -v '^pytest-homeassistant-custom-component' requirements_test.txt > "${RUNNER_TEMP}/requirements_test_ha_dev.txt"
          pip install -r "${RUNNER_TEMP}/requirements_test_ha_dev.txt"

      - name: Cache Home Assistant dev wheel
        id: ha-dev-wheel-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ha-dev-wheel
          key: ${{ runner.os }}-ha-dev-wheel-${{ needs.prepare.outputs.python-version }}-${{ needs.prepare.outputs.ha-core-sha }}

      - name: Build Home Assistant dev wheel
        if: steps.ha-dev-wheel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/ha-dev-wheel"
          pip wheel --no-deps \
            "git+https://github.com/${{ env.HA_CORE_REPO }}.git@${{ needs.prepare.outputs.ha-core-sha }}" \
            --wheel-dir "${RUNNER_TEMP}/ha-dev-wheel"

      - name: Install Home Assistant dev
        run: pip install "${RUNNER_TEMP}"/ha-dev-wheel/homeassistant-*.whl

      - name: Install AI Task media dependencies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import homeassistant

          components = Path(next(iter(homeassistant.__path__))) / "components"
          requirements = set()
          for domain in ("camera", "stream"):
              manifest = json.loads((components / domain / "manifest.json").read_text())
              requirements.update(manifest.get("requirements", []))
          if requirements:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *sorted(requirements)])
          PY

      - name: Verify dev test environment
        run: |
          pip check
          python -c "from importlib.metadata import version; print('homeassistant=' + version('homeassistant'))"
          echo "home-assistant-core-sha=${{ needs.prepare.outputs.ha-core-sha }}"

      - name: Run compatibility tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          TEST_PATHS=(
            tests/test_ai_task.py
            tests/test_ai_task_migration.py
            tests/test_ai_task_model_options.py
            tests/test_ai_task_privacy.py
            tests/test_ai_task_web_search.py
            tests/test_broadcast_permissions.py
            tests/test_config_flow_coverage.py
            tests/test_configuration_lifecycle_hardening.py
            tests/test_conversation_entry_ownership.py
            tests/test_conversation_lifecycle.py
            tests/test_conversation_runtime_coverage.py
            tests/test_conversation_security_boundaries.py
            tests/test_entity_attachments.py
            tests/test_entity_content_conversion.py
            tests/test_entity_response_serialization.py
            tests/test_entity_schema_helpers.py
            tests/test_exposed_attributes.py
            tests/test_exposed_entities.py
            tests/test_exposed_entity_attributes.py
            tests/test_frontend_asset_registration.py
            tests/test_ha_actions.py
            tests/test_ha_actions_coverage.py
            tests/test_ha_llm_management.py
            tests/test_ha_llm_tools.py
            tests/test_ha_llm_tools_coverage.py
            tests/test_ha_permissions.py
            tests/test_ha_tool_result_compat.py
            tests/test_identity.py
            tests/test_intercom.py
            tests/test_intercom_runtime_contracts.py
            tests/test_native_action_execution_bounds.py
            tests/test_native_function_execution_budget.py
            tests/test_native_function_schema_contracts.py
            tests/test_process_service.py
            tests/test_reauthentication.py
            tests/test_scope_resolution.py
            tests/test_service_handlers.py
            tests/test_setup_cleanup_ownership.py
            tests/test_voice_identity_runtime.py
          )
          pytest "${TEST_PATHS[@]}" \
            -v \
            --asyncio-mode=auto \
            --timeout=30
