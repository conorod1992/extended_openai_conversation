name: PR15 format

on:
  push:
    branches:
      - fix/pr15-function-tool-config-references

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr15-function-tool-config-references
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Format changed Python files
        run: |
          python -m pip install ruff==0.16.6
          ruff format custom_components/extended_openai_conversation_responses/agent_config.py custom_components/extended_openai_conversation_responses/management_ui.py custom_components/extended_openai_conversation_responses/request_rules.py
          rm .github/workflows/pr15-format.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/agent_config.py custom_components/extended_openai_conversation_responses/management_ui.py custom_components/extended_openai_conversation_responses/request_rules.py .github/workflows/pr15-format.yml
          git commit -m "style: format PR15 changes"
          git push origin HEAD:fix/pr15-function-tool-config-references
