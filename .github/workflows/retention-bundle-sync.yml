name: Temporary Retention bundle sync

on:
  push:
    branches:
      - perf/retention-lightweight-ui

permissions:
  contents: write

concurrency:
  group: retention-bundle-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/retention-lightweight-ui
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit generated bundle
        run: |
          if git diff --quiet -- custom_components/extended_openai_conversation_responses/frontend/dist/; then
            echo "Tracked bundle is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/frontend/dist/
          git commit -m "Rebuild production frontend bundle"
          git push origin HEAD:perf/retention-lightweight-ui
