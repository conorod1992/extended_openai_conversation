name: Format recovery source

on:
  push:
    branches:
      - feature/correctable-function-tool-recovery

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/correctable-function-tool-recovery
      - run: pip install ruff
      - run: |
          ruff format custom_components/extended_openai_conversation_responses/entity.py
          rm .github/workflows/_format_recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format Function Tool recovery integration"
          git push origin HEAD:feature/correctable-function-tool-recovery
