name: Temporary PR 172 formatter
on:
  push:
    branches:
      - fix/continuity-claim-ownership
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/continuity-claim-ownership
      - run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('custom_components/extended_openai_conversation_responses/continuity.py')
          text = path.read_text()
          old = '''    async def async_release(\n        self, key: str | None, claim_token: str | None\n    ) -> None:\n'''
          new = '''    async def async_release(self, key: str | None, claim_token: str | None) -> None:\n'''
          if text.count(old) != 1:
              raise SystemExit('expected async_release formatting block exactly once')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/extended_openai_conversation_responses/continuity.py
          git commit -m 'Apply Ruff formatting to continuity claim release'
          git push origin HEAD:fix/continuity-claim-ownership
