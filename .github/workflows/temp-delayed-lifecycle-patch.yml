name: Temporary delayed lifecycle patch

on:
  push:
    branches:
      - fix/durable-delayed-tool-lifecycle

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/durable-delayed-tool-lifecycle

      - name: Apply delayed scheduler lifecycle fixes
        shell: python
        run: |
          from pathlib import Path

          delayed = Path("custom_components/extended_openai_conversation_responses/delayed_tools.py")
          text = delayed.read_text()
          old_import = "from .function_execution import validate_function_arguments\n"
          new_import = (
              "from .function_execution import (\n"
              "    split_legacy_execution_delay,\n"
              "    validate_function_arguments,\n"
              ")\n"
          )
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif "split_legacy_execution_delay" not in text:
              raise SystemExit("delayed_tools function_execution import marker not found")

          hook_marker = "def _install_execution_hook() -> None:\n"
          if hook_marker not in text:
              raise SystemExit("delayed_tools hook marker not found")
          before, hook = text.split(hook_marker, 1)
          old_header = (
              "        arguments = validate_function_arguments(\n"
              "            function_tool.get(\"spec\", {}), tool_input.tool_args\n"
              "        )\n"
          )
          new_header = (
              "        spec = function_tool.get(\"spec\", {})\n"
              "        arguments = validate_function_arguments(spec, tool_input.tool_args)\n"
              "        execution_arguments, execution_delay = split_legacy_execution_delay(\n"
              "            spec, arguments\n"
              "        )\n"
          )
          if old_header in hook:
              hook = hook.replace(old_header, new_header, 1)
          elif "execution_arguments, execution_delay = split_legacy_execution_delay(" not in hook:
              raise SystemExit("delayed_tools hook validation marker not found")

          old_execute_args = (
              "                arguments,\n"
              "                llm_context,\n"
              "                exposed_entities,\n"
              "            )\n"
          )
          new_execute_args = old_execute_args.replace("arguments", "execution_arguments", 1)
          if old_execute_args in hook:
              hook = hook.replace(old_execute_args, new_execute_args, 1)
          elif "                execution_arguments,\n" not in hook:
              raise SystemExit("delayed_tools delayed execution args marker not found")

          old_background = "        if not entity.should_run_in_background(arguments):\n"
          new_background = "        if not entity.should_run_in_background(execution_delay):\n"
          if old_background in hook:
              hook = hook.replace(old_background, new_background, 1)
          elif new_background not in hook:
              raise SystemExit("delayed_tools background marker not found")
          delayed.write_text(before + hook_marker + hook)

          init = Path("custom_components/extended_openai_conversation_responses/__init__.py")
          text = init.read_text()
          import_marker = "from .debug import DebugOpenAIClientProxy, install_debug_instrumentation\n"
          delayed_import = "from .delayed_tools import async_setup_delayed_tools\n"
          if delayed_import not in text:
              if import_marker not in text:
                  raise SystemExit("__init__ delayed import marker not found")
              text = text.replace(import_marker, import_marker + delayed_import, 1)

          setup_marker = (
              "    # Install last so the gate wraps the effective post-optimization entry points.\n"
              "    install_agent_maintenance_barrier()\n"
          )
          setup_replacement = setup_marker + (
              "    # Activate the durable delayed-tool scheduler after entity hardening so its\n"
              "    # execution hook wraps the final configured Function Tool seam.\n"
              "    await async_setup_delayed_tools(hass)\n"
          )
          if "await async_setup_delayed_tools(hass)" not in text:
              if setup_marker not in text:
                  raise SystemExit("__init__ delayed setup marker not found")
              text = text.replace(setup_marker, setup_replacement, 1)
          init.write_text(text)

      - name: Format and commit production changes
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff format custom_components/extended_openai_conversation_responses/delayed_tools.py custom_components/extended_openai_conversation_responses/__init__.py
          if git diff --quiet -- custom_components/extended_openai_conversation_responses/delayed_tools.py custom_components/extended_openai_conversation_responses/__init__.py; then
            echo "Production changes already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/delayed_tools.py custom_components/extended_openai_conversation_responses/__init__.py
          git commit -m "Activate durable delayed Function Tool lifecycle"
          git push origin HEAD:fix/durable-delayed-tool-lifecycle
