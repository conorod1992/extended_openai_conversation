name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "custom_components/extended_openai_conversation_responses/frontend/**"
      - "tests/*.test.mjs"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "custom_components/extended_openai_conversation_responses/frontend/**"
      - "tests/*.test.mjs"
      - ".github/workflows/frontend.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Commit generated package lock
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already committed"
          else
            git commit -m "Lock frontend dependency resolution"
            git push origin "HEAD:$HEAD_REF"
          fi

      - name: Check shipped frontend modules
        run: |
          find custom_components/extended_openai_conversation_responses/frontend \
            -maxdepth 1 -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check
          find tests -maxdepth 1 -type f -name '*.test.mjs' -print0 \
            | sort -z \
            | xargs -0 -n1 node

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build
