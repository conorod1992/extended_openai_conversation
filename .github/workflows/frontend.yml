name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "custom_components/extended_openai_conversation_responses/frontend/**"
      - "tests/*frontend*.test.mjs"
      - "tests/management-performance-ui.test.mjs"
      - "tests/management-loading-ui.test.mjs"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "custom_components/extended_openai_conversation_responses/frontend/**"
      - "tests/*frontend*.test.mjs"
      - "tests/management-performance-ui.test.mjs"
      - "tests/management-loading-ui.test.mjs"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Check shipped frontend modules
        run: |
          node --check custom_components/extended_openai_conversation_responses/frontend/agent-config-editor.js
          node --check custom_components/extended_openai_conversation_responses/frontend/management-rendering-performance.js
          node --check custom_components/extended_openai_conversation_responses/frontend/management-loading-performance.js
          node --check custom_components/extended_openai_conversation_responses/frontend/management-state-safety.js
          node --check custom_components/extended_openai_conversation_responses/frontend/overview-page.js
          node --check custom_components/extended_openai_conversation_responses/frontend/guide-page.js
          node --check custom_components/extended_openai_conversation_responses/frontend/debug-management.js
          node tests/management-loading-ui.test.mjs
          node tests/frontend-state-safety.test.mjs

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build
