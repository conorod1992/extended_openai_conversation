name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "custom_components/extended_openai_conversation_responses/frontend/**"
      - "tests/*.test.mjs"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - develop
    paths:
      - "frontend/**"
      - "custom_components/extended_openai_conversation_responses/frontend/**"
      - "tests/*.test.mjs"
      - ".github/workflows/frontend.yml"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Finalize reproducible dependency configuration
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git diff --exit-code -- frontend/package-lock.json
          python - <<'PY'
          from pathlib import Path

          replacements = {
              ".github/workflows/ci.yml": {
                  "uses: actions/checkout@v4": "uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4",
                  "uses: actions/setup-python@v5": "uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5",
              },
              ".github/workflows/docs.yml": {
                  "uses: actions/checkout@v4": "uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4",
                  "uses: actions/setup-python@v5": "uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5",
                  "uses: actions/configure-pages@v5": "uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5",
                  "uses: actions/upload-pages-artifact@v3": "uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3",
                  "uses: actions/deploy-pages@v4": "uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4",
              },
              ".github/workflows/hacs.yaml": {
                  'uses: "actions/checkout@v4"': 'uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262" # v4',
                  'uses: "home-assistant/actions/hassfest@master"': 'uses: "home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb" # master',
                  'uses: "actions/checkout@v3"': 'uses: "actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26" # v3',
                  'uses: "hacs/action@main"': 'uses: "hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa" # main',
              },
              ".github/workflows/release.yml": {
                  "uses: actions/checkout@v4": "uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4",
                  "uses: actions/setup-python@v5": "uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5",
              },
              ".github/workflows/version-check.yml": {
                  "uses: actions/checkout@v4": "uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4",
                  "uses: actions/setup-python@v5": "uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5",
              },
          }
          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in mapping.items():
                  if old not in text:
                      raise SystemExit(f"Expected action reference missing from {filename}: {old}")
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          cat > .github/workflows/frontend.yml <<'YAML'
          name: Frontend

          on:
            pull_request:
              paths:
                - "frontend/**"
                - "custom_components/extended_openai_conversation_responses/frontend/**"
                - "tests/*.test.mjs"
                - ".github/workflows/frontend.yml"
            push:
              branches:
                - develop
              paths:
                - "frontend/**"
                - "custom_components/extended_openai_conversation_responses/frontend/**"
                - "tests/*.test.mjs"
                - ".github/workflows/frontend.yml"

          concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              name: Type check, test, and build
              runs-on: ubuntu-latest
              steps:
                - name: Checkout repository
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

                - name: Set up Node.js
                  uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
                  with:
                    node-version: "24"

                - name: Install frontend dependencies
                  working-directory: frontend
                  run: npm ci --no-audit --no-fund

                - name: Check shipped frontend modules
                  run: |
                    find custom_components/extended_openai_conversation_responses/frontend \
                      -maxdepth 1 -type f -name '*.js' -print0 \
                      | xargs -0 -n1 node --check
                    find tests -maxdepth 1 -type f -name '*.test.mjs' -print0 \
                      | sort -z \
                      | xargs -0 -n1 node

                - name: Type check
                  working-directory: frontend
                  run: npm run check

                - name: Run frontend tests
                  working-directory: frontend
                  run: npm test

                - name: Build frontend bundle
                  working-directory: frontend
                  run: npm run build
          YAML
          cat > .github/dependabot.yml <<'YAML'
          version: 2
          updates:
            - package-ecosystem: npm
              directory: /frontend
              schedule:
                interval: monthly
              open-pull-requests-limit: 5

            - package-ecosystem: github-actions
              directory: /
              schedule:
                interval: monthly
              open-pull-requests-limit: 5
          YAML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/dependabot.yml .github/workflows frontend/package-lock.json
          git diff --cached --check
          git commit -m "Make CI dependency resolution reproducible"
          git push origin "HEAD:$HEAD_REF"

      - name: Check shipped frontend modules
        run: |
          find custom_components/extended_openai_conversation_responses/frontend \
            -maxdepth 1 -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check
          find tests -maxdepth 1 -type f -name '*.test.mjs' -print0 \
            | sort -z \
            | xargs -0 -n1 node

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build
