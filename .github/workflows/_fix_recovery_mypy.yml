name: Fix recovery type checking

on:
  push:
    branches:
      - feature/correctable-function-tool-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/correctable-function-tool-recovery
          fetch-depth: 0

      - name: Apply type-safe names and return cast
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/extended_openai_conversation_responses/tool_exchange.py")
          text = path.read_text()
          text = text.replace("from typing import Any\n", "from typing import Any, cast\n", 1)
          old_return = '''    with bind_tool_recovery_state(recovery_state):\n        return await entity._execute_function_tool(\n            function_tool, tool_input, llm_context, exposed_entities\n        )\n'''
          new_return = '''    with bind_tool_recovery_state(recovery_state):\n        return cast(\n            conversation.ToolResultContent,\n            await entity._execute_function_tool(\n                function_tool, tool_input, llm_context, exposed_entities\n            ),\n        )\n'''
          if old_return not in text:
              raise SystemExit("bound execution return anchor not found")
          text = text.replace(old_return, new_return, 1)

          old_parallel = '''        for function_tool, tool_input in parallel_batch:\n            outcome = await _async_validate_recoverable_call(\n                entity, function_tool, tool_input, recovery_state\n            )\n            if isinstance(outcome, CorrectableToolFailure):\n                if not recovery_state.consume():\n                    append_unresolved_tool_results(\n                        chat_log,\n                        entity.entity_id,\n                        pending_tool_calls,\n                        failed_call_id=tool_input.id,\n                        error=outcome.original,\n                    )\n                    raise outcome.original\n                recovery_results[tool_input.id] = recovery_tool_result(\n                    entity.entity_id, tool_input, outcome\n                )\n            else:\n                prepared.append((function_tool, outcome))\n'''
          new_parallel = '''        for function_tool, tool_input in parallel_batch:\n            validation_outcome = await _async_validate_recoverable_call(\n                entity, function_tool, tool_input, recovery_state\n            )\n            if isinstance(validation_outcome, CorrectableToolFailure):\n                if not recovery_state.consume():\n                    append_unresolved_tool_results(\n                        chat_log,\n                        entity.entity_id,\n                        pending_tool_calls,\n                        failed_call_id=tool_input.id,\n                        error=validation_outcome.original,\n                    )\n                    raise validation_outcome.original\n                recovery_results[tool_input.id] = recovery_tool_result(\n                    entity.entity_id, tool_input, validation_outcome\n                )\n            else:\n                prepared.append((function_tool, validation_outcome))\n'''
          if old_parallel not in text:
              raise SystemExit("parallel validation anchor not found")
          text = text.replace(old_parallel, new_parallel, 1)

          old_map = '''            execution_outcomes = {\n                tool_input.id: outcome\n                for (_, tool_input), outcome in zip(prepared, outcomes, strict=True)\n            }\n'''
          new_map = '''            execution_outcomes = {\n                tool_input.id: execution_outcome\n                for (_, tool_input), execution_outcome in zip(\n                    prepared, outcomes, strict=True\n                )\n            }\n'''
          if old_map not in text:
              raise SystemExit("execution outcome map anchor not found")
          text = text.replace(old_map, new_map, 1)

          old_final = '''            outcome = execution_outcomes.get(tool_input.id)\n            if isinstance(outcome, BaseException):\n                append_unresolved_tool_results(\n                    chat_log,\n                    entity.entity_id,\n                    [tool_input],\n                    failed_call_id=tool_input.id,\n                    error=outcome,\n                )\n                if first_error is None:\n                    first_error = outcome\n            elif outcome is not None:\n                chat_log.async_add_assistant_content_without_tools(outcome)\n'''
          new_final = '''            execution_outcome = execution_outcomes.get(tool_input.id)\n            if isinstance(execution_outcome, BaseException):\n                append_unresolved_tool_results(\n                    chat_log,\n                    entity.entity_id,\n                    [tool_input],\n                    failed_call_id=tool_input.id,\n                    error=execution_outcome,\n                )\n                if first_error is None:\n                    first_error = execution_outcome\n            elif execution_outcome is not None:\n                chat_log.async_add_assistant_content_without_tools(execution_outcome)\n'''
          if old_final not in text:
              raise SystemExit("final outcome anchor not found")
          text = text.replace(old_final, new_final, 1)

          path.write_text(text)
          Path(".github/workflows/_fix_recovery_mypy.yml").unlink()
          PY

      - name: Format and validate
        run: |
          python -m pip install ruff
          ruff format custom_components/extended_openai_conversation_responses/tool_exchange.py
          ruff check custom_components/extended_openai_conversation_responses/tool_exchange.py
          git diff --check

      - name: Commit type-check fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Function Tool recovery type checking"
          git push origin HEAD:feature/correctable-function-tool-recovery
