name: CI image size benchmark

on:
  push:
    branches:
      - codex/ci-image-benchmark

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and publish slim HA image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile.stable
          target: ha-stable
          push: true
          tags: ${{ env.IMAGE }}:bench-ha-${{ github.sha }}
          cache-from: type=gha,scope=stable-ci-image
          cache-to: type=gha,mode=max,scope=stable-ci-image-benchmark
      - name: Build and publish full Chromium comparison
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile.stable
          target: browser-stable
          build-args: PLAYWRIGHT_CHROMIUM_INSTALL_FLAGS=--with-deps
          push: true
          tags: ${{ env.IMAGE }}:bench-browser-full-${{ github.sha }}
          cache-from: |
            type=gha,scope=stable-ci-image
            type=gha,scope=stable-ci-image-benchmark
          cache-to: type=gha,mode=max,scope=stable-ci-image-benchmark
      - name: Build and publish headless shell comparison
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ci/Dockerfile.stable
          target: browser-stable
          push: true
          tags: ${{ env.IMAGE }}:bench-browser-shell-${{ github.sha }}
          cache-from: |
            type=gha,scope=stable-ci-image
            type=gha,scope=stable-ci-image-benchmark
          cache-to: type=gha,mode=max,scope=stable-ci-image-benchmark
      - name: Report compressed image sizes
        run: |
          for tag in ha-stable "bench-ha-${GITHUB_SHA}" browser-stable \
            "bench-browser-full-${GITHUB_SHA}" "bench-browser-shell-${GITHUB_SHA}"; do
            manifest="$(docker buildx imagetools inspect --raw "${IMAGE}:${tag}")"
            digest="$(jq -r '.manifests[]? | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "$manifest" | head -n 1)"
            if [ -n "$digest" ]; then
              manifest="$(docker buildx imagetools inspect --raw "${IMAGE}@${digest}")"
            fi
            bytes="$(jq '[.layers[].size] | add' <<< "$manifest")"
            echo "${tag} ${bytes} bytes"
          done

  ha:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            image: ghcr.io/conorod1992/extended-openai-ci-stable:ha-stable
          - variant: slim
            image: ghcr.io/conorod1992/extended-openai-ci-stable:bench-ha-${{ github.sha }}
    name: Stable HA (${{ matrix.variant }})
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify environment and run all Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip check
          python -c "from importlib.metadata import version; print('homeassistant=' + version('homeassistant'))"
          test -s /opt/eoai-ci/media-dependencies.ready
          pytest tests/ -n 2 --dist=loadscope -q --asyncio-mode=auto --timeout=30 \
            --cov=custom_components/extended_openai_conversation_responses \
            --cov-branch --cov-report=term

  browser:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: baseline
            image: ghcr.io/conorod1992/extended-openai-ci-stable:browser-stable
          - variant: full
            image: ghcr.io/conorod1992/extended-openai-ci-stable:bench-browser-full-${{ github.sha }}
          - variant: shell
            image: ghcr.io/conorod1992/extended-openai-ci-stable:bench-browser-shell-${{ github.sha }}
    name: Real HA browser (${{ matrix.variant }})
    container:
      image: ${{ matrix.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify environment and run genuine HA browser tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          RUN_REAL_HA_BROWSER: "1"
        run: |
          pip check
          node --version
          npx playwright --version
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0
          pytest tests_real_ha/test_browser_backend_acceptance.py \
            tests_real_ha/test_browser_refresh_boundary_acceptance.py \
            tests_real_ha/test_browser_process_restart_acceptance.py \
            tests_real_ha/test_browser_runtime_acceptance.py \
            -q --asyncio-mode=auto --timeout=180
