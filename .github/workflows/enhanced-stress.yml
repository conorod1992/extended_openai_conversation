            long-lifetime) TEST_PATHS=(tests_stress/test_process_resource_soak.py tests_stress/test_responses_scale_fairness.py) ;;
            *) exit 2 ;;
          esac
          set +e
          TEST_TIMEOUT=600
          if [ "$STRESS_CAMPAIGN" = long-lifetime ]; then TEST_TIMEOUT=2400; fi
          pytest "${TEST_PATHS[@]}" -v -s --asyncio-mode=auto --log-cli-level=WARNING \
            --timeout="$TEST_TIMEOUT" --durations=20 \
            --stress-seed="$STRESS_SEED" --stress-intensity="$STRESS_INTENSITY" \
            --show-capture=no --tb=short > enhanced-raw.log 2>&1
          RESULT=$?
          python ci/enhanced_evidence.py sanitize-log enhanced-raw.log stress-artifacts/pytest.log
          rm enhanced-raw.log
          cat stress-artifacts/pytest.log
          if [ "$STRESS_CAMPAIGN" = diagnostics ]; then
            test "$RESULT" -ne 0
            python ci/verify_enhanced_failure.py stress-artifacts stress-artifacts/pytest.log
          else
            exit "$RESULT"
          fi
