name: Enhanced nightly acceptance and stress

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign to run
        type: choice
        required: true
        default: all
        options: [all, runtime, lifecycle, ai-task, voice-intercom, archive, feature-crossroads, setup, backup, backup-transfer, persistence, request-rules, guest-security, quiet-hours, functions, provider-resilience, memory-knowledge, large-installation, browser, browser-engines, chaos, process-chaos, long-lifetime, diagnostics]
      intensity:
        description: Workload multiplier
        type: choice
        required: true
        default: normal
        options: [normal, heavy, all]
      seed:
        description: Optional deterministic unsigned integer seed
        type: string
        required: false

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: enhanced-stress-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.sha }}
      seed: ${{ steps.seed.outputs.seed }}
      intensities: ${{ steps.seed.outputs.intensities }}
      campaigns: ${{ steps.seed.outputs.campaigns }}
      ha_version: ${{ steps.ha.outputs.version }}
      ha_test_plugin_version: ${{ steps.ha.outputs.plugin_version }}
      published_release_tag: ${{ steps.release.outputs.tag }}
      published_release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout invocation commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve immutable candidate
        id: candidate
        env:
          INVOCATION_SHA: ${{ github.sha }}
        run: |
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          test "$CANDIDATE_SHA" = "$INVOCATION_SHA"
          echo "sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "Candidate SHA: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve current stable Home Assistant version
        id: ha
        run: |
          VERSION="$(curl -fsSL https://pypi.org/pypi/homeassistant/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')"
          test -n "$VERSION"
          PLUGIN_VERSION="$(python3 ci/resolve_ha_test_plugin.py "$VERSION")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "plugin_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "Stable Home Assistant: $VERSION; compatible test plugin: $PLUGIN_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve one published EOAI release for persistence checks
        id: release
        if: github.event_name == 'schedule' || inputs.campaign == 'all' || inputs.campaign == 'persistence'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/releases/latest" | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          test -n "$TAG"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          SHA="$(git rev-parse "${TAG}^{commit}")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Published persistence baseline: $TAG ($SHA)" >> "$GITHUB_STEP_SUMMARY"
      - name: Resolve reproducible run controls
        id: seed
        env:
          REQUESTED_SEED: ${{ inputs.seed }}
          REQUESTED_INTENSITY: ${{ inputs.intensity }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SEED" ]; then
            [[ "$REQUESTED_SEED" =~ ^[0-9]+$ ]] || { echo 'Seed must be an unsigned integer' >&2; exit 1; }
            SEED="$REQUESTED_SEED"
          else
            SEED="$(python3 -c 'import secrets; print(secrets.randbits(32))')"
          fi
          INTENSITY="${REQUESTED_INTENSITY:-normal}"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == schedule || "$INTENSITY" == all ]]; then
            echo 'intensities=["normal","heavy"]' >> "$GITHUB_OUTPUT"
          else
            echo "intensities=[\"$INTENSITY\"]" >> "$GITHUB_OUTPUT"
          fi
          case "${{ inputs.campaign }}" in
            '') CAMPAIGNS='["runtime","lifecycle","ai-task","voice-intercom","archive","feature-crossroads","setup","backup","backup-transfer","persistence","request-rules","guest-security","quiet-hours","functions","provider-resilience","memory-knowledge","large-installation","chaos","process-chaos","long-lifetime"]' ;;
            all|browser) CAMPAIGNS='["runtime","lifecycle","ai-task","voice-intercom","archive","feature-crossroads","setup","backup","backup-transfer","persistence","request-rules","guest-security","quiet-hours","functions","provider-resilience","memory-knowledge","large-installation","chaos","process-chaos","long-lifetime"]' ;;
            browser-engines) CAMPAIGNS='[]' ;;
            long-lifetime) CAMPAIGNS='["long-lifetime"]' ;;
            runtime|lifecycle|ai-task|voice-intercom|archive|feature-crossroads|setup|backup|backup-transfer|persistence|request-rules|guest-security|quiet-hours|functions|provider-resilience|memory-knowledge|large-installation|chaos|process-chaos|diagnostics) CAMPAIGNS="[\"${{ inputs.campaign }}\"]" ;;
            *) echo 'Unknown campaign' >&2; exit 1 ;;
          esac
          echo "campaigns=$CAMPAIGNS" >> "$GITHUB_OUTPUT"
          echo "ENHANCED STRESS SEED=$SEED INTENSITY=$INTENSITY"
          {
            echo '## Enhanced acceptance run'
            echo
            echo "Seed: \`$SEED\` · Intensity: \`$INTENSITY\`"
            echo
            echo 'Reproduce with workflow_dispatch and the same campaign, intensity, and seed.'
          } >> "$GITHUB_STEP_SUMMARY"

  persistence_runtime:
    name: Prepare isolated published-release runtime
    needs: prepare
    if: github.event_name == 'schedule' || inputs.campaign == 'all' || inputs.campaign == 'persistence'
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.identity.outputs.cache_key }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      EOAI_CONTAINER_IMAGE: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      HISTORICAL_RELEASE_TAG: ${{ needs.prepare.outputs.published_release_tag }}
      HISTORICAL_RELEASE_SHA: ${{ needs.prepare.outputs.published_release_sha }}
      HISTORICAL_HA_VERSION: "2026.9.4"
      HISTORICAL_BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
    steps:
      - name: Checkout immutable run candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
      - name: Stage published manifest and build identity inputs
        id: identity
        run: |
          set -euo pipefail
          HISTORICAL_RUNTIME_DIR="$RUNNER_TEMP/eoai-released-ha"
          HISTORICAL_INPUT_DIR="$RUNNER_TEMP/eoai-released-input"
          HISTORICAL_MANIFEST="$HISTORICAL_INPUT_DIR/manifest.json"
          echo "HISTORICAL_RUNTIME_DIR=$HISTORICAL_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "HISTORICAL_INPUT_DIR=$HISTORICAL_INPUT_DIR" >> "$GITHUB_ENV"
          echo "HISTORICAL_MANIFEST=$HISTORICAL_MANIFEST" >> "$GITHUB_ENV"
          echo "runtime_dir=$HISTORICAL_RUNTIME_DIR" >> "$GITHUB_OUTPUT"
          echo "input_dir=$HISTORICAL_INPUT_DIR" >> "$GITHUB_OUTPUT"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --force origin "refs/tags/${HISTORICAL_RELEASE_TAG}:refs/tags/${HISTORICAL_RELEASE_TAG}"
          test "$(git rev-parse "${HISTORICAL_RELEASE_TAG}^{commit}")" = "$HISTORICAL_RELEASE_SHA"
          mkdir -p "$HISTORICAL_INPUT_DIR"
          git show "${HISTORICAL_RELEASE_SHA}:custom_components/extended_openai_conversation_responses/manifest.json" \
            > "$HISTORICAL_INPUT_DIR/manifest.json"
          apt-get update
          apt-get install -y --no-install-recommends build-essential
          CACHE_KEY="$(python ci/historical_runtime_identity.py \
            --manifest "$HISTORICAL_INPUT_DIR/manifest.json" \
            --release-tag "$HISTORICAL_RELEASE_TAG" \
            --release-sha "$HISTORICAL_RELEASE_SHA" \
            --homeassistant-version "$HISTORICAL_HA_VERSION" \
            --base-image "$HISTORICAL_BASE_IMAGE" \
            --recipe ci/install_ha_dependencies.py \
            --recipe ci/prepare_historical_runtime.sh \
            --recipe ci/historical_runtime_identity.py \
            --print-key)"
          echo "cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "Historical runtime cache identity: $CACHE_KEY" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore or save isolated historical runtime
        id: historical-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.identity.outputs.runtime_dir }}
          key: ${{ steps.identity.outputs.cache_key }}
      - name: Construct isolated runtime on cache miss
        if: steps.historical-cache.outputs.cache-hit != 'true'
        run: bash ci/prepare_historical_runtime.sh
      - name: Verify immutable historical runtime
        run: |
          set -euo pipefail
          HISTORICAL_PYTHON="$HISTORICAL_RUNTIME_DIR/bin/python"
          "$HISTORICAL_PYTHON" ci/historical_runtime_identity.py \
            --manifest "$HISTORICAL_INPUT_DIR/manifest.json" \
            --release-tag "$HISTORICAL_RELEASE_TAG" \
            --release-sha "$HISTORICAL_RELEASE_SHA" \
            --homeassistant-version "$HISTORICAL_HA_VERSION" \
            --base-image "$HISTORICAL_BASE_IMAGE" \
            --recipe ci/install_ha_dependencies.py \
            --recipe ci/prepare_historical_runtime.sh \
            --recipe ci/historical_runtime_identity.py \
            --check "$HISTORICAL_RUNTIME_DIR/.eoai-runtime-identity.json"
          test "$("$HISTORICAL_PYTHON" -c 'from importlib.metadata import version; print(version("homeassistant"))')" = "$HISTORICAL_HA_VERSION"
          echo "Historical runtime ready; current candidate runtime remains separate." >> "$GITHUB_STEP_SUMMARY"

  python-campaigns:
    name: ${{ matrix.campaign }} / ${{ matrix.intensity }}
    needs: [prepare, persistence_runtime]
    if: always() && needs.prepare.result == 'success' && (github.event_name == 'schedule' || (inputs.campaign != 'browser' && inputs.campaign != 'browser-engines'))
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJSON(needs.prepare.outputs.campaigns) }}
        intensity: ${{ fromJSON(needs.prepare.outputs.intensities) }}
        # Run elapsed/idle/expiry coverage once per nightly, at normal intensity.
        exclude: ${{ github.event_name == 'schedule' && fromJSON('[{"campaign":"long-lifetime","intensity":"heavy"}]') || fromJSON('[]') }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}
      STRESS_SEED: ${{ needs.prepare.outputs.seed }}
      STRESS_INTENSITY: ${{ matrix.intensity }}
      STRESS_CAMPAIGN: ${{ matrix.campaign }}
      EOAI_CONTAINER_IMAGE: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      EOAI_EXPECTED_HA_VERSION: ${{ needs.prepare.outputs.ha_version }}
      EOAI_EXPECTED_HA_TEST_PLUGIN_VERSION: ${{ needs.prepare.outputs.ha_test_plugin_version }}
      EOAI_RELEASE_TAG: ${{ needs.prepare.outputs.published_release_tag }}
      EOAI_RELEASE_SHA: ${{ needs.prepare.outputs.published_release_sha }}
      STRESS_ARTIFACT_DIR: stress-artifacts
      ENHANCED_EXECUTION_EVIDENCE: "1"
      PYTEST_PLUGINS: ci.pytest_execution
    steps:
      - name: Checkout immutable run candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
      - name: Set up Node.js for runtime certification guards
        if: matrix.campaign == 'runtime'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Reconcile current test requirements
        run: bash ci/reconcile_stable_environment.sh
      - name: Stage published payload for downgrade boundary
        if: matrix.campaign == 'persistence'
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --force origin "refs/tags/${EOAI_RELEASE_TAG}:refs/tags/${EOAI_RELEASE_TAG}"
          test "$(git rev-parse "${EOAI_RELEASE_TAG}^{commit}")" = "$EOAI_RELEASE_SHA"
          OLD_ROOT="${RUNNER_TEMP}/eoai-downgrade-release"
          mkdir -p "$OLD_ROOT"
          git archive "$EOAI_RELEASE_SHA" custom_components/extended_openai_conversation_responses | tar -x -C "$OLD_ROOT"
          echo "DOWNGRADE_COMPONENT_DIR=$OLD_ROOT/custom_components/extended_openai_conversation_responses" >> "$GITHUB_ENV"
          CANDIDATE_COMPONENT="$GITHUB_WORKSPACE/custom_components/extended_openai_conversation_responses"
          CANDIDATE_VERSION="$(python -c 'import json; print(json.load(open("custom_components/extended_openai_conversation_responses/manifest.json"))["version"])')"
          echo "EOAI_SOURCE_VERSION=$EOAI_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "UPGRADE_FROM_COMPONENT_DIR=$OLD_ROOT/custom_components/extended_openai_conversation_responses" >> "$GITHUB_ENV"
          echo "UPGRADE_TO_COMPONENT_DIR=$CANDIDATE_COMPONENT" >> "$GITHUB_ENV"
          echo "UPGRADE_FROM_VERSION=$EOAI_RELEASE_TAG" >> "$GITHUB_ENV"
          echo "UPGRADE_TO_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
          echo "Downgrade/upgrade source payload: $EOAI_RELEASE_TAG ($EOAI_RELEASE_SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "Upgrade candidate payload: $CANDIDATE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Match historical runtime build tools
        if: matrix.campaign == 'persistence'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential
      - name: Restore isolated historical runtime cache
        if: matrix.campaign == 'persistence' && needs.persistence_runtime.result == 'success'
        id: historical-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/eoai-released-ha
          key: ${{ needs.persistence_runtime.outputs.cache_key }}
      - name: Verify or safely build the historical runtime
        if: matrix.campaign == 'persistence'
        env:
          HISTORICAL_RUNTIME_DIR: ${{ runner.temp }}/eoai-released-ha
          HISTORICAL_MANIFEST: ${{ runner.temp }}/eoai-downgrade-release/custom_components/extended_openai_conversation_responses/manifest.json
          HISTORICAL_RELEASE_TAG: ${{ needs.prepare.outputs.published_release_tag }}
          HISTORICAL_RELEASE_SHA: ${{ needs.prepare.outputs.published_release_sha }}
          HISTORICAL_HA_VERSION: "2026.9.4"
          HISTORICAL_BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
        run: |
          set -euo pipefail
          HISTORICAL_PYTHON="$HISTORICAL_RUNTIME_DIR/bin/python"
          identity_args=(
            --manifest "$HISTORICAL_MANIFEST"
            --release-tag "$HISTORICAL_RELEASE_TAG"
            --release-sha "$HISTORICAL_RELEASE_SHA"
            --homeassistant-version "$HISTORICAL_HA_VERSION"
            --base-image "$HISTORICAL_BASE_IMAGE"
            --recipe ci/install_ha_dependencies.py
            --recipe ci/prepare_historical_runtime.sh
            --recipe ci/historical_runtime_identity.py
          )
          CACHE_VALID=false
          if [[ '${{ needs.persistence_runtime.result }}' == success ]] \
              && [[ '${{ steps.historical-cache.outputs.cache-hit }}' == true ]] \
              && "$HISTORICAL_PYTHON" ci/historical_runtime_identity.py "${identity_args[@]}" \
                --check "$HISTORICAL_RUNTIME_DIR/.eoai-runtime-identity.json"; then
            CACHE_VALID=true
          fi
          if [[ "$CACHE_VALID" != true ]]; then
            bash ci/prepare_historical_runtime.sh
          fi
          "$HISTORICAL_PYTHON" ci/historical_runtime_identity.py "${identity_args[@]}" \
            --check "$HISTORICAL_RUNTIME_DIR/.eoai-runtime-identity.json"
          echo "UPGRADE_RELEASED_PYTHON=$HISTORICAL_PYTHON" >> "$GITHUB_ENV"
          echo "UPGRADE_RELEASED_HA_VERSION=$HISTORICAL_HA_VERSION" >> "$GITHUB_ENV"
          echo "Published upgrade source: $HISTORICAL_RELEASE_TAG ($HISTORICAL_RELEASE_SHA)" >> "$GITHUB_STEP_SUMMARY"
          echo "Historical HA: $HISTORICAL_HA_VERSION; candidate environment remains separate." >> "$GITHUB_STEP_SUMMARY"
      - name: Stage candidate payload for clean-install acceptance
        if: matrix.campaign == 'setup'
        run: |
          set -euo pipefail
          CANDIDATE_COMPONENT="$GITHUB_WORKSPACE/custom_components/extended_openai_conversation_responses"
          CANDIDATE_VERSION="$(python -c 'import json; print(json.load(open("custom_components/extended_openai_conversation_responses/manifest.json"))["version"])')"
          echo "RELEASE_COMPONENT_DIR=$CANDIDATE_COMPONENT" >> "$GITHUB_ENV"
          echo "RELEASE_EXPECTED_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
          echo "Clean-install candidate payload: $CANDIDATE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Run enhanced campaign
        id: campaign_run
        env:
          EOAI_GENERATOR_PROFILE: ${{ matrix.campaign == 'large-installation' && '1' || '0' }}
          EOAI_GENERATOR_PROFILE_PATH: ${{ matrix.campaign == 'large-installation' && 'stress-artifacts/generator-profile.jsonl' || '' }}
        run: |
          case "$STRESS_CAMPAIGN" in
            runtime) TEST_PATHS=(tests_real_ha/test_entry_point_contract_matrix.py tests_real_ha/test_provider_boundary_contracts.py tests_real_ha/test_provider_input_history.py tests_real_ha/test_state_transition_contracts.py tests_real_ha/test_archive_private_activity.py tests_stress/test_execution_contract.py tests_real_ha/test_management_backend_acceptance.py::test_configuration_transfer_survives_reload tests_real_ha/test_provider_serialization_invariants.py tests_real_ha/test_management_backend_acceptance.py::test_undercovered_management_mutations_survive_reload tests_stress/test_runtime_soak.py tests_stress/test_process_resource_soak.py::test_booted_process_resources_and_latency_survive_mixed_traffic tests_stress/test_process_resource_soak.py::test_resource_tripwires_reject_growth_or_lost_responsiveness[assist] tests_stress/test_process_resource_soak.py::test_resource_tripwires_reject_growth_or_lost_responsiveness[descriptors] tests_stress/test_process_resource_soak.py::test_resource_tripwires_reject_growth_or_lost_responsiveness[executor_pending] tests_stress/test_process_resource_soak.py::test_resource_tripwires_reject_growth_or_lost_responsiveness[loop_lag] tests_stress/test_process_resource_soak.py::test_resource_tripwires_reject_growth_or_lost_responsiveness[management] tests_stress/test_process_resource_soak.py::test_resource_tripwires_reject_growth_or_lost_responsiveness[rss_bytes] tests_stress/test_process_resource_soak.py::test_resource_tripwires_reject_growth_or_lost_responsiveness[storage_bytes] tests_stress/test_conversation_id_collision.py tests_stress/test_evidence_manifest.py tests_stress/test_frontend_route_inventory.py tests_stress/test_frontend_interaction_inventory.py tests_stress/test_management_action_inventory.py tests_stress/test_public_service_inventory.py tests_stress/test_backup_inventory.py tests_stress/test_nightly_inventory.py tests_real_ha/test_runtime_recovery_journey.py) ;;
            lifecycle) TEST_PATHS=(tests/test_agent_maintenance.py tests_real_ha/test_inflight_subentry_removal.py tests_real_ha/test_shared_conversation_and_entry_removal.py tests_real_ha/test_agent_private_data_deletion.py tests_real_ha/test_live_configuration_save.py tests_stress/test_lifecycle_matrix.py tests_stress/test_process_harness_contract.py tests_stress/test_installed_lifecycle.py tests_stress/test_active_unload_races.py tests_stress/test_active_removal_races.py tests_stress/test_management_replay_safety.py tests_stress/test_complete_user_journeys.py tests_real_ha/test_multi_entry_lifecycle.py tests_real_ha/test_config_flow_lifecycle_contracts.py tests_real_ha/test_partial_platform_setup_retry.py) ;;
            ai-task) TEST_PATHS=(tests_stress/test_ai_task_continuity.py tests_stress/test_ai_task_mixed_campaign.py tests_real_ha/test_ai_task_runtime.py tests_real_ha/test_ai_task_lifecycle.py tests_real_ha/test_ai_task_provider_wire.py) ;;
            voice-intercom) TEST_PATHS=(tests_real_ha/test_assist_origin_context.py tests_stress/test_voice_household_campaign.py tests_stress/test_native_audio_delivery.py tests_stress/test_downstream_delivery_ownership.py tests_stress/test_intercom_endurance_campaign.py tests_real_ha/test_assist_voice_identity_precedence.py tests_real_ha/test_intercom_voice_acceptance.py) ;;
            archive) TEST_PATHS=(tests_stress/test_archive_living_campaign.py tests/test_conversation_archive.py) ;;
            feature-crossroads) TEST_PATHS=(tests_real_ha/test_usage_period_statistics.py tests_stress/test_skill_download_cancellation.py tests_stress/test_skill_lifecycle_campaign.py tests_stress/test_local_intent_mixed_campaign.py tests_stress/test_streaming_speech_endurance.py tests_stress/test_usage_retention_endurance.py tests_stress/test_model_catalog_refresh_endurance.py tests_stress/test_exposure_churn_endurance.py tests_stress/test_generated_valid_transitions.py tests_stress/test_valid_configuration_transitions.py tests_stress/test_evidence_manifest.py tests_real_ha/test_local_intent_exclusions.py tests_real_ha/test_assist_streaming_speech_processing.py tests_real_ha/test_populated_feature_assist_journey.py tests_real_ha/test_usage_accounting_failure_recovery.py tests_real_ha/test_model_catalog_live_refresh.py tests_real_ha/test_entity_attribute_runtime_integrity.py tests_real_ha/test_entity_registry_customization.py tests/test_skill_availability.py tests/test_skill_filesystem_concurrency.py tests/test_usage_accounting_recovery.py tests/test_model_catalog_transitions.py) ;;
            setup) TEST_PATHS=(tests_stress/test_provider_endpoint_selection.py tests_stress/test_backup_inventory.py tests_stress/test_reauth_active_traffic.py tests_real_ha/test_config_flow.py tests_real_ha/test_config_flow_edges.py tests_real_ha/test_config_flow_lifecycle_contracts.py tests_real_ha/test_packaged_release.py) ;;
            backup) TEST_PATHS=(tests_stress/test_restore_recovery_safety.py tests_stress/test_restore_recovery_process.py tests_stress/test_restore_background_ownership.py::test_installed_retention_waits_for_restored_policy tests_stress/test_backup_fault_matrix.py tests_stress/test_backup_live_overlap.py tests_stress/test_backup_inventory.py tests_stress/test_historical_backup.py) ;;
            backup-transfer) TEST_PATHS=(tests_stress/test_filesystem_process_recovery.py::test_booted_filesystem_recovers_after_hard_kill[transfer] tests_stress/test_restore_background_ownership.py::test_websocket_setup_export_is_coherent_across_restore tests_stress/test_backup_transfer.py tests_stress/test_backup_transfer_preview_races.py) ;;
            persistence) TEST_PATHS=(tests_stress/test_restore_recovery_safety.py tests_stress/test_restore_recovery_process.py tests_stress/test_pending_retrieval_publication.py tests_stress/test_archive_living_campaign.py::test_archive_first_intent_failure_cannot_be_erased_by_session_publication tests_stress/test_persistence_forward_and_clock.py tests_stress/test_management_transaction_matrix.py tests_stress/test_published_downgrade_boundary.py tests_stress/test_backup_fault_matrix.py tests_stress/test_store_structure_recovery.py tests_stress/test_os_storage_faults.py tests_stress/test_acknowledgement_loss.py tests_real_ha/test_corrupt_subsystem_store_startup_isolation.py tests_real_ha/test_pending_store_write_shutdown_recovery.py tests_real_ha/test_persistent_memory_shutdown_recovery.py tests_real_ha/test_store_write_process_crash.py tests_real_ha/test_delayed_tool_process_restart.py tests_real_ha/test_release_upgrade_acceptance.py) ;;
