          python ci/enhanced_evidence.py sanitize-dir stress-artifacts
          python ci/enhanced_evidence.py sanitize-browser test-results
          python ci/enhanced_evidence.py sanitize-browser playwright-report
          python ci/enhanced_summary.py stress-artifacts
      - name: Upload engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-browser-${{ matrix.engine }}-${{ matrix.intensity }}-seed-${{ needs.prepare.outputs.seed }}
          path: stress-artifacts/
          if-no-files-found: warn
