        run: |
          bash ci/reconcile_stable_environment.sh
          if [[ "$HA_POINT" == oldest ]]; then
            MINIMUM="$(python -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')"
            # The slim stable runtime has no compiler; the older Core's pinned
            # native dependencies may need wheels built for the current Python.
            apt-get update
            apt-get install -y --no-install-recommends build-essential
            # The newest fixture plugin calls Core APIs added after this floor.
            # 0.13.317 is the earliest published plugin for the 2026.3 series.
            python -m pip install 'pytest-homeassistant-custom-component==0.13.317'
            # The plugin was published for 2026.3.1; restore EOAI's exact beta
            # floor after its test-only dependencies have been resolved.
            python -m pip install --pre "homeassistant==$MINIMUM"
            test "$(python -c 'from importlib.metadata import version; print(version("homeassistant"))')" = "$MINIMUM"
          elif [[ "$HA_POINT" == stable ]]; then
            test "$(python -c 'from importlib.metadata import version; print(version("homeassistant"))')" = "$EOAI_EXPECTED_HA_VERSION"
          fi
          python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          if [[ "$HA_POINT" == stable ]]; then python -m pip check; fi
          python ci/environment_fingerprint.py \
            --requirements requirements_test.txt \
            --manifest custom_components/extended_openai_conversation_responses/manifest.json \
            --recipe ci/Dockerfile.stable \
            --recipe ci/install_ha_dependencies.py \
            --recipe ci/install_ha_media_dependencies.py \
            --recipe ci/environment_fingerprint.py \
            --recipe ci/reconcile_stable_environment.sh \
            --python-version "$(python -c 'import platform; print(platform.python_version())')" \
            --base-image python:3.14-slim-bookworm \
            --extra "ha_version=$(python -c 'from importlib.metadata import version; print(version("homeassistant"))')" \
            --extra "ha_test_plugin_version=$(python -c 'from importlib.metadata import version; print(version("pytest-homeassistant-custom-component"))')" \
            --write /opt/eoai-ci/environment.identity.json \
            > /dev/null
          cat requirements_test.txt custom_components/extended_openai_conversation_responses/manifest.json \
            | sha256sum | awk '{print $1}' > /opt/eoai-ci/environment.sha256
          python -c 'from importlib.metadata import version; print("homeassistant=" + version("homeassistant"))'
      - name: Run the same genuine HA lifecycle contract
        env:
          PYTHONPATH: ${{ github.workspace }}
          STRESS_SEED: ${{ needs.prepare.outputs.seed }}
          STRESS_ARTIFACT_DIR: stress-artifacts
        run: bash ci/run_ha_lifecycle_contract.sh
      - name: Summarize lifecycle contract
        if: always()
        env:
          ENHANCED_JOB_STATUS: ${{ job.status }}
        run: |
          python ci/enhanced_evidence.py sanitize-dir stress-artifacts
          python ci/enhanced_summary.py stress-artifacts
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-lifecycle-${{ matrix.ha-version }}-seed-${{ needs.prepare.outputs.seed }}
          path: stress-artifacts/
          if-no-files-found: warn
          retention-days: 14

  ha-lifecycle-dev:
    outputs:
      ha_core_sha: ${{ steps.python.outputs.sha }}
    name: HA dev / shared lifecycle contract
    needs: prepare
    if: github.event_name == 'schedule' || inputs.campaign == 'all' || inputs.campaign == 'lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: ${{ github.workspace }}
      STRESS_CAMPAIGN: lifecycle-matrix
      STRESS_INTENSITY: normal
      STRESS_SEED: ${{ needs.prepare.outputs.seed }}
      STRESS_ARTIFACT_DIR: stress-artifacts
      ENHANCED_EXECUTION_EVIDENCE: "1"
      PYTEST_PLUGINS: ci.pytest_execution
      HA_POINT: dev
    steps:
      - name: Checkout immutable run candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
      - name: Resolve exact HA dev commit and Python version
        id: python
        run: |
          SHA="$(git ls-remote https://github.com/home-assistant/core.git refs/heads/dev | awk '{print $1}')"
          test -n "$SHA"
          VERSION="$(curl -fsSL "https://raw.githubusercontent.com/home-assistant/core/$SHA/.python-version" | tr -d '\n')"
          test -n "$VERSION"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up the resolved Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.python.outputs.version }}
          allow-prereleases: true
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select only an exact immutable HA dev image
        id: dev-image
        env:
          EXPECTED_HA_CORE_SHA: ${{ steps.python.outputs.sha }}
          EXPECTED_PYTHON_VERSION: ${{ steps.python.outputs.version }}
        run: bash ci/select_ha_dev_image.sh "ghcr.io/${{ github.repository_owner }}/extended-openai-ci-dev:ha-dev-${{ steps.python.outputs.sha }}"
      - name: Construct the exact HA dev runtime when no matching image exists
        if: steps.dev-image.outputs.match != 'true'
        env:
          HA_DEV_SHA: ${{ steps.python.outputs.sha }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          python -m pip install "git+https://github.com/home-assistant/core.git@$HA_DEV_SHA"
          python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          python ci/check_ha_dev_environment.py
          python -c 'from importlib.metadata import version; print("homeassistant=" + version("homeassistant"))'
      - name: Run lifecycle contract in the matching prebuilt runtime
        if: steps.dev-image.outputs.match == 'true'
        env:
          EXPECTED_HA_CORE_SHA: ${{ steps.python.outputs.sha }}
          EXPECTED_PYTHON_VERSION: ${{ steps.python.outputs.version }}
        run: |
          mkdir -p stress-artifacts
          docker run --rm --network host --ipc=host \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e EXPECTED_HA_CORE_SHA -e EXPECTED_PYTHON_VERSION \
            -e PYTHONPATH=/workspace -e STRESS_SEED -e STRESS_INTENSITY -e STRESS_CAMPAIGN \
            -e STRESS_ARTIFACT_DIR -e ENHANCED_EXECUTION_EVIDENCE -e PYTEST_PLUGINS -e HA_POINT \
            -e EOAI_CONTAINER_IMAGE="ghcr.io/${{ github.repository_owner }}/extended-openai-ci-dev:ha-dev-${{ steps.python.outputs.sha }}" \
            "ghcr.io/${{ github.repository_owner }}/extended-openai-ci-dev:ha-dev-${{ steps.python.outputs.sha }}" \
            bash ci/run_ha_lifecycle_contract.sh
      - name: Run lifecycle contract in the constructed exact runtime
        if: steps.dev-image.outputs.match != 'true'
        run: bash ci/run_ha_lifecycle_contract.sh
      - name: Return dev test evidence ownership to the runner
        if: always() && steps.dev-image.outputs.match == 'true'
        run: sudo chown -R "$(id -u):$(id -g)" stress-artifacts
      - name: Summarize lifecycle contract
        if: always()
        env:
          ENHANCED_JOB_STATUS: ${{ job.status }}
        run: |
          python ci/enhanced_evidence.py sanitize-dir stress-artifacts
          if [ "${{ steps.dev-image.outputs.match }}" = "true" ]; then
            docker run --rm \
              -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
              -e ENHANCED_JOB_STATUS -e STRESS_SEED -e STRESS_INTENSITY \
              -e STRESS_CAMPAIGN -e HA_POINT \
              -e EOAI_CONTAINER_IMAGE="ghcr.io/${{ github.repository_owner }}/extended-openai-ci-dev:ha-dev-${{ steps.python.outputs.sha }}" \
              "ghcr.io/${{ github.repository_owner }}/extended-openai-ci-dev:ha-dev-${{ steps.python.outputs.sha }}" \
              python ci/enhanced_summary.py stress-artifacts | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python ci/enhanced_summary.py stress-artifacts
          fi
      - name: Return dev container evidence ownership to the runner
        if: always() && steps.dev-image.outputs.match == 'true'
        run: sudo chown -R "$(id -u):$(id -g)" stress-artifacts
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-lifecycle-dev-seed-${{ needs.prepare.outputs.seed }}
          path: stress-artifacts/
          if-no-files-found: warn
          retention-days: 14

  certify:
    name: Consolidated nightly certification
    needs: [prepare, python-campaigns, browser, browser-engines, ha-lifecycle-matrix, ha-lifecycle-dev]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact run source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.candidate_sha }}
      - name: Download campaign evidence
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: enhanced-evidence
      - name: Download controlled browser failure artifacts
        if: inputs.campaign == 'diagnostics'
        uses: actions/download-artifact@v4
        with:
          pattern: diagnostics-browser-*
          path: browser-failure-evidence
      - name: Verify uploaded failure artifacts and private canaries
        if: inputs.campaign == 'diagnostics'
        run: |
          python ci/verify_enhanced_failure.py \
            enhanced-evidence/evidence-diagnostics-${{ inputs.intensity }}-seed-${{ needs.prepare.outputs.seed }} \
            enhanced-evidence/evidence-diagnostics-${{ inputs.intensity }}-seed-${{ needs.prepare.outputs.seed }}/pytest.log
          python ci/verify_browser_failure.py browser-failure-evidence "${{ needs.prepare.outputs.seed }}"
      - name: Consolidate actual job results
        env:
          GH_TOKEN: ${{ github.token }}
          ENHANCED_CANDIDATE_SHA: ${{ needs.prepare.outputs.candidate_sha }}
          ENHANCED_EXPECTED_STABLE_HA_VERSION: ${{ needs.prepare.outputs.ha_version }}
          ENHANCED_EXPECTED_HA_TEST_PLUGIN_VERSION: ${{ needs.prepare.outputs.ha_test_plugin_version }}
          ENHANCED_EXPECTED_HA_DEV_SHA: ${{ needs.ha-lifecycle-dev.outputs.ha_core_sha }}
          ENHANCED_CAMPAIGNS: ${{ needs.prepare.outputs.campaigns }}
          ENHANCED_INTENSITIES: ${{ needs.prepare.outputs.intensities }}
          ENHANCED_SELECTED: ${{ inputs.campaign || 'all' }}
          ENHANCED_NEEDS: ${{ toJSON(needs) }}
          STRESS_SEED: ${{ needs.prepare.outputs.seed }}
        run: python ci/enhanced_certification.py enhanced-evidence
      - name: Upload certification index
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certification-index-${{ needs.prepare.outputs.seed }}
          path: certification-final.json
          if-no-files-found: warn
          retention-days: 14
