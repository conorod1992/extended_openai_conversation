      - name: Upload engine failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-browser-${{ matrix.engine }}-${{ matrix.intensity }}-seed-${{ needs.prepare.outputs.seed }}
