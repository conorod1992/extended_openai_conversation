name: PR221 Ruff format fix

on:
  push:
    branches:
      - feature/correctable-function-tool-recovery

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/correctable-function-tool-recovery
          fetch-depth: 0

      - name: Apply Ruff formatter
        shell: bash
        run: |
          python -m pip install ruff==0.16.6
          ruff format custom_components/extended_openai_conversation_responses/entity.py
          rm .github/workflows/pr221-ruff-format-fix.yml

      - name: Commit formatter fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format recovery context block"
          git push origin HEAD:feature/correctable-function-tool-recovery
