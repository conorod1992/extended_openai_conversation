name: Quiet Hours coverage

on:
  push:
    branches:
      - feature/quiet-hours-v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Ruff
        run: |
          python -m ruff format --check custom_components/extended_openai_conversation_responses/quiet_hours.py custom_components/extended_openai_conversation_responses/quiet_hours_runtime.py tests/test_quiet_hours.py tests/test_quiet_hours_runtime_coverage.py
          python -m ruff check custom_components/extended_openai_conversation_responses/quiet_hours.py custom_components/extended_openai_conversation_responses/quiet_hours_runtime.py tests/test_quiet_hours.py tests/test_quiet_hours_runtime_coverage.py
      - name: Quiet Hours tests and coverage
        run: >-
          python -m pytest
          tests/test_quiet_hours.py
          tests/test_quiet_hours_runtime_coverage.py
          --cov=custom_components.extended_openai_conversation_responses.quiet_hours
          --cov=custom_components.extended_openai_conversation_responses.quiet_hours_runtime
          --cov-branch
          --cov-report=term-missing
      - name: Frontend tests
        run: |
          node --check custom_components/extended_openai_conversation_responses/frontend/quiet-hours-ui.js
          node --test tests/test_quiet_hours_frontend.mjs
