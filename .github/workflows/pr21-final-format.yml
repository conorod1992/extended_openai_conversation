name: PR21 final format

on:
  push:
    branches:
      - fix/pr21-provider-failure-diagnostics

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr21-provider-failure-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Format exact compatibility file and commit
        shell: bash
        run: |
          pip install ruff==0.16.6
          ruff format custom_components/extended_openai_conversation_responses/runtime_failure_hardening.py
          ruff check custom_components/extended_openai_conversation_responses/runtime_failure_hardening.py
          ruff format --check custom_components/extended_openai_conversation_responses/runtime_failure_hardening.py
          rm .github/workflows/pr21-final-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format runtime reauth compatibility fix"
          git push origin HEAD:fix/pr21-provider-failure-diagnostics
