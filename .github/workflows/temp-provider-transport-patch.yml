name: Temporary provider transport patch

on:
  push:
    branches:
      - fix/provider-transport-classification

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/provider-transport-classification

      - name: Apply bounded provider transport changes
        shell: python
        run: |
          from pathlib import Path

          provider = Path("custom_components/extended_openai_conversation_responses/provider_errors.py")
          text = provider.read_text()
          marker = "class ProviderStreamError(OpenAIError):\n"
          addition = (
              "class ProviderTransportError(OpenAIError):\n"
              "    \"\"\"Standard-library transport failure normalized into the provider path.\"\"\"\n"
              "\n"
              "\n"
              "def provider_transport_error(\n"
              "    error: TimeoutError | ConnectionError,\n"
              ") -> ProviderTransportError:\n"
              "    \"\"\"Normalize a raw timeout/connection failure without exposing its details.\"\"\"\n"
              "    if isinstance(error, TimeoutError):\n"
              "        return ProviderTransportError(\"Provider request timed out\")\n"
              "    return ProviderTransportError(\"Could not connect to provider\")\n"
              "\n"
              "\n"
              "class ProviderStreamError(OpenAIError):\n"
          )
          if marker not in text:
              raise SystemExit("provider class marker not found")
          text = text.replace(marker, addition, 1)
          old = '    if isinstance(error, APIConnectionError):\n        return "cannot_connect"\n'
          new = '    if isinstance(error, (APIConnectionError, ProviderTransportError)):\n        return "cannot_connect"\n'
          if old not in text:
              raise SystemExit("provider classifier marker not found")
          provider.write_text(text.replace(old, new, 1))

          helpers = Path("custom_components/extended_openai_conversation_responses/helpers.py")
          text = helpers.read_text()
          marker = "from .ha_permissions import filter_entities_for_active_user\n"
          replacement = marker + "from .provider_errors import provider_transport_error\n"
          if marker not in text:
              raise SystemExit("helpers import marker not found")
          text = text.replace(marker, replacement, 1)
          old = (
              "    response = await hass.async_add_executor_job(\n"
              "        partial(client.models.list, timeout=10)\n"
              "    )\n"
              "\n"
              "    async for _ in response:\n"
              "        break\n"
              "    return client\n"
          )
          new = (
              "    try:\n"
              "        response = await hass.async_add_executor_job(\n"
              "            partial(client.models.list, timeout=10)\n"
              "        )\n"
              "\n"
              "        async for _ in response:\n"
              "            break\n"
              "    except (TimeoutError, ConnectionError) as err:\n"
              "        raise provider_transport_error(err) from err\n"
              "    return client\n"
          )
          if old not in text:
              raise SystemExit("helpers validation marker not found")
          helpers.write_text(text.replace(old, new, 1))

          entity = Path("custom_components/extended_openai_conversation_responses/entity.py")
          text = entity.read_text()
          old = "from .provider_errors import provider_stream_error\n"
          new = "from .provider_errors import provider_stream_error, provider_transport_error\n"
          if old not in text:
              raise SystemExit("entity import marker not found")
          text = text.replace(old, new, 1)
          old = "                raise\n            else:\n"
          new = (
              "                if isinstance(err, (TimeoutError, ConnectionError)):\n"
              "                    raise provider_transport_error(err) from err\n"
              "                raise\n"
              "            else:\n"
          )
          if old not in text:
              raise SystemExit("entity exception marker not found")
          entity.write_text(text.replace(old, new, 1))

      - name: Format and commit production changes
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          ruff format custom_components/extended_openai_conversation_responses/provider_errors.py custom_components/extended_openai_conversation_responses/helpers.py custom_components/extended_openai_conversation_responses/entity.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/provider_errors.py custom_components/extended_openai_conversation_responses/helpers.py custom_components/extended_openai_conversation_responses/entity.py
          git commit -m "Normalize standard provider transport failures"
          git push origin HEAD:fix/provider-transport-classification
