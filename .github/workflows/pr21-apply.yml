name: PR21 apply

on:
  push:
    branches:
      - fix/pr21-provider-failure-diagnostics

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr21-provider-failure-diagnostics
          fetch-depth: 0
      - name: Apply focused PR21 changes
        run: python scripts/pr21_apply.py
      - name: Verify and commit
        shell: bash
        run: |
          python -m compileall -q custom_components/extended_openai_conversation_responses tests
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Handle provider failures and diagnostics consistently"
          git push origin HEAD:fix/pr21-provider-failure-diagnostics
