name: Temporary PR 748 frontend rebuild

on:
  push:
    branches:
      - cleanup/request-rules-event-ownership

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cleanup/request-rules-event-ownership

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Commit rebuilt bundle
        run: |
          if git diff --quiet -- custom_components/extended_openai_conversation_responses/frontend/dist/; then
            echo "No bundle changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/frontend/dist/
          git commit -m "Rebuild frontend bundle"
          git push origin HEAD:cleanup/request-rules-event-ownership
