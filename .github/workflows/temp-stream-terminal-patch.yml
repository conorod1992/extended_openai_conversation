name: Temporary stream terminal patch

on:
  push:
    branches:
      - fix/stream-terminal-correctness

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/stream-terminal-correctness

      - name: Apply Chat stream terminal validation
        shell: python
        run: |
          from pathlib import Path

          path = Path("custom_components/extended_openai_conversation_responses/entity.py")
          text = path.read_text()

          marker = "        refusal_seen = False\n\n        async for chunk in result:\n"
          replacement = (
              "        refusal_seen = False\n"
              "        terminal_finish_seen = False\n\n"
              "        async for chunk in result:\n"
          )
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif "        terminal_finish_seen = False\n" not in text:
              raise SystemExit("chat terminal state marker not found")

          marker = "            choice = chunk.choices[0]\n            delta = choice.delta\n"
          replacement = (
              "            choice = chunk.choices[0]\n"
              "            delta = choice.delta\n"
              "            finish_reason = choice.finish_reason\n"
          )
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif "            finish_reason = choice.finish_reason\n" not in text:
              raise SystemExit("chat finish reason marker not found")

          text = text.replace(
              '            if current_tool_calls and (choice.finish_reason in {"tool_calls", "stop"}):\n',
              '            if current_tool_calls and (finish_reason in {"tool_calls", "stop"}):\n',
              1,
          )
          text = text.replace(
              '            if choice.finish_reason == "length":\n',
              '            if finish_reason in {"stop", "tool_calls", "function_call"}:\n'
              '                terminal_finish_seen = True\n'
              '            if finish_reason == "length":\n',
              1,
          )
          text = text.replace(
              '            if choice.finish_reason == "content_filter" and not refusal_seen:\n'
              '                raise HomeAssistantError(\n'
              '                    "OpenAI response was blocked by the provider content filter"\n'
              '                )\n',
              '            if finish_reason == "content_filter":\n'
              '                if not refusal_seen:\n'
              '                    raise HomeAssistantError(\n'
              '                        "OpenAI response was blocked by the provider content filter"\n'
              '                    )\n'
              '                terminal_finish_seen = True\n',
              1,
          )

          marker = (
              "            # Keep consuming after the stop chunk so providers that honor\n"
              "            # stream_options.include_usage can deliver their final usage-only chunk.\n\n"
              "    async def _transform_responses_stream(\n"
          )
          replacement = (
              "            # Keep consuming after the stop chunk so providers that honor\n"
              "            # stream_options.include_usage can deliver their final usage-only chunk.\n\n"
              "        if not terminal_finish_seen:\n"
              "            raise HomeAssistantError(\n"
              "                \"OpenAI Chat Completions stream ended before a terminal finish reason\"\n"
              "            )\n\n"
              "    async def _transform_responses_stream(\n"
          )
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif "OpenAI Chat Completions stream ended before a terminal finish reason" not in text:
              raise SystemExit("chat stream end marker not found")

          path.write_text(text)

      - name: Format and commit production change
        run: |
          pip install ruff
          ruff format custom_components/extended_openai_conversation_responses/entity.py
          if git diff --quiet -- custom_components/extended_openai_conversation_responses/entity.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/entity.py
          git commit -m "Require terminal Chat stream finish state"
          git push origin HEAD:fix/stream-terminal-correctness
