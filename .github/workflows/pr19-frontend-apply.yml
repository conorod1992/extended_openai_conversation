name: Apply PR19 frontend patch

on:
  push:
    branches:
      - fix/pr19-management-state-integrity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pr19-management-state-integrity
      - name: Apply patch
        run: python .github/pr19_frontend_patch.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Protect stale management frontend state"
          git push
