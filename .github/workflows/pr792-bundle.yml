name: Temp PR792 Bundle Rebuild

on:
  push:
    branches:
      - perf/request-rules-fast-path

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: perf/request-rules-fast-path
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - working-directory: frontend
        run: npm run build
      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/frontend/dist/
          if git diff --cached --quiet; then
            echo "Bundle already current"
            exit 0
          fi
          git commit -m "Rebuild frontend bundle"
          git push origin HEAD:perf/request-rules-fast-path
