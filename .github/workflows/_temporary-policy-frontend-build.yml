name: Temporary policy frontend build

on:
  push:
    branches:
      - frontend/policy-v1-alignment

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: frontend/policy-v1-alignment
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Rebuild tracked frontend
        working-directory: frontend
        run: npm run build
      - name: Commit generated frontend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             custom_components/extended_openai_conversation_responses/frontend/dist             custom_components/extended_openai_conversation_responses/frontend/management-config-owners.js             custom_components/extended_openai_conversation_responses/frontend/agent-config-sections-*.js
          if git diff --cached --quiet; then
            echo "No generated frontend changes."
            exit 0
          fi
          git commit -m "build: refresh frontend bundle"
          git push origin HEAD:frontend/policy-v1-alignment
