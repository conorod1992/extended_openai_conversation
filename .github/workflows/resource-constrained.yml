name: EOAI constrained resource acceptance

on:
  workflow_call:
  schedule:
    - cron: "37 5 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constrained:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          VERSION="$(curl -fsSL https://pypi.org/pypi/homeassistant/json | python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')"
          PLUGIN_VERSION="$(python ci/resolve_ha_test_plugin.py "$VERSION")"
          pip install -r requirements_test.txt
          python ci/install_ha_test_plugin.py "$VERSION" "$PLUGIN_VERSION"
          echo "EOAI_EXPECTED_HA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "EOAI_EXPECTED_HA_TEST_PLUGIN_VERSION=$PLUGIN_VERSION" >> "$GITHUB_ENV"
          python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          python -m pip check
      - name: Run mixed workload on one CPU with bounded address space
        env:
          STRESS_SEED: "424242"
          STRESS_INTENSITY: "normal"
        run: |
          set -euo pipefail
          ulimit -v 1572864
          CPU="$(python -c 'import os; print(min(os.sched_getaffinity(0)))')"
          taskset -c "$CPU" pytest \
            tests_stress/test_large_installation.py::test_large_installation_survives_setup_management_backup_and_assist \
            tests_stress/test_responses_scale_fairness.py::test_mixed_background_pressure_preserves_lightweight_progress \
            tests_stress/test_responses_scale_fairness.py::test_active_native_contention_preserves_assist_management_and_ha_progress \
            -v -s --asyncio-mode=auto --timeout=300 --tb=short
