name: Lazy ownership workbench
on:
  push:
    branches: [refactor/frontend-lazy-feature-ownership]
    paths: [.github/workflows/lazy-ownership-workbench.yml, .github/lazy-ownership-edit.py]
permissions:
  contents: write
concurrency:
  group: lazy-ownership-workbench
  cancel-in-progress: false
jobs:
  workbench:
    if: github.repository == 'conorod1992/extended_openai_conversation' && github.ref == 'refs/heads/refactor/frontend-lazy-feature-ownership'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Inspect lazy ownership references
        run: |
          git rev-parse HEAD
          rg -n 'installQuietHoursUI|installFunctionRepair|installUsageDiagnostics|installUsageInputFootprint|installManagementProviderCredentials|installManagementSection|installDebugPresentation|__managementPresentationInstalled' tests frontend/test tests_browser || true
      - name: Apply reviewed branch edits
        if: hashFiles('.github/lazy-ownership-edit.py') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/lazy-ownership-edit.py
          git push origin HEAD:refs/heads/refactor/frontend-lazy-feature-ownership
      - name: Check shipped module syntax and tests
        if: hashFiles('.github/lazy-ownership-edit.py') != ''
        run: |
          find custom_components/extended_openai_conversation_responses/frontend -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests -maxdepth 1 -type f -name '*.test.mjs' -print0 | sort -z | xargs -0 -n1 node
      - name: Prepare source snapshot
        if: always()
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=frontend/node_modules -czf /tmp/lazy-ownership-source.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: lazy-ownership-source
          path: /tmp/lazy-ownership-source.tar.gz
          retention-days: 1
