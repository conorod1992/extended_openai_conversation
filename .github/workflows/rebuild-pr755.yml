name: Temporary PR 755 frontend rebuild

on:
  push:
    branches:
      - perf/usage-ordered-paging
    paths:
      - ".github/workflows/rebuild-pr755.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/usage-ordered-paging

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Commit rebuilt bundle
        run: |
          git add custom_components/extended_openai_conversation_responses/frontend/dist/
          if git diff --cached --quiet; then
            echo "Bundle already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild frontend bundle"
          git push origin HEAD:perf/usage-ordered-paging
