name: Targeted mutation testing

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Mutation campaign
        required: true
        default: function-tools
        type: choice
        options:
          - function-tools
          - guest-security
          - ha-permissions
          - request-rules
          - function-groups
      target:
        description: Optional Mutmut target override
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}-${{ inputs.campaign }}
  cancel-in-progress: true

jobs:
  mutation:
    name: Mutation campaign (${{ inputs.campaign }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install Home Assistant and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant
          pip install -r requirements_test.txt
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          import homeassistant

          components = Path(next(iter(homeassistant.__path__))) / "components"
          requirements = set()
          for domain in (
              "openai_conversation",
              "conversation",
              "rest",
              "scrape",
              "camera",
              "stream",
          ):
              manifest = json.loads((components / domain / "manifest.json").read_text())
              requirements.update(manifest.get("requirements", []))
          if requirements:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", *sorted(requirements)]
              )
          PY
          pip install "mutmut==3.7.0"

      - name: Run baseline and targeted mutation campaign
        env:
          CAMPAIGN: ${{ inputs.campaign }}
          TARGET: ${{ inputs.target }}
        run: python scripts/run_mutation_campaign.py "$CAMPAIGN" --target "$TARGET"
