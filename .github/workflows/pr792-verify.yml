name: Temp PR792 Verify and Bundle

on:
  push:
    branches:
      - perf/request-rules-fast-path

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: perf/request-rules-fast-path
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check frontend modules
        run: |
          find custom_components/extended_openai_conversation_responses/frontend -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests -maxdepth 1 -type f -name '*.test.mjs' -print0 | sort -z | xargs -0 -n1 node
      - working-directory: frontend
        run: npm run check
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - name: Commit exact generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/frontend/dist/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rebuild frontend bundle"
          git push origin HEAD:perf/request-rules-fast-path
