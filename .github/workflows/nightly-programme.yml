name: Nightly programme certification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact candidate commit to certify
        type: string
        required: true
      ha_version:
        description: Resolved stable HA version for this programme
        type: string
        required: true

      full_architecture:
        description: Require both official Container architecture lanes
        type: boolean
        default: false
      validation_ref:
        description: Optional exact Full Validation cohort branch
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - name: Verify required nightly runs and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          FULL_ARCHITECTURE: ${{ inputs.full_architecture }}
          HA_VERSION: ${{ inputs.ha_version }}
          VALIDATION_REF: ${{ inputs.validation_ref }}
        run: |
          args=()
          if [[ "$FULL_ARCHITECTURE" == "true" ]]; then args+=(--full-architecture); fi
          if [[ -n "$VALIDATION_REF" ]]; then args+=(--validation-ref "$VALIDATION_REF"); fi
          python -m ci.nightly_programme --candidate "$CANDIDATE_SHA" --ha-version "$HA_VERSION" --output nightly-programme.json "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: nightly-programme-${{ inputs.candidate_sha }}
          path: nightly-programme.json
          if-no-files-found: error
