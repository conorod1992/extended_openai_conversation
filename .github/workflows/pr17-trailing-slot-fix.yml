name: PR17 trailing slot fix

on:
  push:
    branches:
      - fix/pr17-request-rule-determinism

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr17-request-rule-determinism
      - name: Patch Hassil trailing wildcard matching
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch target, found {count}")
              file.write_text(text.replace(old, new, 1))

          request_rules = "custom_components/extended_openai_conversation_responses/request_rules.py"
          hot_path = "custom_components/extended_openai_conversation_responses/hot_path_cleanup.py"

          replace(
              request_rules,
              '_REQUEST_RESET_SENTINEL = "__request_rule_reset__"\n',
              '_REQUEST_RESET_SENTINEL = "__request_rule_reset__"\n_SENTENCE_MATCH_BOUNDARY = "zxqrequestboundaryqzx"\n',
          )

          replace(
              request_rules,
              '''    slot_lists: dict[str, SlotList] = field(default_factory=dict)\n\n\n@dataclass(frozen=True, slots=True)\nclass RuleEvaluation:\n''',
              '''    slot_lists: dict[str, SlotList] = field(default_factory=dict)\n\n\ndef _match_compiled_sentence(\n    compiled: CompiledPhrase, text: str\n) -> dict[str, str] | None:\n    """Match one parsed Hassil sentence, including a trailing wildcard slot."""\n    if compiled.sentence is None:\n        return None\n    context = is_match(\n        f"{text} {_SENTENCE_MATCH_BOUNDARY}",\n        compiled.sentence,\n        slot_lists=compiled.slot_lists,\n        expansion_rules={},\n    )\n    if context is None:\n        return None\n    return {\n        entity.name: str(entity.value).strip()\n        for entity in context.entities\n    }\n\n\n@dataclass(frozen=True, slots=True)\nclass RuleEvaluation:\n''',
          )

          replace(
              request_rules,
              '''                if compiled.sentence is not None:\n                    context = is_match(\n                        text,\n                        compiled.sentence,\n                        slot_lists=compiled.slot_lists,\n                        expansion_rules={},\n                    )\n                    if context is None:\n                        continue\n                    slots = {\n                        entity.name: str(entity.value).strip()\n                        for entity in context.entities\n                    }\n''',
              '''                if compiled.sentence is not None:\n                    slots = _match_compiled_sentence(compiled, text)\n                    if slots is None:\n                        continue\n''',
          )

          replace(
              request_rules,
              '        sentence = parse_sentence(pattern)\n',
              '        sentence = parse_sentence(f"{pattern} {_SENTENCE_MATCH_BOUNDARY}")\n',
          )

          replace(
              hot_path,
              '''                if compiled.sentence is not None:\n                    context = rules.is_match(\n                        text,\n                        compiled.sentence,\n                        slot_lists=compiled.slot_lists,\n                        expansion_rules={},\n                    )\n                    if context is None:\n                        continue\n                    slots = {\n                        entity.name: str(entity.value).strip()\n                        for entity in context.entities\n                    }\n''',
              '''                if compiled.sentence is not None:\n                    slots = rules._match_compiled_sentence(compiled, text)\n                    if slots is None:\n                        continue\n''',
          )
          PY
      - name: Verify syntax
        run: |
          python -m compileall -q \
            custom_components/extended_openai_conversation_responses/request_rules.py \
            custom_components/extended_openai_conversation_responses/hot_path_cleanup.py
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr17-trailing-slot-fix.yml
          git add \
            custom_components/extended_openai_conversation_responses/request_rules.py \
            custom_components/extended_openai_conversation_responses/hot_path_cleanup.py
          git commit -m "Fix trailing Request Rule wildcard captures"
          git push
