name: Harden recovery regex boundary

on:
  push:
    branches:
      - feature/correctable-function-tool-recovery

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/correctable-function-tool-recovery
          fetch-depth: 0

      - name: Apply structural validation boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          exceptions = Path("custom_components/extended_openai_conversation_responses/exceptions.py")
          text = exceptions.read_text()
          anchor = "\n\nclass TokenLengthExceededError(HomeAssistantError):\n"
          addition = '''\n\nclass FunctionValidationInfrastructureError(HomeAssistantError):\n    \"\"\"When local Function Tool validation cannot complete safely.\"\"\"\n'''
          if "class FunctionValidationInfrastructureError" not in text:
              if anchor not in text:
                  raise SystemExit("exceptions anchor not found")
              text = text.replace(anchor, addition + anchor, 1)
              exceptions.write_text(text)

          execution = Path("custom_components/extended_openai_conversation_responses/function_execution.py")
          text = execution.read_text()
          import_anchor = "from homeassistant.exceptions import HomeAssistantError\n"
          import_line = "\nfrom .exceptions import FunctionValidationInfrastructureError\n"
          if import_line.strip() not in text:
              if import_anchor not in text:
                  raise SystemExit("function_execution import anchor not found")
              text = text.replace(import_anchor, import_anchor + import_line, 1)
          old = '''    matches = await async_search_configured_patterns(\n        hass, [(pattern, value, flags) for _, pattern, value, flags in checks]\n    )\n'''
          new = '''    try:\n        matches = await async_search_configured_patterns(\n            hass, [(pattern, value, flags) for _, pattern, value, flags in checks]\n        )\n    except HomeAssistantError as err:\n        raise FunctionValidationInfrastructureError(\n            \"Configured Function Tool pattern validation could not complete safely\"\n        ) from err\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit("function_execution validation anchor not found")
              text = text.replace(old, new, 1)
          execution.write_text(text)

          recovery = Path("custom_components/extended_openai_conversation_responses/function_tool_recovery.py")
          text = recovery.read_text()
          old_import = "from .exceptions import ParseArgumentsFailed\n"
          new_import = "from .exceptions import FunctionValidationInfrastructureError, ParseArgumentsFailed\n"
          if new_import not in text:
              if old_import not in text:
                  raise SystemExit("function_tool_recovery import anchor not found")
              text = text.replace(old_import, new_import, 1)
          signature = '''def correctable_validation_failure(error: BaseException) -> CorrectableToolFailure:\n    \"\"\"Build bounded model feedback from the dedicated pre-dispatch validator.\"\"\"\n'''
          guarded = signature + '''    if isinstance(error, FunctionValidationInfrastructureError):\n        raise error\n'''
          if guarded not in text:
              if signature not in text:
                  raise SystemExit("recovery validation anchor not found")
              text = text.replace(signature, guarded, 1)
          recovery.write_text(text)

          Path(".github/workflows/_harden_recovery_regex_boundary.yml").unlink()
          PY

      - name: Format and validate touched Python
        run: |
          python -m pip install ruff
          ruff format \
            custom_components/extended_openai_conversation_responses/exceptions.py \
            custom_components/extended_openai_conversation_responses/function_execution.py \
            custom_components/extended_openai_conversation_responses/function_tool_recovery.py
          ruff check \
            custom_components/extended_openai_conversation_responses/exceptions.py \
            custom_components/extended_openai_conversation_responses/function_execution.py \
            custom_components/extended_openai_conversation_responses/function_tool_recovery.py
          git diff --check

      - name: Commit hardened boundary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep regex infrastructure failures fail-fast"
          git push origin HEAD:feature/correctable-function-tool-recovery
