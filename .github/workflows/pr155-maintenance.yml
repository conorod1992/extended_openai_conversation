name: PR155 maintenance

on:
  push:
    branches:
      - fix/pr13-memory-retention-retrieval-integrity

permissions:
  contents: write

jobs:
  fix-pr155:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.5'

      - name: Apply narrow CI corrections
        shell: bash
        run: |
          python -m pip install ruff==0.16.6
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_memory.py")
          text = path.read_text()
          old = '''    entity._memory.async_search.assert_awaited_once_with(
              "user-1", "temperature units", limit=2
          )
          '''
          new = '''    entity._memory.async_search.assert_awaited_once_with(
              "user-1",
              "temperature units",
              None,
              2,
              query_embedding=None,
              hybrid=False,
          )
          '''
          if text.count(old) != 1:
              raise SystemExit("expected stale memory-search assertion exactly once")
          path.write_text(text.replace(old, new, 1))
          PY
          ruff format \
            custom_components/extended_openai_conversation_responses/memory.py \
            custom_components/extended_openai_conversation_responses/temporary_memory.py
          rm tests/test_000_pr155_export.py
          rm .github/workflows/pr155-maintenance.yml

      - name: Commit corrected PR head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/memory.py \
                  custom_components/extended_openai_conversation_responses/temporary_memory.py \
                  tests/test_memory.py \
                  tests/test_000_pr155_export.py \
                  .github/workflows/pr155-maintenance.yml
          git diff --cached --check
          git commit -m "Fix PR13 CI checks"
          git push origin HEAD:fix/pr13-memory-retention-retrieval-integrity
