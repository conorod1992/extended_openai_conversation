name: iOS Companion app acceptance

# Warm default-branch caches for immutable Full validation candidate branches.
on:
  workflow_dispatch:
    inputs:
      warm_only:
        description: Prepare native artifacts without issuing acceptance evidence
        type: boolean
        default: false
      require_native_artifact:
        description: Fail rather than compile when a reusable native artifact is unavailable
        type: boolean
        default: false
  push:
    branches: [develop]
    paths:
      - .github/workflows/ios-companion-app.yml
      - ci/patch_ios_companion_e2e.py
      - ci/prepare_ios_build_tools.sh
      - ci/ios_companion_build.py
      - ci/ios_companion_runtime.py
  schedule:
    - cron: "35 5 * * 1,4"
    - cron: "35 5 * * 0,2,3,5,6"

permissions:
  contents: read
  actions: write

# Queue before allocating a macOS runner. A completed artifact is visible before
# the next candidate starts, preventing duplicate cold builds across branches.
concurrency:
  group: ios-companion-native-xcode27
  cancel-in-progress: false
  queue: max

jobs:
  companion:
    name: iOS Companion app smoke
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      IOS_SOURCE_SHA: "0a3002690caf19ab6267d7573390798199172146"
      IOS_SOURCE_REPOSITORY: "https://github.com/home-assistant/iOS.git"
      E2E_HOME_ASSISTANT_URL: "http://localhost:8123"
      E2E_HOME_ASSISTANT_USERNAME: "eoai-companion"
      E2E_HOME_ASSISTANT_PASSWORD: "eoai-companion-password"
      FASTLANE_SKIP_UPDATE_CHECK: "true"
      FASTLANE_XCODE_LIST_TIMEOUT: "80"
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "80"
      IOS_WARM_ONLY: ${{ inputs.warm_only || github.event.schedule == '35 5 * * 0,2,3,5,6' }}
      IOS_REQUIRE_NATIVE_ARTIFACT: ${{ inputs.require_native_artifact || false }}

    steps:
      - name: Checkout exact EOAI candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Start fresh iOS simulator in background
        if: env.IOS_WARM_ONLY != 'true'
        run: python ci/ios_companion_runtime.py simulator-start

      - name: Resolve stable Home Assistant version
        id: ha-version
        if: env.IOS_WARM_ONLY != 'true'
        run: |
          VERSION="$(curl -fsSL https://pypi.org/pypi/homeassistant/json | python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "EOAI_EXPECTED_HA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore Python wheel cache
        id: ha-pip-cache
        if: env.IOS_WARM_ONLY != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/pip
          key: ios-ha-pip-v1-${{ runner.os }}-${{ runner.arch }}-py314-${{ steps.ha-version.outputs.version }}-${{ hashFiles('custom_components/extended_openai_conversation_responses/manifest.json', 'ci/install_ha_dependencies.py') }}
          restore-keys: |
            ios-ha-pip-v1-${{ runner.os }}-${{ runner.arch }}-py314-${{ steps.ha-version.outputs.version }}-

      - name: Install stable Home Assistant runtime
        id: ha-install
        if: env.IOS_WARM_ONLY != 'true'
        run: |
          set -euo pipefail
          python -m pip install "homeassistant==$EOAI_EXPECTED_HA_VERSION"
          python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          python -m pip check

      - name: Save Python wheel cache
        if: github.ref_name == github.event.repository.default_branch && steps.ha-install.outcome == 'success' && steps.ha-pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/pip
          key: ios-ha-pip-v1-${{ runner.os }}-${{ runner.arch }}-py314-${{ steps.ha-version.outputs.version }}-${{ hashFiles('custom_components/extended_openai_conversation_responses/manifest.json', 'ci/install_ha_dependencies.py') }}

      - name: Start disposable Home Assistant
        if: env.IOS_WARM_ONLY != 'true'
        run: |
          set -euo pipefail
          READY="$RUNNER_TEMP/companion-ready.json"
          python ci/companion_app_server.py \
            --classic-dashboard \
            --config "$RUNNER_TEMP/companion-ha" \
            --component custom_components/extended_openai_conversation_responses \
            --ready "$READY" \
            > "$RUNNER_TEMP/companion-ha.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/companion-ha.pid"

      - name: Clone pinned Home Assistant iOS source
        run: |
          set -euo pipefail
          IOS_DIR="$RUNNER_TEMP/home-assistant-ios"
          git init "$IOS_DIR"
          git -C "$IOS_DIR" remote add origin "$IOS_SOURCE_REPOSITORY"
          git -C "$IOS_DIR" fetch --depth 1 origin "$IOS_SOURCE_SHA"
          git -C "$IOS_DIR" checkout --detach "$IOS_SOURCE_SHA"
          test "$(git -C "$IOS_DIR" rev-parse HEAD)" = "$IOS_SOURCE_SHA"
          echo "IOS_DIR=$IOS_DIR" >> "$GITHUB_ENV"

      - name: Resolve exact native build cache identity
        run: |
          set -euo pipefail
          python ci/ios_companion_build.py identity "$IOS_DIR"

      # Artifacts can be reused across immutable validation branches, including
      # when no default-branch cache is warm yet. Acceptance is always rerun.
      - name: Restore exact compiled iOS test artifact
        id: ios-native
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/ios_companion_build.py restore "$IOS_DIR"

      - name: Restore iOS DerivedData cache
        id: ios-deriveddata-cache
        if: steps.ios-native.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.IOS_DIR }}/eoai-native/Build
            ${{ env.IOS_DIR }}/eoai-native/ModuleCache.noindex
          key: ios-e2e-deriveddata-v4-${{ runner.os }}-${{ env.IOS_INCREMENTAL_CACHE_ID }}
          restore-keys: |
            ios-e2e-deriveddata-v4-${{ runner.os }}-${{ env.IOS_CACHE_COMPATIBILITY }}-

      - name: Patch pinned iOS E2E journey for EOAI
        run: |
          set -euo pipefail
          python ci/patch_ios_companion_e2e.py "$IOS_DIR"
          grep -q "Companion app iOS saved title" "$IOS_DIR/Tests/UI/OnboardingE2ETests.swift"
          grep -q -- '-collect-test-diagnostics never' "$IOS_DIR/fastlane/lanes/testing.rb"

      - name: Restore iOS host build-tool cache
        id: ios-buildtools-cache
        if: steps.ios-native.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.IOS_DIR }}/BuildTools/.build
            ${{ env.IOS_DIR }}/.build
          key: ios-e2e-buildtools-v3-${{ runner.os }}-${{ env.IOS_TOOLS_CACHE_ID }}
          restore-keys: |
            ios-e2e-buildtools-v3-${{ runner.os }}-${{ env.IOS_CACHE_COMPATIBILITY }}-

      # Bundler's small, ABI-aware cache is managed by setup-ruby. Large native
      # and package caches below are written only by the default branch.
      - name: Set up Ruby 4.0.7 and cached gems
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "4.0.7"
          working-directory: ${{ env.IOS_DIR }}
          bundler-cache: true

      - name: Restore Swift package downloads
        id: ios-packages-cache
        if: steps.ios-native.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.IOS_DIR }}/eoai-source-packages
          key: ios-spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.IOS_PACKAGES_CACHE_ID }}
          restore-keys: |
            ios-spm-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Resolve pinned Swift packages
        id: ios-packages-resolve
        if: steps.ios-native.outputs.hit != 'true'
        working-directory: ${{ env.IOS_DIR }}
        run: |
          xcodebuild -resolvePackageDependencies \
            -project HomeAssistant.xcodeproj -scheme Tests-UI \
            -clonedSourcePackagesDirPath "$IOS_DIR/eoai-source-packages" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Save Swift package downloads
        if: github.ref_name == github.event.repository.default_branch && steps.ios-packages-resolve.outcome == 'success' && steps.ios-packages-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.IOS_DIR }}/eoai-source-packages
          key: ios-spm-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.IOS_PACKAGES_CACHE_ID }}

      - name: Prepare pinned iOS host build tools
        id: ios-buildtools-prepare
        if: steps.ios-native.outputs.hit != 'true'
        timeout-minutes: 20
        run: bash ci/prepare_ios_build_tools.sh "$IOS_DIR"

      - name: Save iOS host build-tool cache
        if: github.ref_name == github.event.repository.default_branch && steps.ios-buildtools-prepare.outcome == 'success' && steps.ios-buildtools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.IOS_DIR }}/BuildTools/.build
            ${{ env.IOS_DIR }}/.build
          key: ios-e2e-buildtools-v3-${{ runner.os }}-${{ env.IOS_TOOLS_CACHE_ID }}

      - name: Build pinned iOS app and test runner once
        id: ios-native-build
        if: steps.ios-native.outputs.hit != 'true'
        working-directory: ${{ env.IOS_DIR }}
        run: bundle exec fastlane eoai_build

      - name: Package compiled iOS test products
        if: steps.ios-native.outputs.hit != 'true'
        run: python ci/ios_companion_build.py package "$IOS_DIR"

      - name: Publish reusable compiled iOS test artifact
        if: steps.ios-native.outputs.hit != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-native-${{ env.IOS_BUILD_CACHE_ID }}
          path: ${{ env.IOS_DIR }}/native-products.tar
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Save iOS DerivedData cache
        if: github.ref_name == github.event.repository.default_branch && steps.ios-native-build.outcome == 'success' && steps.ios-deriveddata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.IOS_DIR }}/eoai-native/Build
            ${{ env.IOS_DIR }}/eoai-native/ModuleCache.noindex
          key: ios-e2e-deriveddata-v4-${{ runner.os }}-${{ env.IOS_INCREMENTAL_CACHE_ID }}

      - name: Validate native identity and report reuse
        env:
          NATIVE_REUSED: ${{ steps.ios-native.outputs.hit }}
        run: |
          python ci/ios_companion_build.py validate "$IOS_DIR"
          {
            echo "Native build identity: $IOS_BUILD_CACHE_ID"
            echo "Compiled artifact reused: $NATIVE_REUSED"
            echo "DerivedData exact hit: ${{ steps.ios-deriveddata-cache.outputs.cache-hit }}"
            echo "Swift package exact hit: ${{ steps.ios-packages-cache.outputs.cache-hit }}"
            du -sh "$IOS_DIR/eoai-native/Build/Products"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for fresh simulator and Home Assistant
        if: env.IOS_WARM_ONLY != 'true'
        run: python ci/ios_companion_runtime.py ready

      - name: Run genuine iOS Companion journey
        if: env.IOS_WARM_ONLY != 'true'
        working-directory: ${{ env.IOS_DIR }}
        # All paths and the destination are explicit for test-without-building.
        # Prevent Fastlane from resolving the package graph merely to name logs
        # or discover the deployment target of these already-built binaries.
        env:
          SCAN_DEVICE: iPhone 17
          SCAN_DEPLOYMENT_TARGET_VERSION: "16.4"
          SCAN_APP_NAME: HomeAssistant
          SCAN_DISALLOW_XCODEBUILD_SETTINGS_LOOKUP: "true"
        run: |
          set -euo pipefail
          bundle exec fastlane e2e \
            url:"$E2E_HOME_ASSISTANT_URL" \
            username:"$E2E_HOME_ASSISTANT_USERNAME" \
            password:"$E2E_HOME_ASSISTANT_PASSWORD"

      - name: Record source-bound iOS Companion evidence
        id: ios-evidence
        if: success() && env.IOS_WARM_ONLY != 'true'
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p ios-companion-evidence
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          ready = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "companion-ready.json").read_text()
          )
          stored = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "companion-ha/.storage/core.config_entries").read_text()
          )
          entry = next(
              item
              for item in stored["data"]["entries"]
              if item["entry_id"] == ready["entry_id"]
          )
          assert any(
              item["title"] == "Companion app iOS saved title"
              for item in entry["subentries"]
          ), entry

          Path("ios-companion-evidence/certification.json").write_text(
              json.dumps(
                  {
                      "candidate_sha": os.environ["CANDIDATE_SHA"],
                      "passed": True,
                      "platform": "ios-simulator",
                      "ios_source_sha": os.environ["IOS_SOURCE_SHA"],
                      "xcode": os.environ["DEVELOPER_DIR"],
                      "native_build_identity": os.environ["IOS_BUILD_CACHE_ID"],
                      "reused_native_artifact_id": os.environ.get("IOS_NATIVE_ARTIFACT_ID"),
                      "onboarding": True,
                      "management_edit_save": True,
                      "background_resume": True,
                      "native_companion_webview": True,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Export iOS screen recordings
        if: always() && env.IOS_WARM_ONLY != 'true'
        run: |
          set -euo pipefail
          XCRESULT="$IOS_DIR/fastlane/test_output/e2e/Tests-UI.xcresult"
          OUT="$RUNNER_TEMP/ios-companion-recording"
          mkdir -p "$OUT"
          if [[ -d "$XCRESULT" ]]; then
            xcrun xcresulttool export attachments --path "$XCRESULT" --output-path "$OUT" >/dev/null || true
          fi

      - name: Stop disposable Home Assistant
        if: always() && env.IOS_WARM_ONLY != 'true'
        run: |
          if [[ -f "$RUNNER_TEMP/companion-ha.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/companion-ha.pid")" 2>/dev/null || true
          fi

      - name: Upload iOS Companion evidence
        if: always() && steps.ios-evidence.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-companion-app-evidence
          path: ios-companion-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Upload iOS Companion diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-companion-app-diagnostics
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/companion-ha.log
            ${{ runner.temp }}/ios-simulator-boot.log
            ${{ runner.temp }}/ios-companion-recording/
            ${{ env.IOS_DIR }}/fastlane/test_output/e2e/
            ~/Library/Logs/scan/
          if-no-files-found: warn
          retention-days: 14

      # Housekeeping must never prevent the real journey or evidence upload.
      - name: Retain two reusable native build variants
        if: always() && steps.ios-native-build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/ios_companion_build.py prune "$IOS_DIR"

      - name: Report completed step timings
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/ios_companion_build.py report "${IOS_DIR:-$RUNNER_TEMP}"

      - name: Upload iOS timing measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-companion-timings
          path: ios-companion-timings.json
          if-no-files-found: warn
          retention-days: 14
