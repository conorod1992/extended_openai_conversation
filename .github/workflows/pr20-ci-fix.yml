name: PR20 CI fixture fix

on:
  push:
    branches:
      - fix/pr20-stream-terminal-refusal

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr20-stream-terminal-refusal
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Patch failing fixtures
        run: |
          python .github/pr20_ci_fix.py
          python -m pip install --quiet ruff
          ruff format tests/test_responses_api.py
          ruff check tests/test_responses_api.py
          python -m py_compile tests/test_responses_api.py
      - name: Commit fixture update and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/pr20_ci_fix.py .github/workflows/pr20-ci-fix.yml
          git add tests/test_responses_api.py
          git commit -m "Update Responses stream test terminals"
          git push origin HEAD:fix/pr20-stream-terminal-refusal
