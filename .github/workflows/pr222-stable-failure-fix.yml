name: PR222 stable failure fix

on:
  push:
    branches:
      - feature/unified-export-backup-import-restore

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-export-backup-import-restore
          fetch-depth: 0
      - name: Apply targeted stable-test fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path_name, replacements):
              path = Path(path_name)
              text = path.read_text()
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{path_name}: expected one match, found {count}: {old[:100]!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)

          patch(
              'custom_components/extended_openai_conversation_responses/transfer.py',
              [
                  (
                      '    return value in {REDACTED_SECRET_SENTINEL, _GENERIC_REDACTED_PLACEHOLDER}\n',
                      '    return (\n        value == REDACTED_SECRET_SENTINEL\n        or value == _GENERIC_REDACTED_PLACEHOLDER\n    )\n',
                  ),
              ],
          )

          patch(
              'custom_components/extended_openai_conversation_responses/backup_transfer.py',
              [
                  (
                      'async def _start_export(\n    hass: HomeAssistant, entry: Any, subentry: Any, data: dict[str, Any]\n) -> dict[str, Any]:\n    async with _start_lock(hass):\n',
                      'async def _start_export(\n    hass: HomeAssistant,\n    entry: Any,\n    subentry: Any,\n    data: dict[str, Any] | None = None,\n) -> dict[str, Any]:\n    data = data or {}\n    async with _start_lock(hass):\n',
                  ),
              ],
          )

          patch(
              'tests/test_transfer.py',
              [
                  (
                      'from dataclasses import dataclass\n' if False else 'from copy import deepcopy\n',
                      'from copy import deepcopy\nfrom dataclasses import replace\n',
                  ),
                  (
                      '    assert "memories" not in result["json"]\n    assert "archive" not in result["json"]\n',
                      '    assert set(document["sections"]) == transfer.SETUP_SECTIONS\n',
                  ),
                  (
                      '    assert REDACTED_SECRET_SENTINEL in serialized\n',
                      '    assert "__extended_openai_redacted_secret__" in serialized\n',
                  ),
                  (
                      '    imported_memory = deepcopy(current.memories)\n    imported_memory[0].content = "Imported memory"\n',
                      '    imported_memory = deepcopy(current.memories)\n    imported_memory[0] = replace(imported_memory[0], content="Imported memory")\n',
                  ),
              ],
          )

          Path('.github/workflows/pr222-stable-failure-fix.yml').unlink()
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Validate formatting
        shell: bash
        run: |
          pip install ruff==0.16.6
          ruff check --fix custom_components/extended_openai_conversation_responses/transfer.py custom_components/extended_openai_conversation_responses/backup_transfer.py tests/test_transfer.py
          ruff format custom_components/extended_openai_conversation_responses/transfer.py custom_components/extended_openai_conversation_responses/backup_transfer.py tests/test_transfer.py
          ruff check custom_components/extended_openai_conversation_responses/transfer.py custom_components/extended_openai_conversation_responses/backup_transfer.py tests/test_transfer.py
          ruff format --check custom_components/extended_openai_conversation_responses/transfer.py custom_components/extended_openai_conversation_responses/backup_transfer.py tests/test_transfer.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix transfer compatibility regressions"
          git push origin HEAD:feature/unified-export-backup-import-restore
