name: PR21 JSON cleanup

on:
  push:
    branches:
      - fix/pr21-provider-failure-diagnostics

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr21-provider-failure-diagnostics
          fetch-depth: 0
      - name: Restore formatting and add only PR21 messages
        shell: bash
        run: |
          git show origin/develop:custom_components/extended_openai_conversation_responses/strings.json > custom_components/extended_openai_conversation_responses/strings.json
          git show origin/develop:custom_components/extended_openai_conversation_responses/translations/en.json > custom_components/extended_openai_conversation_responses/translations/en.json
          python - <<'PY'
          from pathlib import Path

          additions = (
              ',\n      "provider_forbidden": "Provider rejected access for these credentials or account permissions.",'
              '\n      "provider_rate_limited": "Provider rate limit reached. Try again later.",'
              '\n      "provider_unavailable": "Provider is temporarily unavailable. Try again later.",'
              '\n      "provider_error": "Provider rejected the request. Check the provider settings and Home Assistant logs."'
          )
          p = Path("custom_components/extended_openai_conversation_responses/strings.json")
          text = p.read_text()
          needle = '      "unknown": "[%key:common::config_flow::error::unknown%]"'
          if needle not in text:
              raise SystemExit("strings error block not found")
          p.write_text(text.replace(needle, needle + additions, 1))

          additions = (
              ',\n            "provider_forbidden": "Provider rejected access for these credentials or account permissions.",'
              '\n            "provider_rate_limited": "Provider rate limit reached. Try again later.",'
              '\n            "provider_unavailable": "Provider is temporarily unavailable. Try again later.",'
              '\n            "provider_error": "Provider rejected the request. Check the provider settings and Home Assistant logs."'
          )
          p = Path("custom_components/extended_openai_conversation_responses/translations/en.json")
          text = p.read_text()
          needle = '            "unknown": "Unexpected error"'
          if needle not in text:
              raise SystemExit("translation error block not found")
          p.write_text(text.replace(needle, needle + additions, 1))
          PY
          rm .github/workflows/pr21-json-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Keep provider error translations focused"
          git push origin HEAD:fix/pr21-provider-failure-diagnostics
