name: PR17 CI fix

on:
  push:
    branches:
      - fix/pr17-request-rule-determinism

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr17-request-rule-determinism
      - name: Patch PR17 regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one patch target, found {count}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "custom_components/extended_openai_conversation_responses/hot_path_cleanup.py",
              '''                if compiled.sentence is not None:\n                    if compiled.slot_pattern is not None:\n                        slot_match = compiled.slot_pattern.fullmatch(text)\n                        if slot_match is None:\n                            continue\n                        slots = {\n                            name: value.strip()\n                            for name, value in slot_match.groupdict().items()\n                        }\n                    else:\n                        context = rules.is_match(\n                            text,\n                            compiled.sentence,\n                            slot_lists=compiled.slot_lists,\n                            expansion_rules={},\n                        )\n                        if context is None:\n                            continue\n                        slots = {\n                            entity.name: str(entity.value).strip()\n                            for entity in context.entities\n                        }\n''',
              '''                if compiled.sentence is not None:\n                    context = rules.is_match(\n                        text,\n                        compiled.sentence,\n                        slot_lists=compiled.slot_lists,\n                        expansion_rules={},\n                    )\n                    if context is None:\n                        continue\n                    slots = {\n                        entity.name: str(entity.value).strip()\n                        for entity in context.entities\n                    }\n''',
          )

          replace(
              "tests/test_request_rules.py",
              '    reset_rules = await manager(routing_rule(reset=True, match_type="equals"))\n',
              '    reset_rules = await manager(\n        routing_rule(scope="conversation", reset=True, match_type="equals")\n    )\n',
          )

          replace(
              "custom_components/extended_openai_conversation_responses/management_ui.py",
              '''            candidate = message.get("tool")\n            if not isinstance(candidate, dict):\n                raise HomeAssistantError("tool must be an object")\n            saved_tool = validate_function_tools([candidate])[0]\n''',
              '''            tool_candidate = message.get("tool")\n            if not isinstance(tool_candidate, dict):\n                raise HomeAssistantError("tool must be an object")\n            saved_tool = validate_function_tools([tool_candidate])[0]\n''',
          )

          replace(
              "custom_components/extended_openai_conversation_responses/management_ui.py",
              '''            candidate = message.get("group")\n            if not isinstance(candidate, dict):\n                raise HomeAssistantError("group must be an object")\n            candidate_functions = candidate.get("functions", [])\n''',
              '''            group_candidate = message.get("group")\n            if not isinstance(group_candidate, dict):\n                raise HomeAssistantError("group must be an object")\n            candidate = group_candidate\n            candidate_functions = candidate.get("functions", [])\n''',
          )
          PY
      - name: Verify syntax
        run: |
          python -m compileall -q \
            custom_components/extended_openai_conversation_responses/hot_path_cleanup.py \
            custom_components/extended_openai_conversation_responses/management_ui.py \
            tests/test_request_rules.py
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr17-ci-fix.yml
          git add \
            custom_components/extended_openai_conversation_responses/hot_path_cleanup.py \
            custom_components/extended_openai_conversation_responses/management_ui.py \
            tests/test_request_rules.py
          git commit -m "Fix PR17 matcher and CI regressions"
          git push
