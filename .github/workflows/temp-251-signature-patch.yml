name: Temporary PR 251 signature patch

on:
  push:
    branches:
      - fix/always-local-followups

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/always-local-followups

      - name: Make successful explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/extended_openai_conversation_responses/conversation.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("    def _local_rule_result(")
          end = text.index("    def _local_intent_result(", start)
          block = text[start:end]
          old = "        successful: bool = True,"
          if block.count(old) != 1:
              raise SystemExit(f"Expected exactly one local-rule success default, found {block.count(old)}")
          block = block.replace(old, "        successful: bool,")
          path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY

      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temp-251-signature-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/conversation.py .github/workflows/temp-251-signature-patch.yml
          git commit -m "fix: require explicit local rule outcome"
          git push
