name: PR222 MyPy fix

on:
  push:
    branches:
      - feature/unified-export-backup-import-restore

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unified-export-backup-import-restore
          fetch-depth: 0
      - name: Apply targeted typing fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('custom_components/extended_openai_conversation_responses/transfer.py')
          text = path.read_text()

          replacements = [
              (
                  '''    if SECTION_REQUEST_RULES in selected:\n        manager = await async_get_request_rules(\n            hass, entry.entry_id, subentry.subentry_id\n        )\n        payload[SECTION_REQUEST_RULES] = await manager.async_backup_data()\n''',
                  '''    if SECTION_REQUEST_RULES in selected:\n        request_rules_manager = await async_get_request_rules(\n            hass, entry.entry_id, subentry.subentry_id\n        )\n        payload[SECTION_REQUEST_RULES] = await request_rules_manager.async_backup_data()\n''',
              ),
              (
                  '''    if SECTION_PERSISTENT_MEMORY in selected:\n        manager = await async_get_memory(hass, entry.entry_id, subentry.subentry_id)\n        payload[SECTION_PERSISTENT_MEMORY] = await manager.async_backup_data()\n''',
                  '''    if SECTION_PERSISTENT_MEMORY in selected:\n        memory_manager = await async_get_memory(\n            hass, entry.entry_id, subentry.subentry_id\n        )\n        payload[SECTION_PERSISTENT_MEMORY] = await memory_manager.async_backup_data()\n''',
              ),
              (
                  '''    if SECTION_TEMPORARY_MEMORY in selected:\n        manager = await async_get_temporary_memory(\n            hass, entry.entry_id, subentry.subentry_id\n        )\n        payload[SECTION_TEMPORARY_MEMORY] = await manager.async_backup_data()\n''',
                  '''    if SECTION_TEMPORARY_MEMORY in selected:\n        temporary_memory_manager = await async_get_temporary_memory(\n            hass, entry.entry_id, subentry.subentry_id\n        )\n        payload[SECTION_TEMPORARY_MEMORY] = (\n            await temporary_memory_manager.async_backup_data()\n        )\n''',
              ),
              (
                  '''    if SECTION_KNOWLEDGE in selected:\n        manager = await async_get_knowledge(hass, entry.entry_id, subentry.subentry_id)\n        payload[SECTION_KNOWLEDGE] = await manager.async_backup_data()\n''',
                  '''    if SECTION_KNOWLEDGE in selected:\n        knowledge_manager = await async_get_knowledge(\n            hass, entry.entry_id, subentry.subentry_id\n        )\n        payload[SECTION_KNOWLEDGE] = await knowledge_manager.async_backup_data()\n''',
              ),
              (
                  '''    if SECTION_CONVERSATION_ARCHIVE in selected:\n        manager = await async_get_archive(hass, entry.entry_id, subentry.subentry_id)\n        payload[SECTION_CONVERSATION_ARCHIVE] = await manager.async_backup_data()\n''',
                  '''    if SECTION_CONVERSATION_ARCHIVE in selected:\n        archive_manager = await async_get_archive(\n            hass, entry.entry_id, subentry.subentry_id\n        )\n        payload[SECTION_CONVERSATION_ARCHIVE] = await archive_manager.async_backup_data()\n''',
              ),
              (
                  '''    if SECTION_USAGE in selected:\n        manager = await async_get_usage(hass, entry.entry_id, subentry.subentry_id)\n        payload[SECTION_USAGE] = await manager.async_backup_data()\n''',
                  '''    if SECTION_USAGE in selected:\n        usage_manager = await async_get_usage(hass, entry.entry_id, subentry.subentry_id)\n        payload[SECTION_USAGE] = await usage_manager.async_backup_data()\n''',
              ),
              (
                  '''    if SECTION_GUEST_MODE in selected:\n        manager = await async_get_guest_mode(hass, entry.entry_id, subentry.subentry_id)\n        payload[SECTION_GUEST_MODE] = await manager.async_backup_data()\n''',
                  '''    if SECTION_GUEST_MODE in selected:\n        guest_mode_manager = await async_get_guest_mode(\n            hass, entry.entry_id, subentry.subentry_id\n        )\n        payload[SECTION_GUEST_MODE] = await guest_mode_manager.async_backup_data()\n''',
              ),
              (
                  '''    if isinstance(value, dict):\n        return value == REDACTED_SECRET_SENTINEL\n    return value == _GENERIC_REDACTED_PLACEHOLDER\n''',
                  '''    if isinstance(value, dict):\n        return value == REDACTED_SECRET_SENTINEL\n    if isinstance(value, str):\n        return value == _GENERIC_REDACTED_PLACEHOLDER\n    return False\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/pr222-mypy-fix.yml').unlink()
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - name: Validate formatting
        shell: bash
        run: |
          pip install ruff==0.16.6
          ruff check --fix custom_components/extended_openai_conversation_responses/transfer.py
          ruff format custom_components/extended_openai_conversation_responses/transfer.py
          ruff check custom_components/extended_openai_conversation_responses/transfer.py
          ruff format --check custom_components/extended_openai_conversation_responses/transfer.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix unified transfer typing"
          git push origin HEAD:feature/unified-export-backup-import-restore
