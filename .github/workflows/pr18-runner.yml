name: Run PR18 focused patch

on:
  push:
    branches: [fix/pr18-request-rule-execution-safety]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr18-request-rule-execution-safety
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run embedded patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/pr18-apply.yml').read_text()
          marker = "          python - <<'PY'\n"
          end = "\n          PY\n"
          body = source.split(marker, 1)[1].split(end, 1)[0]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          )
          exec(compile(body, 'pr18-embedded-patch.py', 'exec'))
          Path('.github/workflows/pr18-runner.yml').unlink(missing_ok=True)
          PY
      - name: Format changed Python
        run: |
          python -m pip install ruff
          ruff format \
            custom_components/extended_openai_conversation_responses/request_rules.py \
            custom_components/extended_openai_conversation_responses/conversation.py \
            custom_components/extended_openai_conversation_responses/management_ui.py \
            tests/test_request_rules_pr18.py
          ruff check \
            custom_components/extended_openai_conversation_responses/request_rules.py \
            custom_components/extended_openai_conversation_responses/conversation.py \
            custom_components/extended_openai_conversation_responses/management_ui.py \
            tests/test_request_rules_pr18.py
      - name: Run focused frontend tests
        run: |
          node tests/frontend-state-safety.test.mjs
          node tests/request-rules-ui.test.mjs
          node tests/request-rules-pr18-ui.test.mjs
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Request Rule execution and editor safety'
          git push
