name: PR4 compatibility workbench
on:
  push:
    branches: [refactor/management-api-ownership]
    paths:
      - .github/workflows/pr4-compat-workbench.yml
      - scripts/pr4_compat_workbench.py
      - scripts/pr4_compat_resume.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.7'
      - name: Apply exactly the locally validated compatibility repair
        run: |
          python -m pip install ruff==0.16.8
          python scripts/pr4_compat_resume.py
          python -m compileall -q custom_components
          git diff --check
          git diff --stat
      - name: Commit verified implementation without merging
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components tests tests_real_ha
          git commit -m 'Complete HA result-read compatibility and retain cross-version regression assertions'
          git push origin HEAD:refactor/management-api-ownership
      - name: Export exact tracked source
        if: always()
        run: |
          git rev-parse HEAD > source-sha.txt
          git archive HEAD | gzip > pr4-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr4-compat-source
          path: |
            source-sha.txt
            pr4-source.tar.gz
          retention-days: 2
