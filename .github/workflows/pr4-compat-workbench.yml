name: PR4 compatibility workbench
on:
  push:
    branches: [refactor/management-api-ownership]
    paths:
      - .github/workflows/pr4-compat-workbench.yml
      - scripts/pr4_compat_workbench.py
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Export exact tracked source
        run: |
          git rev-parse HEAD > source-sha.txt
          git archive HEAD | gzip > pr4-source.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr4-compat-source
          path: |
            source-sha.txt
            pr4-source.tar.gz
          retention-days: 2
