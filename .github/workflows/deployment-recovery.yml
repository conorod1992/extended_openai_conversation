name: Deployment recovery boundaries

on:
  schedule:
    - cron: "27 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/deployment-recovery.yml"
      - "playwright.real-ha-shell.config.mjs"
      - "tests_browser/real-ha-https-proxy.spec.mjs"
      - "tests_real_ha/test_https_proxy_acceptance.py"
      - "tests_real_ha/test_native_ha_backup_restore.py"
      - "custom_components/extended_openai_conversation_responses/**"
      - "requirements_test.txt"

permissions:
  contents: read

concurrency:
  group: deployment-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-recovery:
    name: Native HA backup + HTTPS proxy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Install stable Home Assistant and test dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          VERSION="$(curl -fsSL https://pypi.org/pypi/homeassistant/json | python -c 'import json,sys; print(json.load(sys.stdin)["info"]["version"])')"
          PLUGIN_VERSION="$(python ci/resolve_ha_test_plugin.py "$VERSION")"
          pip install -r requirements_test.txt
          pip install "pytest-homeassistant-custom-component==$PLUGIN_VERSION" "homeassistant==$VERSION"
          python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          python -m pip check
          echo "EOAI_EXPECTED_HA_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up Chromium
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Playwright runner and browser
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0
          npx playwright install --with-deps chromium

      - name: Run deployment recovery acceptance
        env:
          RUN_REAL_HA_BROWSER: "1"
          STRESS_SEED: "424242"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest             tests_real_ha/test_native_ha_backup_restore.py             tests_real_ha/test_https_proxy_acceptance.py             -v -s --asyncio-mode=auto --timeout=300 --tb=short

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-recovery-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
