name: Temporary regex test compatibility

on:
  push:
    branches:
      - fix/regex-process-isolation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/regex-process-isolation
      - name: Update delayed validation tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_delayed_tool_lifecycle.py')
          text = path.read_text()
          old = '''        "validate_function_arguments",\n        MagicMock(side_effect=lambda _spec, values: dict(values)),\n'''
          new = '''        "async_validate_function_arguments",\n        AsyncMock(side_effect=lambda _hass, _spec, values: dict(values)),\n'''
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 delayed validation test stubs, found {count}')
          path.write_text(text.replace(old, new))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_delayed_tool_lifecycle.py
          git commit -m 'Update delayed tool tests for async regex validation'
          git push origin HEAD:fix/regex-process-isolation
