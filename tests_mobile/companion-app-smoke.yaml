appId: io.homeassistant.companion.android
---
- launchApp:
    # The workflow clears state before Maestro opens its ADB/driver channels.
    clearState: false
    permissions:
      all: allow

# A slow first emulator boot can leave a Pixel Launcher ANR over the app.
# Recover that specific system dialog before exercising Companion onboarding.
- runFlow:
    when:
      visible: "Pixel Launcher isn.t responding"
    commands:
      - tapOn: "Close app"

- tapOn:
    text: '(?s)Connect to my Home.*Assistant server'
    retryTapIfNoChange: true

- tapOn:
    text: "Don.t allow"
    optional: true
    retryTapIfNoChange: true

- tapOn:
    text: "Enter address manually"
    retryTapIfNoChange: true

- assertVisible:
    text: '(?s)What is your Home.*Assistant address.*'
- tapOn: "http://homeassistant.local:8123"
- inputText: ${HOME_ASSISTANT_URL}
- hideKeyboard
- tapOn:
    text: "Connect"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Forgot password?"
    timeout: 60000

- tapOn: "Username"
- inputText: ${HOME_ASSISTANT_USERNAME}
- tapOn: "Password"
- inputText: ${HOME_ASSISTANT_PASSWORD}
- hideKeyboard
- pressKey: Enter
- tapOn:
    text: "Authorize"
    optional: true

- extendedWaitUntil:
    visible: "How would you like to name this device?"
    timeout: 60000
- tapOn:
    text: "Save"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Got it"
    timeout: 30000
- tapOn:
    text: "Got it"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Use this device's location for automations"
    timeout: 15000
- tapOn:
    text: "Do not share my location"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible: "Let us help secure your remote connection"
    timeout: 15000
- tapOn:
    text: "Less secure: Do not allow this app to know when you're home"
    retryTapIfNoChange: true
- tapOn:
    text: "Next"
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      text: '(?i)^(Overview|More details|Do not allow)$'
    timeout: 60000
- tapOn:
    text: "Do not allow"
    optional: true
    retryTapIfNoChange: true

- extendedWaitUntil:
    visible:
      text: '(?i)^Overview$'
    timeout: 60000

# Use the Companion app's exported navigation boundary rather than manipulating
# WebView state. This exercises the app -> HA frontend transition users actually use.
- openLink: "homeassistant://navigate/extended-openai/assistant/basics"

- extendedWaitUntil:
    visible: "Extended OpenAI"
    timeout: 60000
- extendedWaitUntil:
    visible: "Agent name"
    timeout: 30000

# Edit through the WebView using the Android on-screen input path.
- scrollUntilVisible:
    element:
      text: "Companion acceptance assistant"
      below: "Agent name"
    direction: DOWN
- tapOn:
    text: "Companion acceptance assistant"
    below: "Agent name"
# A tap places the caret in the middle of the WebView text field. Move it past
# the full initial title before backspacing, without relying on selection menus.
- repeat:
    times: 32
    commands:
      - pressKey: "Remote Dpad Right"
- eraseText: 100
- inputText: "Companion app saved title"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Listen for a follow-up"
    direction: DOWN
# Android WebView omits the dynamically inserted save bar from its accessibility
# tree. At the end of Basics on the pinned Pixel 6, its Save button is here.
- swipe:
    start: "50%, 80%"
    end: "50%, 20%"
- tapOn:
    point: "75%, 90%"
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      text: "Companion app saved title"
    direction: UP
- extendedWaitUntil:
    visible: "Companion app saved title"
    timeout: 30000

# Exercise native Activity/WebView suspension and restoration.
- pressKey: Home
- launchApp:
    stopApp: false
- scrollUntilVisible:
    element:
      text: "Companion app saved title"
    direction: UP
- extendedWaitUntil:
    visible: "Companion app saved title"
    timeout: 60000

# Re-enter through the app's navigation handler to rule out a retained DOM-only value.
- openLink: "homeassistant://navigate/extended-openai/assistant/basics"
- scrollUntilVisible:
    element:
      text: "Companion app saved title"
    direction: UP
- extendedWaitUntil:
    visible: "Companion app saved title"
    timeout: 60000
